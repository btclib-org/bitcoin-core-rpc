---
name: release

# one pipeline, two targets:
# - pushing a v<version> tag runs the full test matrix, builds and
#   checks the distribution files, publishes them to PyPI, and turns
#   the tag into a GitHub release whose notes come from RELEASE_NOTES.md
# - workflow_dispatch is the rehearsal: the same pipeline from any
#   branch, publishing to TestPyPI under a unique .dev<N> version.
#   A rehearsal is never tagged
# Both indices trust this workflow directly (PyPI Trusted Publishing,
# see RELEASING.md): there is no API token to store or leak
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# never two runs of this workflow at once, and never a cancellation: the
# other workflows cancel a superseded run because their subject is the
# commit, and a newer commit supersedes the answer. Here the subject is a
# publication -- a version on an index, an attestation, a release -- so a
# second run is a second attempt at the same side effects, and cancelling
# one halfway is how a version reaches PyPI with no release cut for it.
# Named literally, as everywhere else: github.workflow in a called
# workflow is the caller's name, and this one calls several --
# `grep -n 'uses: \./\.github/workflows' .github/workflows/release.yml`
# is which, in the tree that is asking, rather than a number here that
# the next reusable workflow added below makes wrong
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # what a version cannot survive being wrong about, checked before
  # anything is built and long before anything is uploaded: a version is
  # consumed by the upload that carries it, and can then only be yanked.
  # A minute of checking, ahead of an hour of building.
  # The rehearsal runs this too, so a mismatch cannot wait for release day
  # to surface; only the tag comparison is release-only, there being no
  # tag to compare against otherwise
  version-check:
    name: Check the declared versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version-suffix: ${{ steps.suffix.outputs.version-suffix }}
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token. It matters most in
      # this workflow, where a job holds an OIDC token PyPI accepts
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
          # the whole history, where every other checkout in these
          # workflows takes the default single commit: the ancestry check
          # below has nothing to answer with otherwise, and it is also what
          # puts origin/<default branch> in this checkout at all. Only this
          # job pays for it, and it pays once per release -- this
          # repository is a small package and its tests, so the history
          # `fetch-depth: 0` pulls is small next to what `test`, `lint` and
          # the rest of this same run already cost
          fetch-depth: 0
      # a tag is a name that can point anywhere, and nothing else in this
      # workflow asks where: every check below reads the tree the tag names
      # rather than where that tree came from. So a tag pushed from a stale
      # worktree, or from a branch whose pull request is still open, or
      # from a commit squashed away on its way into the default branch,
      # would publish code no review ever approved and no branch contains.
      # `git merge-base --is-ancestor` is the whole of the question.
      # Release-only, like the two checks below and for the same reason: a
      # rehearsal is dispatched from a branch on purpose, that being what
      # it is for.
      # The default branch is read from the event rather than written as
      # `main`: this is the one check whose subject is that branch, so it
      # has to keep meaning what it says the day the name changes
      - name: Check that the tag is merged into the default branch (release only)
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" >/dev/null; then
            msg="fetch-depth: 0 on the checkout above is what puts it there"
            echo "::error::origin/$DEFAULT_BRANCH is not in this checkout; $msg"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            msg="a release is tagged on a commit that branch contains"
            echo "::error::$commit is not an ancestor of $DEFAULT_BRANCH; $msg"
            exit 1
          fi
          echo "$commit is an ancestor of $DEFAULT_BRANCH"
      # caching off in this job, unlike every other in these workflows: a
      # cache entry is written by whichever run populated it, and read here
      # through the scoping that gives a tag push the caches of the default
      # branch. This is the workflow whose jobs hold an OIDC token PyPI
      # accepts, so this one downloads its dependencies afresh every time.
      # It costs seconds, once per release.
      # Spelled out rather than left off: the input defaults to "auto",
      # which means enabled on a GitHub-hosted runner
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # every other uv command in these workflows passes --locked, which
      # asserts the same thing, so this is the named early gate rather
      # than the only one. --locked and not --frozen, there and here:
      # --frozen takes uv.lock as it finds it and never checks it, so a
      # dependency added to pyproject.toml without a re-lock goes
      # unnoticed while nothing installs it
      - name: Check that uv.lock is up to date
        run: uv lock --check
      # one comparison: pyproject.toml is the only place the version is
      # declared -- docs/source/conf.py reads it from the file, and the
      # module carries no version constant at all -- so there is no second
      # declaration to disagree with. uv.lock carries the project version
      # too, which is what the check above covers
      - name: Check that the tag matches the declared version (release only)
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          echo "pyproject.toml declares $version"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $version"
            exit 1
          fi
          # the trigger decides the index, so a tagged pre-release goes to
          # PyPI itself: a v2026.8rc1 tag on a tree declaring 2026.8rc1
          # passes the comparison above and burns a version that a --pre
          # install would then resolve. RELEASING.md sends a trial run to
          # TestPyPI through workflow_dispatch and says never to tag one;
          # this is the check for it. Digits and dots only, and nothing
          # PEP 440 reads as a pre-release, a dev build or a post release
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            msg="rehearse on TestPyPI via workflow_dispatch instead"
            echo "::error::$version is not a final version; $msg"
            exit 1
          fi
          # three components at least: the day is not optional on
          # anything this pushes to PyPI, only on the placeholder "Open
          # the next cycle" sets between releases -- which is never
          # tagged, so this check never sees it. Without this, "v2026.9"
          # passes every check above it and publishes a version with no
          # day, indistinguishable from the placeholder that names the
          # same month. It is the second guard on that placeholder and
          # not the only one: the heading check below refuses it too, its
          # own RELEASE_NOTES.md and CHANGELOG.md section still reading
          # "(work in progress, not released yet)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            msg="a release is YYYY.M.D, optionally YYYY.M.D.N for a patch"
            echo "::error::$version has no day; $msg"
            exit 1
          fi
      # the release notes are RELEASE_NOTES.md's section for the tag,
      # lifted by the github-release job below, and its fallback fires
      # only on an *empty* section: "## v2026.8 (work in progress, not
      # released yet)" matches that job's heading regex, the tag being
      # followed by a space, so a forgotten retitle publishes the
      # work-in-progress text as the release notes, silently. This is the
      # check for it, and it belongs here rather than in github-release
      # because that job runs after PyPI has accepted the files, and a
      # version cannot be unpublished.
      # CHANGELOG.md is checked too: RELEASING.md retitles the two
      # together, RELEASE_NOTES.md's section points at CHANGELOG.md's for
      # the detail, and a heading left as "work in progress" makes that a
      # link into nothing.
      # Release-only, like the comparison above, and for the same reason:
      # a rehearsal is what runs *before* the retitle, so requiring it
      # there would forbid the dry run it exists to be.
      # String comparison rather than a regex, so that the dots of the
      # version match dots and not any character, and awk rather than
      # grep, one pass answering all three questions
      - name: Check that the release notes are retitled for the tag (release only)
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          for file in RELEASE_NOTES.md CHANGELOG.md; do
            awk -v tag="v$version" -v file="$file" '
              $0 == "## " tag {heading = NR; next}
              index($0, "## " tag " ") == 1 {heading = NR; extra = $0; next}
              /^## / && heading {exit}
              heading && NF {body = 1}
              END {
                if (!heading) {
                  printf "::error::%s has no \"## %s\" section\n", file, tag
                  exit 1
                }
                if (extra) {
                  printf "::error::%s:%d is \"%s\"; the heading must be \"## %s\" alone\n",
                    file, heading, extra, tag
                  exit 1
                }
                if (!body) {
                  printf "::error::%s section \"## %s\" is empty\n", file, tag
                  exit 1
                }
                printf "%s has a non-empty \"## %s\" section\n", file, tag
              }
            ' "$file"
          done
      # TestPyPI refuses a version it has already seen: the rehearsal
      # appends .dev<run number * 100 + attempt>, unique per dispatch and
      # per re-run of one, and sorted before the release it rehearses
      # (PEP 440). A re-run keeps the run's own id and number and only
      # raises run_attempt, so .dev<run number> alone was identical
      # across every re-run of one dispatch and collided with itself on
      # TestPyPI the moment a rehearsal was re-run rather than freshly
      # dispatched (issue #157). Multiplying the run number by 100 and
      # adding the attempt keeps both properties at once: every attempt
      # of every run is still unique, and, because the attempt never
      # reaches the run number's own place value, attempt 2 of run 7
      # (702) still sorts after every attempt of run 6 (600-699) -- the
      # ordering .dev<run><attempt> concatenation would have kept only
      # while the two numbers' digit counts happened to line up. The two
      # digits reserved for the attempt are checked, not assumed.
      # Computed here rather than inside test.yml's `dist` job, which is
      # what applies it (issue #1166): every job this workflow dispatches
      # during one run has to agree on the same suffix, and this is the
      # one job every one of them already depends on, directly or
      # through `test`
      - name: Compute the rehearsal version suffix
        id: suffix
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 99 ]; then
            echo "::error::attempt $GITHUB_RUN_ATTEMPT exceeds the two digits reserved for it"
            exit 1
          fi
          suffix=".dev$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "run $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT: $suffix"
          echo "version-suffix=$suffix" >> "$GITHUB_OUTPUT"

  # what the suite cannot ask: did this release take something the last
  # one gave. census_test.py asserts that `__all__` is
  # declared and that what it names exists, which answers whether the
  # surface is *stated* and never whether it *changed*; RELEASE_NOTES.md
  # is where a caller is told to act and is written by hand, so nothing in
  # the tree notices an entry that is missing.
  #
  # The release path and not the merge gate, which is the choice worth
  # stating because the second reads as stricter. Before 1.0 a package
  # breaks its surface deliberately, so a gate reporting every break has
  # nothing to say about which of them are allowed and ends in a human
  # deciding -- this answer, arriving more often and earlier than it is
  # wanted. Here it arrives once, where RELEASE_NOTES.md is being written
  public-api:
    name: Check the public API against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the previous tag has to be reachable in this checkout for the
          # step below to find it, and the single-commit checkout every
          # other job here takes would not carry it
          fetch-depth: 0
          fetch-tags: true
      # a release tag is already on the remote by the time this job runs,
      # so the "latest tag" griffe resolves on its own is the release being
      # cut rather than the one before it -- and a tag compared against
      # itself reports no break whatever changed. The previous tag is
      # resolved explicitly instead, by walking the ref's own ancestry
      # rather than by a version sort, so a tag pushed on a branch this
      # history never merged is not taken as "previous". A rehearsal has no
      # tag of its own and asks from HEAD directly
      - name: Resolve the previous release
        id: previous
        env:
          REF: >-
            ${{ github.event_name == 'push' && format('{0}^', github.ref_name)
            || 'HEAD' }}
        run: |
          if tag=$(git describe --tags --abbrev=0 --match 'v*' "$REF" 2>&1); then
            echo "previous release: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "has-previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "no previous v* tag reachable from $REF: $tag"
            echo "has-previous=false" >> "$GITHUB_OUTPUT"
          fi
      # caching off, as in version-check above and for the reason given
      # there: this job runs on the triggers that comment names, and must
      # not trust a cache entry written by a run it cannot vouch for
      - name: Setup uv
        if: steps.previous.outputs.has-previous == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # griffe runs from PyPI through uvx rather than from a dependency
      # group: unlike pre-commit, which uv.lock pins because every
      # contributor's own run has to agree with the gate's, this runs at
      # release time only and on one maintainer's action, so a group buys
      # a reproducibility nothing here needs. The version pin is what
      # keeps the comparison from answering differently on two release
      # days for a reason belonging to neither release.
      # -s . -s src covers both layouts this package has published under:
      # the tags through v2026.8.20 carry bitcoin_core_rpc/ at the
      # repository root and the working tree has it under src/, and a
      # search path finding nothing in one reference is skipped in favour
      # of the other -- so this line does not have to change once a tag
      # carries the src layout too.
      # No base ref on a rehearsal: workflow_dispatch has no tag to read a
      # public surface at, so the comparison falls back to griffe's own
      # default, which is the current code
      - name: Check the public API against the previous release
        if: steps.previous.outputs.has-previous == 'true'
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          BASE_REF: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          base_args=()
          if [ -n "$BASE_REF" ]; then
            base_args=(-b "$BASE_REF")
          fi
          if ! uvx griffe==2.2.0 check bitcoin_core_rpc -s . -s src \
              -a "$PREVIOUS_TAG" "${base_args[@]}" -f github; then
            msg="the public API changed since $PREVIOUS_TAG:"
            echo "::error::$msg add a breaking-changes bullet to" \
              "RELEASE_NOTES.md, or say here why the change is not one"
            exit 1
          fi
      - name: Skip the check (no previous release to compare against)
        if: steps.previous.outputs.has-previous == 'false'
        run: |
          echo "::notice::no previous v* tag is reachable; nothing to" \
            "compare this release's public API against"

  # the whole build/test matrix, exactly as a pull request runs it, and
  # now the build too: test.yml's `dist` job builds the distribution
  # files, checks them and uploads them, so this call is what makes them
  # exist for the publish jobs below to download (issue #1166).
  # REPOSITORY.md's "Token permissions" section has why this job names
  # a `permissions:` block of its own
  test:
    name: Run the test workflow
    needs: version-check
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    with:
      # what keeps this run out of the branch concurrency groups: see the
      # group in test.yml
      concurrency-suffix: "-release"
      # empty on the tag path, where the step above is skipped and a
      # skipped step's output is the empty string: a release ships the
      # version the tree declares
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}
      # only this call sets it too: this is the run whose dist job
      # builds what a tag or a rehearsal actually publishes, so its
      # Setup uv step must not trust a cache another run wrote. See the
      # input's own description in test.yml
      disable-dist-cache: true

  # and the same checks a pull request lints with: without this, a tag
  # push could publish code the pre-commit hooks reject. Not gated on
  # version-check: this is the cheap one, and it runs in parallel with it
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml
    with:
      # see the test job above
      concurrency-suffix: "-release"

  # and the documentation build, for the reason the lint call above gives: a
  # tag publishes the docstrings read the docs will render from it, so the
  # build that would fail there fails here first. It has a workflow of its
  # own now, so calling lint.yml no longer covers it
  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml

  # and the two images the merge gate does not wait for: each runs weekly,
  # so a regression there could otherwise sit on main until the morning
  # after the tag. Neither is gated on version-check, both being cheap
  # parallel answers -- cheap in work, that is: they are the slowest calls
  # here in wall clock, and a release is the one place that is worth paying
  # for
  macos:
    name: Run the macos workflow
    uses: ./.github/workflows/os-macos.yml

  ubuntu:
    name: Run the ubuntu workflow
    uses: ./.github/workflows/os-ubuntu.yml

  windows:
    name: Run the windows workflow
    uses: ./.github/workflows/os-windows.yml

  # and the one claim a recorded reply cannot make: that a live bitcoind
  # still answers the way tests/_data says it does. It gates every pull
  # request already, so the commits under a tag have been asked -- but the
  # tag's own tree has not, and a release is the last moment where the
  # answer is still cheap to act on. integration-bitcoind.yml has declared
  # workflow_call for this since it became a gate; until now nothing called
  # it, which made that trigger a promise the file kept and this one did not
  integration:
    name: Run the integration workflow
    uses: ./.github/workflows/integration-bitcoind.yml

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [public-api, test, lint, docs, ubuntu, macos, windows, integration]
    # public-api stays a need for the ordering -- its reading arrives
    # before the upload rather than beside it -- and not for its result:
    # it exits 1 on any break in the public surface since the last tag,
    # which is what a cycle with breaking changes produces by design, and
    # a bare `needs` refuses to start this job when any listed job failed
    # or was skipped. `always()` is what opts back in, and the `.result`
    # checks beside it are what keep every other listed job the gate it
    # is. Section 12 of the organization standard has the rule;
    # github-release's comment below is this tree's account of the same
    # refusal, behind a skipped job rather than a failed one
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.repository == 'btclib-org/bitcoin-core-rpc' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success' && needs.ubuntu.result == 'success' &&
      needs.macos.result == 'success' && needs.windows.result == 'success' &&
      needs.integration.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/bitcoin-core-rpc/
    permissions:
      # OIDC: this is what lets TestPyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [public-api, test, lint, docs, ubuntu, macos, windows, integration]
    # see publish-testpypi: public-api is a need for the ordering and not
    # for its result, on a tag exactly as on a rehearsal
    if: >-
      always() && github.event_name == 'push' &&
      github.repository == 'btclib-org/bitcoin-core-rpc' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success' && needs.ubuntu.result == 'success' &&
      needs.macos.result == 'success' && needs.windows.result == 'success' &&
      needs.integration.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deployment gate: configure required reviewers on the "pypi"
    # environment to require a manual approval before publishing
    environment:
      name: pypi
      url: https://pypi.org/project/bitcoin-core-rpc/
    permissions:
      # OIDC: this is what lets PyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # what RELEASING.md used to ask for by hand, right here: the sentinel on
  # what the index serves, against the version this run just published. It
  # waits for the file to be served before installing, so it cannot pass by
  # testing the previous release, and it runs beside github-release rather
  # than before it -- a release announcing files that do not install is
  # worse than a release announced a minute later, but the announcement is
  # not what makes them installable
  published:
    name: Install the published version from PyPI
    needs: publish-pypi
    # publish-pypi's own `always()` opts it back in past public-api's
    # designed failure and does not carry this job with it: a bare
    # `needs` here still reads back through publish-pypi's own `needs`,
    # and public-api two hops away skips this job although the one
    # dependency it lists succeeded. github-release's comment below has
    # the mechanism
    if: always() && needs.publish-pypi.result == 'success'
    uses: ./.github/workflows/pypi-install.yml
    with:
      version: ${{ github.ref_name }}

  # the same files reach users by two routes and only one of them carried
  # provenance: the publish action above generates PEP 740 attestations
  # for the copies on the index, while the copies attached to the GitHub
  # release below carried nothing. This job signs them, and the digests
  # are the index's own, the dist artifact being downloaded here rather
  # than rebuilt.
  # A job of its own rather than two more permissions on github-release:
  # this workflow elevates one job at a time, and the one that writes
  # releases has no reason to also hold an OIDC token. It is not in
  # test.yml's `dist` job for the stronger form of the same reason -- that
  # job runs the build backend and installs the wheel it just built, and a
  # token minted there would be minted beside third-party code.
  # After a publish and not after the build, so that a run reaching here
  # is a run the environment approval already let through: without that,
  # a dispatch from any branch would sign whatever that branch built.
  # Whichever publish ran, though -- the rehearsal signs its own .dev
  # files, and that is the point of it: everything else in this job is a
  # permission and an API that would otherwise be exercised for the first
  # time on release day, where a failure lands after PyPI has the files
  # and the tag can no longer be moved
  attest:
    name: Attest the distribution files
    needs: [publish-pypi, publish-testpypi]
    # always(), the other publish job being skipped rather than run, and
    # a skipped job is one `needs` treats as failed
    if: >-
      always() && (needs.publish-pypi.result == 'success' ||
      needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # OIDC for the short-lived Sigstore signing certificate, and the
      # write that persists the attestation against the repository
      id-token: write
      attestations: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # actions/attest and not the attest-build-provenance wrapper around
      # it: as of v4 the wrapper is a composite that does nothing but call
      # this, and its own README sends new callers here. No predicate
      # input is what selects SLSA build provenance.
      # One attestation, both files: the statement carries every subject
      # the glob matched, so verifying either the wheel or the sdist
      # against the bundle below works
      - name: Attest the distribution files
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      # the bundle is the signed statement itself, and the job below
      # attaches it to the release: that is what lets `gh attestation
      # verify --bundle` read it from disk instead of from the
      # attestations API, for whoever mirrors the releases page rather
      # than trusting it live.
      # Copied into the workspace rather than uploaded where the action
      # left it, under $RUNNER_TEMP: an upload takes its layout from the
      # paths it matched, and one outside the workspace is one more thing
      # to be right about than a fixed name here
      - name: Collect the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.jsonl
      - name: Upload the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation
          path: attestation.jsonl

  # only after PyPI has accepted the files: a GitHub release announces
  # what users can already install. Both jobs above it and not attest
  # alone: attest runs in a rehearsal too, so naming it by itself would
  # cut a release from a dispatch. attest earns its place in the list by
  # producing the bundle attached below; a failure there leaves the
  # version published and no release cut, which `gh run rerun --failed`
  # finishes without rebuilding anything -- a *failure* there, that is,
  # which is not the case the `if` below is for.
  # That `if` is what makes this job run at all, and `always()` is its
  # load-bearing half rather than a formality beside the two `.result`
  # checks: a job standing behind a skipped ancestor is skipped whatever
  # its own needs report, and a condition not beginning with `always()`
  # (or `failure()`, or `cancelled()`) is not evaluated there at all, so
  # the checks on their own would be the same skip with a rationale
  # attached. The opt-out holds for the job that says it and not for
  # whoever needs that job: attest needs publish-testpypi, which a tag
  # push skips, attest's own `always()` is what keeps attest running,
  # and this job sits behind that same skipped ancestor. Leaving the
  # condition implicit -- publish-pypi being skipped on a dispatch is
  # what would otherwise hold this job to the tag -- therefore skips it
  # on the tag as well, publishing the version and cutting no release.
  # Written out, the condition answers a dispatch the same way,
  # publish-pypi's result there being `skipped` and not `success`, and
  # asks about nothing else in the run: a failure elsewhere -- the
  # published job beside this one, verifying an install PyPI has already
  # accepted -- cannot bear on whether an already installable version is
  # announced
  github-release:
    name: Attach the files to the GitHub release
    needs: [publish-pypi, attest]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # the one job that writes to the repository through its token, and
      # what it writes is a release; the attestation the job above signed
      # went to the attestations API under a permission of its own
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # into a directory of its own, so that the dist/* glob below stays
      # the distribution files and nothing else
      - name: Download the attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation
          path: attestation/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # the release notes are the tag's own section of RELEASE_NOTES.md;
        # if the section is missing the release still happens, with
        # notes generated from the merged pull requests instead.
        # The fallback is the safety net for a tag pushed past a red
        # version-check, not the check itself: version-check has already
        # refused a tag whose RELEASE_NOTES.md heading carries anything
        # after the version -- "(work in progress, not released yet)"
        # matches the regex below and is not empty, so nothing here would
        # notice
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" {found=1; next}
            /^## / && found {exit}
            found {print}
          ' RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          # named for the tag only here, where the ref is one: nothing
          # inside the bundle says which release it belongs to, the way
          # the distribution files' own names do
          bundle="$GITHUB_REF_NAME.attestation.jsonl"
          cp attestation/attestation.jsonl "$bundle"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* "$bundle" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::RELEASE_NOTES.md has no $GITHUB_REF_NAME section"
            gh release create "$GITHUB_REF_NAME" dist/* "$bundle" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # the sentinel on the documentation, which nothing here was watching:
  # read the docs activates and builds a new release tag from an
  # automation rule of its own, and a build that never starts fails
  # nothing -- a site answering 200 serves the last build that succeeded,
  # for as long as that takes somebody to notice. btclib's RELEASING.md
  # records the aggravated form of exactly this: a webhook refusing every
  # delivery with a 400 for three years while the site kept answering 200
  # from 2023, undocumenting two releases before anybody noticed. This is
  # issue #154.
  # The rendered URL and not the v3 API, which is the reverse of what
  # `published` above does with PyPI's: read the docs throttles an
  # unauthenticated caller and blocks requests from a cloud provider
  # outright without a token, so asking the API from a runner would mean
  # storing a credential for a check that gates nothing. /en/<tag>/ is
  # CDN-served, answers 404 for a version that is inactive or has no
  # successful build, and is the URL a reader follows anyway.
  # Release-only, a rehearsal never being tagged; after version-check, so
  # a tag it refuses produces one verdict and not two; and nothing needs
  # it: a late documentation build is not a reason to withhold a wheel,
  # and the fix for a red run here is a build on their side, not a moved
  # tag
  #
  # The wait itself is `.github/scripts/wait_for_readthedocs_build.py`
  # rather than a shell loop written out here, which is what gives it a
  # test: a tag is the only trigger that reaches it, so a loop kept in
  # this file is first executed on the day a release depends on it. The
  # script's budget is a deadline and not a count of attempts, and that
  # deadline is set below this job's timeout-minutes, so the script's
  # `::error::` runs rather than being killed inside the wait it exists
  # to report on (btclib-org/btclib#1165).
  # `tests/wait_for_readthedocs_build_test.py` is what drives the retry,
  # the deadline and the annotation.
  #
  # What the wait still cannot do is tell "still building" from "will
  # never build": /en/<tag>/ answers 404 for both, and the v3 API that
  # separates them is ruled out above for a reason that still holds. What
  # it does instead is carry the last answer read the docs gave rather
  # than discard it, so the verdict names what the URL last said and
  # where the reason for it is written, rather than only that the job
  # waited
  documented:
    name: Check read the docs built the tag
    needs: version-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # sparse, for the reason pypi-install.yml's wait job gives: what
      # lands is .github/scripts plus the repository root, cone mode
      # being the default and root files always being in the cone. This
      # job builds nothing and installs nothing, and the root's
      # pyproject.toml is inert besides, --no-project ignoring it
      - name: Check out the wait script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # caching off, as in version-check above: a cache entry is written
      # by whichever run populated it, and this job runs on the tag push
      # that job's own comment gives for downloading fresh rather than
      # trusting one a pull request's jobs wrote and this run cannot
      # vouch for. There is little to cache here in any case, the step
      # below installing nothing
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # --no-project, so it runs on the interpreter uv fetches and
      # installs nothing: the script takes the standard library alone
      - name: Wait for the tag's documentation to be served
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/wait_for_readthedocs_build.py bitcoin-core-rpc "$TAG"
