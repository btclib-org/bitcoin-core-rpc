---
name: links

# a real check, and no per-link suppression directives: disable/enable
# comment pairs guard the links somebody once worried about, while the
# ones that actually rot -- tools.ietf.org redirecting, an http:// badge
# -- land outside every pair.
#
# Not a pull request gate, and that is the whole design. A link rots
# without anybody touching the repository, so testing it per commit reports
# the internet's weather on somebody else's branch; and a third party
# returning 502 or throttling a runner would turn a red merge into a thing
# to re-run rather than a thing to fix. Weekly, on demand, and red in the
# Actions tab is where this belongs.
# It therefore does not appear in main's required checks, and must not:
# that rule lives outside the repository and names its checks as literal
# strings

on:
  schedule:
    # Monday, with vendored data an hour later where a repository has
    # any: both ask whether what this tree points at is still there.
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "12 4 * * 1"
  # the escape hatch, and the way to check a branch before merging a
  # documentation change that adds links
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures.
  # This runs more often than the paths list suggests, and the difference is
  # worth knowing: the filter is evaluated against the pull request's whole
  # diff against its base, not against the push that triggered the run, so
  # once a pull request touches this file every later push to that branch
  # runs it too. Harmless -- it gates nothing -- but it does mean a
  # transient failure shows up on pushes that changed no link at all
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, which this workflow has no push
    # trigger to collide with, but the weekly schedule and a
    # workflow_dispatch both also run on the default branch and would
    # resolve to that same ref -- the concurrency block below groups a
    # pull_request run by the pull request's own number instead, immune
    # to that under any action, on the same reasoning applied where it
    # was observed to matter, in this repository's push-triggered gates
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml

# least privilege for the GITHUB_TOKEN. lychee is given it for github.com
# links only, where an unauthenticated runner is rate limited hard enough
# to look like rot; contents: read is all that needs.
# Deliberately not issues: write: an automatic "link rot" issue is the
# usual next step here, and it would be the only workflow in this
# repository that can write anything, to save a maintainer from reading a
# failure notification they already get
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by -- the pull_request trigger's
# own comment above has the reasoning. Neither schedule nor
# workflow_dispatch carries pull_request context, so github.ref is still
# what groups either, unchanged
concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check the documentation links
    # a draft pull request is work in progress and spends no runner
    # here either: the same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason.
    # A closed pull request spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a few hundred requests with retries; a job past this is hung on one
    timeout-minutes: 15
    steps:
      # every action pinned to a commit SHA with the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Check the links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # the prose, not the code: the module cites Core's own sources
          # and RFCs in its comments, and a citation is a reference rather
          # than a link a reader clicks. What is checked is what a user is
          # invited to follow -- the README, which is also the PyPI long
          # description, the other root markdown files, the documentation
          # sources, and the markdown kept under tests/, next to what it
          # documents rather than at the root: _data/README.md says where
          # each recorded reply came from and how to check a copy against
          # a live node, prose for a reader rather than a citation in a
          # comment.
          # --no-progress because the log is not a terminal; the retries
          # and the timeout are what keep a slow or throttling host from
          # being reported as a dead one.
          # --timeout 45, against lychee's default of 20: what is being
          # bought is the difference between a host that is slow from a
          # runner and a host that is gone, and lychee's default is short
          # enough to report the first as the second -- with the retries
          # above making it three timeouts rather than one. A live host
          # unreachable for a minute is the failure mode this workflow was
          # built not to gate on. If a URL times out run after run it
          # belongs in a .lycheeignore, with the measurement beside it, and
          # not here.
          # No --cache: the flag writes a cache file at the end of a run,
          # and no step here saves or restores it, so the next run starts
          # from a fresh workspace and reads nothing. It decided nothing
          # within a run either, lychee collapsing repeated URLs on its own
          # (btclib-org/.github#111 has the measurement). A flag that is
          # passed and does nothing reads as a mechanism, and the sentence
          # that used to credit it with absorbing a throttling host
          # described one that was not there.
          # --accept: lychee's own default range with 429 added to it,
          # rather than a list of codes: `lychee --help` gives that default
          # as 100..=103,200..=299, and the flag replaces the range rather
          # than adding to it, so the "200,206,429" this file used to pass
          # narrowed it -- a 201 or a 204 became a dead link -- to add a
          # 206 the default already covered. 429 is the one code worth
          # adding, a rate limit being an answer from a host that is alive
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 45
            --accept 100..=103,200..=299,429
            "*.md" "docs/**/*.rst" "docs/**/*.md" "tests/**/*.md"
          # fail the job, rather than only summarizing: a green run that
          # found dead links is the state this workflow exists to end
          fail: true
        env:
          # for github.com links only, per the permissions comment above
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
