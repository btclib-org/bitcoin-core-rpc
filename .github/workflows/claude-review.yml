---
name: claude-review

# Claude reading a pull request against REVIEWING.md, which is the standard
# a review here is written against. The prompt, the credential guard, the
# action, the verdict check and the @claude answer are
# `btclib-org/.github`'s `reusable-claude-review.yml`, called at `@main` so
# a fix there reaches this tree in one landing (issue btclib-org/.github#35).
# What stays here is the trigger, the concurrency group, the
# workflow-level permissions and this header -- the callee's own says so.
#
# Not a required check, and it must not become one. What it produces is a
# review of type COMMENT, an opinion for the author to weigh -- REPOSITORY.md's
# rule is that `main`'s required contexts are named outside the repository,
# and a review that gates a merge would make a model's judgement a branch
# rule. The required checks stay what they are, and which ones those
# are is REPOSITORY.md's to record and the endpoint's to answer.
#
# One calling job, not two: a `uses:` job invokes the *whole* called
# workflow, every job in it, so this one job already reaches both the
# callee's `review` and `mention`, and each declines the events that are
# not its own -- the callee's own header states this in the singular. A
# calling job per callee job would not double-fire (each event still
# matches one partition), but it would state the event dispatch twice --
# this file's own `if:` and the callee's job `if:` -- and duplicate the
# permissions triple, the secrets block and the `uses:` line for no
# reason a third callee job would not then triple. `deps-latest.yml`
# against `reusable-deps-latest.yml` is the precedent: one calling job
# reaching several internal jobs, keyed by name in the run rather than
# by the caller's job id.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition (the callee's) withheld while it was a draft.
    # closed too: the group below is at the workflow level, so a closed
    # run enters it when the run is created, before any job's own `if:`
    # is read, and can cancel a review still holding the group -- what
    # declines the actual review on a closed pull request is the
    # callee's own job-level `if:`
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN at the workflow level, elevated on
# the calling job below
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere
# else here. One key serves both halves of the call: a pull_request
# event groups and cancels by the pull request's number, so a push
# supersedes the review it overtakes, and every other event falls back
# to github.run_id, which no two runs share, so no two mentions and no
# mention and review share a group and cancel-in-progress is inert for
# them. The number alone does not do that: a pull_request_review_comment
# event carries github.event.pull_request.number too, landing a mention
# in the review's own group, and an issue_comment event leaves it empty,
# putting every mention in the repository in the one group
# `claude-review-`. At the workflow level rather than on the job, which
# is the placement btclib-org/btclib-secp256k1#593 settled: it is
# correct whether or not a job an `if` skips claims a job-level group, a
# question that issue closed without answering
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    # a called workflow's own permissions: block can only downgrade,
    # never restore, what this calling job grants, so every scope either
    # of the callee's two jobs asks for is named here too, or the run
    # fails before any job starts, as a startup_failure
    # (btclib-org/.github#912)
    permissions:
      contents: read
      pull-requests: write # posting the review, and the reply to a mention
      id-token: write # the OIDC token the action mints at its own startup
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    with:
      # this tree's own paragraph, landing between the verdict paragraph
      # and the instruction not to run the gates -- the callee's one
      # insertion point for it
      extra-prompt: |
        A rule that is stated without the reason that chose it, a claim no
        command re-derives, a count of anything, a second wording of a fact
        stated elsewhere, and a rule whose own repository does not keep it
        are the defects the organization's standard names, and they are
        what to look for beside anything specific to this client.
      # no extra-allowed-tools: the callee's own base set
      # (mcp__github_inline_comment__create_inline_comment, Bash(gh
      # pr:*), Read, Grep, Glob) is what a review of this client reaches
      # for, and nothing beyond it
    # named rather than `inherit`: the callee declares one secret, and
    # zizmor's secrets-inherit audit is right that handing it every
    # secret this repository has is more than that one takes
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
