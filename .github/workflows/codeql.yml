---
name: codeql

# Code scanning, as a file rather than as a repository setting. GitHub's
# default setup analyses the same two languages at the same query suite
# from a workflow it generates and does not show, which makes the check it
# produces the one required check whose definition a diff cannot review:
# every other one in main's rule is a file in this tree with its actions
# pinned to commit SHAs. Here the languages, the suite, the schedule and
# the action versions are read the way the rest of CI is read.
#
# The two settings default setup holds are reproduced rather than chosen,
# so that moving the analysis into the tree does not also change it:
#
#     gh api repos/btclib-org/bitcoin-core-rpc/code-scanning/default-setup
#
# answers `languages: [actions, python]`, `query_suite: default` and
# `schedule: weekly`, and the matrix, the init step and the cron below are
# those three.
#
# Default setup and an advanced workflow are exclusive, and the way they
# collide is worth knowing before reading a red check here: the jobs below
# run, and the upload at the end of them is refused -- "Upload was rejected
# because CodeQL default setup is enabled for code scanning", which GitHub
# documents as a SARIF upload failure rather than as a workflow it declines
# to start. So while the setting is configured this workflow reports failure
# rather than nothing, and only disabling the setting makes it green.
# REPOSITORY.md carries the order that switches the two over without ever
# leaving the branch rule waiting on a check nothing produces.

on:
  push:
    # main only, for the reason lint.yml and docs.yml give at the same key:
    # a push to a branch with an open pull request would run this twice, in
    # two concurrency groups that do not cancel each other, and the
    # pull_request run -- which analyses the merge result, and is the only
    # run a fork's pull request produces -- is the one worth keeping.
    # main keeps a trigger of its own because a merge creates a commit that
    # is not the one the pull request analysed, and because an alert is
    # attributed to a branch: the default branch is where code scanning
    # reports what is open
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request would
    # wait for its next push to be analysed at all
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    # Tuesdays, 04:27 UTC. A weekly run is what default setup performed and
    # what a pull request trigger cannot replace: a query pack updates
    # without anybody touching the repository, so the analysis of an
    # unchanged tree is a different answer this week than last.
    # Not on the hour, and on a day the other four schedules here leave
    # free -- Monday is links, Thursday macos and latest, Sunday mutation:
    # GitHub queues scheduled workflows across every repository that asked
    # for the same minute, and the run can be dropped outright when the
    # queue is long
    - cron: "27 4 * * 2"
  # the escape hatch: an analysis on demand for a branch whose pull request
  # is not open yet.
  # No workflow_call, unlike the four gates release.yml reuses: a tag
  # publishes the tree those four already passed, and re-analysing it would
  # upload a second set of alerts against the same commit
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN, which everything running in a job
# can read. contents: read is the whole of what the gate below needs; the
# analysis job declares the two it needs on top of it, so the write is held
# by one job rather than by the workflow
permissions:
  contents: read

# cancel superseded runs on the same branch/PR. Named literally rather than
# through github.workflow, as everywhere else here: in a called workflow
# that expression is the caller's name
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # the language is in the name because it is what a failure is about: one
    # job per language, so a red check names which analysis broke instead of
    # a matrix cell to open. It also lets the two run at once
    name: Analyze ${{ matrix.language }} with CodeQL
    # a draft pull request is work in progress, and the gate below carries
    # the same condition so a draft skips uniformly rather than tripping the
    # skip check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      # where the alerts are uploaded to; the one write in this workflow
      security-events: write
      contents: read
      # what the `actions` analysis reads: the workflow files are its
      # source, and analyze queries the run's own metadata
      actions: read
    strategy:
      # so one language's failure does not hide the other's result
      fail-fast: false
      matrix:
        # exactly what default setup analysed. There is no third language to
        # add: the tree is Python, workflows, markdown and toml, and CodeQL
        # supports the first two of those
        language: [actions, python]
    # generous against the two minutes the pair takes here: what it bounds
    # is a hung job holding a runner for six hours
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these run
      # in the one job here that can write security events
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the suite job in test.yml
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # `none` is the only mode either language has: neither is
          # compiled, so the database is built from the sources without a
          # build. Said out loud rather than left to be inferred, since the
          # value is what an autobuild step would otherwise be needed for.
          # Nothing is installed first either, and that is this project's
          # one-file property rather than an omission -- `dependencies = []`
          # in pyproject.toml, so an install would add no import for the
          # python analysis to resolve
          build-mode: none
          # `queries` is deliberately unset, and that is `query_suite:
          # default`: the init action has no query_suite input, its
          # `queries` input adding queries to the default suite instead
          # (`security-extended` is the widening default setup calls
          # `extended`). Passing nothing is therefore the same analysis the
          # setting performed, and the note is here because "no input" is
          # otherwise indistinguishable from "nobody decided"
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          # what keeps the two languages' results apart in the same commit's
          # analysis: without a distinct category the second upload replaces
          # the first rather than adding to it
          category: /language:${{ matrix.language }}

  # the single check main's branch protection requires from this workflow,
  # for the reason test.yml's aggregate states: the rule names its checks as
  # literal strings stored outside the repository, and the matrix above
  # produces one context per language -- a set that moves whenever CodeQL
  # gains a language worth adding. This job depends on the matrix instead,
  # so the rule names one thing that never changes
  codeql-passed:
    # the name and not the id is what branch protection matches, and it
    # carries the workflow because a context is keyed by name alone: two
    # workflows with a job named "every job passed" would produce one
    # ambiguous check
    name: "codeql: every job passed"
    needs: [analyze]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which branch protection counts as
    # satisfied. The gate has to run to be able to fail.
    # And the draft condition the job above carries, so a draft skips
    # uniformly rather than tripping the skip check below
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than testing each
      # job by name, so a job added to needs above is covered without
      # touching this. "skipped" is a failure here too: nothing in this
      # workflow is conditional, so a skip means something upstream did not
      # run
      - name: Fail unless every job above succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a job this gate depends on did not succeed"
          exit 1
