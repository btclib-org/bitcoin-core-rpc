---
name: codeql

# Code scanning, as a file rather than as a repository setting. GitHub's
# default setup analyses the same two languages at the same query suite
# from a workflow it generates and does not show, which makes the check it
# produces the one required check whose definition a diff cannot review:
# every other one in main's rule is a file in this tree with its actions
# pinned to commit SHAs. Here the languages, the suite, the schedule and
# the action versions are read the way the rest of CI is read.
#
# What default setup held is reproduced rather than chosen, so that moving
# the analysis into the tree does not also change it. Asked once, while
# default setup was still the active setting:
#
#     gh api repos/btclib-org/bitcoin-core-rpc/code-scanning/default-setup
#
# it answered `languages: [actions, python]`, `query_suite: default` and
# `schedule: weekly`, which are the matrix, the init step and the cron
# below. The endpoint reports a schedule only while `state` is
# `configured`; asked again now, with the setting off (below), it answers
# `schedule: null` -- the cron has not drifted, the field just stops being
# reported once the setting is off.
#
# Default setup and an advanced workflow are exclusive, and the collision is
# at the upload rather than at the start: `init` succeeds, the database is
# built, and the upload at the end is refused --
#
#     Code Scanning could not process the submitted SARIF file:
#     CodeQL analyses from advanced configurations cannot be processed
#     when the default setup is enabled
#
# so a run reports failure rather than nothing. The setting is off, which is
# what lets the upload through, and turning it back on is what would make
# every analysis here red. REPOSITORY.md carries the order it came off in,
# which is the order to repeat if it ever goes back on.

on:
  # main and the schedule below, and no pull_request trigger: this analysis
  # is the one gate that was worth trading for the slots it held. GitHub
  # Free gives an organization twenty concurrent jobs, shared across every
  # repository in it, and this workflow's three of them were held while a
  # pull request waited -- so the analysis lands on the merge commit rather
  # than before it, and the aggregate below is no longer a required check
  # on main. REPOSITORY.md's "Required checks on main" is where that rule
  # is written down, and dropping the context there is a token operation
  # that had to come first.
  # What still reads a branch before it merges is lint.yml: zizmor is a
  # pre-commit hook and reads exactly these files for an injected
  # expression, which is the finding this workflow would otherwise be alone
  # in making. What a merge defers is the rest -- the python queries -- for
  # the time between that merge and the next run, which for main is the
  # merge itself
  push:
    # a merge creates a commit that no pull request analysed, and an alert
    # is attributed to a branch: the default branch is where code scanning
    # reports what is open, so without a run here there is no baseline
    branches: [main]
  schedule:
    # Tuesday, which the grid gives to this and nothing else. A weekly
    # run is what default setup performed and what a pull request trigger
    # cannot replace: a query pack updates without anybody touching the
    # repository, so the analysis of an unchanged tree is a different
    # answer this week than last.
    # The day is this workflow's and the minute is this repository's:
    # :12 wherever a cron of this tree appears, so a schedule line names
    # the tree it belongs to without anything else being read. Section 10
    # of the organization standard carries the grid, and the reason no
    # cron here is on the hour -- GitHub queues same-minute schedules
    # across every repository that asked, and drops a run when that queue
    # is long.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "12 4 * * 2"
  # the escape hatch, and with no pull_request trigger above it is the only
  # way to analyse a branch before it is merged: worth reaching for on one
  # that touches a workflow, which is what the actions queries read.
  # No workflow_call, unlike the four gates release.yml reuses: a tag
  # publishes the tree those four already passed, and re-analysing it would
  # upload a second set of alerts against the same commit
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN, which everything running in a job
# can read. contents: read is the whole of what the gate below needs; the
# analysis job declares the two it needs on top of it, so the write is held
# by one job rather than by the workflow
permissions:
  contents: read

# cancel superseded runs on the same branch/PR. Named literally rather than
# through github.workflow, as everywhere else here: in a called workflow
# that expression is the caller's name
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # the language is in the name because it is what a failure is about: one
    # job per language, so a red check names which analysis broke instead of
    # a matrix cell to open. It also lets the two run at once
    name: Analyze ${{ matrix.language }} with CodeQL
    # no draft condition, where every job of test.yml carries one: this
    # workflow no longer runs on a pull request at all, so there is no draft
    # to skip and `github.event.pull_request.draft` is an expression that
    # could only read empty here
    runs-on: ubuntu-latest
    permissions:
      # where the alerts are uploaded to; the one write in this workflow
      security-events: write
      contents: read
      # what the `actions` analysis reads: the workflow files are its
      # source, and analyze queries the run's own metadata
      actions: read
    strategy:
      # so one language's failure does not hide the other's result
      fail-fast: false
      matrix:
        # exactly what default setup analysed. There is no third language to
        # add: the tree is Python, workflows, markdown and toml, and CodeQL
        # supports the first two of those
        language: [actions, python]
    # far above what an analysis of this tree needs, the same way test.yml
    # bounds the suite: what it buys is that a hung job releases the runner
    # rather than holding it for six hours.
    # `gh run list --workflow=codeql.yml --limit 1` is what re-measures it
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these run
      # in the one job here that can write security events
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the suite job in test.yml
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # `none` is the only mode either language has: neither is
          # compiled, so the database is built from the sources without a
          # build. Said out loud rather than left to be inferred, since the
          # value is what an autobuild step would otherwise be needed for.
          # Nothing is installed first either, and that is this project's
          # one-file property rather than an omission -- `dependencies = []`
          # in pyproject.toml, so an install would add no import for the
          # python analysis to resolve
          build-mode: none
          # `queries` is deliberately unset, and that is `query_suite:
          # default`: the init action has no query_suite input, its
          # `queries` input adding queries to the default suite instead
          # (`security-extended` is the widening default setup calls
          # `extended`). Passing nothing is therefore the same analysis the
          # setting performed, and the note is here because "no input" is
          # otherwise indistinguishable from "nobody decided"
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # what keeps the two languages' results apart in the same commit's
          # analysis: without a distinct category the second upload replaces
          # the first rather than adding to it
          category: /language:${{ matrix.language }}

  # one answer to read per commit rather than one per language, which is
  # what this job is for now that main's branch protection does not require
  # it -- REPOSITORY.md's table is where that changed, and why. Kept rather
  # than deleted because the name is then still produced: requiring this
  # workflow again is a patch to the rule and nothing in the tree, which is
  # the half of the exchange that cannot be made in a pull request.
  # The matrix above produces one context per language, a set that moves
  # whenever CodeQL gains a language worth adding; this job depends on the
  # matrix instead, so adding one is enough to be covered by it
  codeql-passed:
    # the name and not the id is what branch protection matches, and it
    # carries the workflow because a context is keyed by name alone: two
    # workflows with a job named "every job passed" would produce one
    # ambiguous check -- and test.yml's aggregate is still required, so the
    # two names must not converge
    name: "codeql: every job passed"
    needs: [analyze]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which reads as satisfied wherever a
    # check is read at all. The gate has to run to be able to fail
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than testing each
      # job by name, so a job added to needs above is covered without
      # touching this. "skipped" is a failure here too: nothing in this
      # workflow is conditional, so a skip means something upstream did not
      # run
      - name: Fail unless every job above succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a job this gate depends on did not succeed"
          exit 1
