---
name: scorecard

# OpenSSF Scorecard: a third-party, external audit of this repository's
# supply-chain posture, run independently rather than by anything this
# organization asked itself. btclib-org/.github#339 is where this
# sentinel and its permissions are decided; this file adopts it, and
# does not restate the reasoning.
#
# This repository is public and is not a fork, which is the property
# section 10 of the standard keys the sentinel on:
#
#   gh api repos/btclib-org/bitcoin-core-rpc --jq '.fork, .private'
#
# answers `false` and `false`.
#
# The analysis job -- its checkout, the scan itself, the artifact and
# the SARIF upload -- is btclib-org/.github's reusable-scorecard.yml,
# called at @main so a fix there reaches this tree in one landing
# (btclib-org/.github#35). The trigger, the cron minute, the
# workflow-level permissions and the concurrency group stay here: the
# callee takes no inputs and does not hold them.

on:
  push:
    # only the default branch is analysed -- ossf/scorecard-action's own
    # README names this and schedule as the supported triggers and calls
    # workflow_dispatch experimental, so unlike every other workflow here
    # this one carries no dispatch and no pull_request: its triggers are
    # the action's, not section 10's general rule
    branches: [main]
  schedule:
    # Sunday, hour 05: section 10's calendar, where scorecard is the last
    # row. The minute is this repository's own row in the same table.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # The push trigger above already runs the analysis on every push to
    # main, which is what feeds the badge and the published score between
    # scheduled runs; this covers what push cannot -- a week with none.
    - cron: "12 5 * * 0"

# least privilege for the GITHUB_TOKEN at the workflow level, elevated
# on the calling job below -- each grant explained at its own line
# there -- and pushes nothing back to the tree.
permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow. A run with no pull
  # request -- every run of this workflow, since it carries none -- has
  # no number and groups by github.ref, which is refs/heads/main for the
  # one trigger this workflow has, so two pushes in quick succession
  # supersede each other -- wanted, since they ask the same question of
  # the same tree
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    uses: btclib-org/.github/.github/workflows/reusable-scorecard.yml@main
    # a called workflow's own permissions: block can only downgrade, never
    # restore, what this calling job grants (GitHub's own docs: "The
    # GITHUB_TOKEN permissions passed from the caller workflow can be only
    # downgraded (not elevated) by the called workflow"), so every scope
    # the callee's analysis job asks for is named here too, or the run
    # fails before any job starts, as a startup_failure
    # (btclib-org/.github#912)
    permissions:
      # the transparency-log entry publish_results uses to publish
      id-token: write # the OpenSSF transparency log publish
      # SARIF results filed as code-scanning alerts
      security-events: write # the SARIF upload
      # the callee's job writes neither a release nor anything else to
      # the tree, so read is all it takes
      contents: read
      # what the Packaging check reads workflow-run history with, to see
      # whether release.yml has runs that succeeded. The trailing
      # comments on this block repeat each grant's purpose in one line
      # for the reason btclib's codeql.yml gives on its own block:
      # zizmor's undocumented-permissions audit (persona=auditor) reads
      # the permission's own line rather than a comment above it
      # (btclib-org/.github#1164)
      actions: read # the Packaging check's workflow-run history read
