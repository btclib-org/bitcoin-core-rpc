---
name: lint

# the fast gate, kept apart from the test workflow: a style error is not
# worth discovering at the end of a matrix, and a workflow each means a
# badge each and a line each in the checks list, so a lint failure does
# not read as "the build is red". docs.yml is apart for the same reason:
# whether the documentation builds is a third verdict, not a step of this
# one.
#
# The checkout, the uv setup, the runner-image step, the hook cache and
# the pre-commit run are btclib-org/.github's: reusable-lint.yml, called
# at @main so a fix there reaches this tree in one landing (section 10 of
# its README.md). What runs is still .pre-commit-config.yaml itself
# rather than a second list of the same tools, the called job checking
# this tree out before it runs pre-commit against it: CI therefore
# enforces exactly what a local run of it enforces, every hook included,
# and no hook is gated by pre-commit.ci alone (btclib-org/.github#35)

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups for every pull_request action except
    # closed on a merge -- see that trigger's own comment below, and the
    # concurrency block, for why closed is the exception and how the
    # group now avoids it. The pull_request run is the one worth
    # keeping, because it lints the merge commit and is the only run a
    # fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request linted, and nothing else would
    # ever lint it. Tag pushes are covered by the release workflow
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition in reusable-lint.yml withheld while it was a draft:
    # the default types do not include it, and without it a readied pull
    # request would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, cancelling
    # the run linting the actual merge commit one to two seconds after
    # every merge -- observed on this repository's own main. The
    # concurrency block below groups a pull_request run by the pull
    # request's own number instead, which cannot equal any push's
    # github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # lets the release workflow gate publication on these same checks
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, hooks) can read the token, so it must not be
# able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: the release workflow calls both
# this and test.yml, and with that expression the two would share a group
# and cancel each other.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by, so a closed run cannot
# resolve to the same group as a push to main -- the pull_request
# trigger's own comment above has the evidence. A push carries no
# pull_request context, so github.ref is still what groups it.
# The suffix is a second, independent problem with github.ref: inside a
# called workflow that context is the caller's ref, so a rehearsal -- a
# workflow_dispatch of release.yml on a branch -- computes
# lint-refs/heads/<branch>, the very group a push to that branch or a
# direct dispatch of this workflow computes. One then kills the other:
# either the rehearsal dies mid-build, or it cancels the run of the push.
# A tag run is unaffected, refs/tags/v* being a ref nothing else uses.
# release.yml passes a suffix of its own, which keeps the release path
# out of the branch groups while still letting a second rehearsal of the
# same branch supersede the first
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the draft and closed declines, the checkout, the uv setup, the hook
  # cache and the pre-commit run are the called workflow's own, reading
  # github.event.pull_request.draft and github.event.action off this
  # caller's trigger. This tree checks out no submodule and needs no
  # history beyond the tip, so `submodules` and `fetch-depth` are left at
  # their defaults
  lint:
    uses: btclib-org/.github/.github/workflows/reusable-lint.yml@main
