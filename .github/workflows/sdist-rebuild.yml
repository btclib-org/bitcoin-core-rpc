---
name: sdist-rebuild

# the sentinel on what the attestation vouches for: the latest release's
# tag, rebuilt the way RELEASING.md's *Rebuild a release from its tag*
# rebuilds it, and `gh attestation verify` over the rebuilt sdist, which
# passes only where its digest is one the release signed. The rebuild
# itself -- the checkout, the build, the normalizer and the attestation
# check -- is btclib-org/.github's reusable-sdist-rebuild.yml, called at
# @main so a fix there reaches this tree in one landing
# (btclib-org/.github#35).
#
# The sdist alone: section 10 of btclib-org/.github's README.md makes
# the row the sdist's, the wheel being outside the property section 12
# states. This workflow used to build with a bare `uv build`, which also
# wrote a wheel that nothing here read back; the callee's default
# `sdist-builder: uv` runs `uv build --sdist`, so this workflow no
# longer builds that wheel at all. A red run is an issue against this
# tree. It gates nothing and no branch rule names it

on:
  schedule:
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the two triggers below
    - cron: "12 3 * * 0"
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures, the
  # trigger links.yml carries for itself. What the job runs besides this
  # file is the tag's own, so nothing else a pull request touches changes
  # the answer
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/sdist-rebuild.yml

# least privilege for the GITHUB_TOKEN, elevated per job below
permissions:
  contents: read

# grouped by the pull request's number where there is one, for the
# reason links.yml gives beside its own group
concurrency:
  group: sdist-rebuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  rebuild:
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    # a called workflow's own permissions: block can only downgrade,
    # never restore, what this calling job grants, so every scope the
    # callee's job asks for is named here too, or the run fails before
    # any job starts, as a startup_failure (btclib-org/.github#912)
    permissions:
      contents: read
      attestations: read # gh attestation verify reads the attestations API with it
    uses: btclib-org/.github/.github/workflows/reusable-sdist-rebuild.yml@main
