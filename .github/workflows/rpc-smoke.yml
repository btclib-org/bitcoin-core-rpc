---
name: rpc-smoke

# The one claim the suite cannot make. Every reply under tests/_data is
# Core's own and the suite classifies all of them without opening a socket,
# which is the right shape for a test suite -- but a recording is the thing
# being classified, so nothing in it says that a live bitcoind still
# answers this way. This workflow asks two of them, and
# .github/scripts/rpc_smoke.py is the whole of what it asks: the reply
# shapes read off the wire before the client reads them, the cookie the
# node wrote, the /wallet/<name> endpoint of a node with two wallets, and
# the chain answers against a regtest chain the script generates, so the
# expected height is arithmetic rather than a recording.
#
# Four more cells ask a narrower question about the four chains regtest
# is not: with none of them a chain this workflow can grow, `--chain`
# starts a node of each with no peer reachable at all, and checks only that
# Core still accepts `-chain=<name>` and echoes it back -- one Core version
# rather than both, since that spelling has not moved across a supported
# major yet.
#
# It gates a merge, which it did not until now, and the reason it did not
# was a cost that measurement does not support: every cell here finishes in
# 12 to 24 seconds, the download of bitcoind included, and the whole
# workflow in about 90 seconds -- against the two minutes of test.yml's
# matrix, which it therefore does not lengthen. The claim it replaces, that
# "two nodes plus two downloads is minutes", was either never measured or
# has been overtaken by the runners; what is true today is in the run log:
#
#     gh run list --workflow=rpc-smoke.yml --limit 1
#
# Being required is also why the pull_request trigger below carries no
# `paths`: a required check that never runs blocks a merge, where a skipped
# one satisfies it, so a filter and a required check cannot both be had.
# Every pull request pays 90 seconds, documentation-only ones included.
#
# A workflow of its own and not a job in test.yml, whose matrix is
# interpreters: this one is bitcoind versions.

on:
  # the same trigger set as the other three gates, lint.yml first among
  # them: main so that the commit a merge creates is asked the question
  # too, the pull request so that the merge result is, workflow_call so
  # that release.yml can reuse the answer, and the dispatch as the escape
  # hatch RELEASING.md uses
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  # no `paths` here any more: see the note above on a required check that
  # does not run
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all
    types: [opened, reopened, synchronize, ready_for_review]

# least privilege for the GITHUB_TOKEN, and here it is also the point: a
# job that exists to establish a security property files nothing and
# publishes nothing, so read is the whole of what it needs. In particular
# the download below is verified rather than trusted, which is the other
# half of the same argument
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name
concurrency:
  group: rpc-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpc-smoke:
    name: >-
      ${{ matrix.protocol && format('Smoke the rpc client against Core {0}', matrix.core)
          || format('Start Core {0} on {1} and check it answers', matrix.core, matrix.chain) }}
    # a draft pull request is work in progress and spends no runner
    # here either: the same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # a download, a node and a hundred blocks of regtest, all of it local:
    # a run past this is a node that never opened its rpc port. The four
    # chain-only cells need far less than that -- no chain grown on any of
    # them -- and share the same ceiling rather than a second one to keep
    # in step with it
    timeout-minutes: 20
    strategy:
      # every cell always runs: which versions answer which protocol, and
      # whether each of the other chains still starts, are independent
      # questions, so the answer for one is not a reason to stop asking
      # the rest
      fail-fast: false
      matrix:
        # x86_64 linux only, that being the architecture the digests below
        # are of. What the matrix buys here is bitcoind versions, and a
        # second architecture would buy the same two protocols again.
        #
        # The rule for moving these pins, which is why it is written beside
        # them: the older is the final release of the newest line that
        # predates the 2.0 marker, and the newer is whatever is current.
        #
        # 27.2 is deliberately end of life. It is the last major that does
        # not recognize the "jsonrpc": "2.0" marker at all, so what it pins
        # is the compatibility boundary -- that a client sending the marker
        # to a node which has never heard of it still reads the 1.1 reply
        # that comes back, an rpc error under an HTTP 500 included. Nothing
        # else in Core's supported range can demonstrate that, and this pin
        # does not move again unless Core changes what v27 was.
        #
        # The digest is the SHA256SUMS entry of the release directory,
        # written here rather than fetched beside the file it describes: a
        # checksum file served by the host that served the archive is one
        # host's statement about itself. SHA256SUMS.asc is the stronger
        # link and is not taken -- it would make this job hold the builder
        # keys and decide how many signatures are enough, which is a policy
        # this repository has nowhere to state
        #
        # The four `chain` cells below reuse the 31.1 digest rather than
        # pinning their own: it is the same download, asked a different
        # question, and regtest is not among them -- the two `protocol`
        # cells already start it, on both versions, more thoroughly than a
        # third start of it here ever would
        include:
          - core: "27.2"
            protocol: "1.1"
            digest: acc223af46c178064c132b235392476f66d486453ddbd6bca6f1f8411547da78
          - core: "31.1"
            protocol: "2.0"
            digest: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
          - core: "31.1"
            chain: main
            digest: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
          - core: "31.1"
            chain: test
            digest: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
          - core: "31.1"
            chain: testnet4
            digest: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
          - core: "31.1"
            chain: signet
            digest: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the suite job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # the wheels uv.lock pins do not change between runs, so the
          # cache is the difference between a download and a copy
          enable-cache: true
      # the matrix values reach the shell as environment variables rather
      # than as expressions interpolated into it, which is the convention
      # zizmor enforces and the one that keeps a shell script readable as
      # a shell script
      # a released archive is immutable and the digest below names it, so a
      # run that has already seen this version has nothing to fetch. The
      # key carries the digest rather than the version alone: a key can
      # only ever hold the bytes it names, and a version is a name upstream
      # could in principle re-cut.
      # What this buys is not the nine seconds a download takes. It is that
      # a merge no longer depends on bitcoincore.org answering -- this
      # workflow became a required check, so every pull request was
      # fetching Core five times from a server nobody here runs, and now a
      # warm cache fetches it none. Cross-run and cross-pull-request,
      # because a cache written by a run on main is readable from every
      # branch, which is why this workflow also runs on push.
      # The five cells that want 31.1 race to save one key on a cold run:
      # the first wins and the others log that it exists, which is not a
      # failure. Two versions at about 50 MB is what this holds of the
      # repository's cache budget -- `gh cache list` says how much
      - name: Restore the bitcoind archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bitcoin-${{ matrix.core }}-x86_64-linux-gnu.tar.gz
          key: core-${{ runner.os }}-${{ matrix.core }}-${{ matrix.digest }}
      - name: Download bitcoind and verify the archive
        env:
          CORE: ${{ matrix.core }}
          DIGEST: ${{ matrix.digest }}
        run: |
          archive="bitcoin-${CORE}-x86_64-linux-gnu.tar.gz"
          # an immutable versioned artifact, never a "latest" url, and no
          # --location: the release url is https and direct, so a redirect
          # is a change in what is being served rather than a hop to
          # follow. The digest below would catch it either way; failing
          # here says which of the two happened
          # only when the cache above restored nothing: the digest check
          # below runs either way, so a restored archive is verified rather
          # than trusted -- the same property the download has, and the
          # reason the check is not conditional on the cache. A restored
          # file that fails it fails the job, which is the right answer for
          # a cache entry that is not what its key says
          if [ ! -f "${archive}" ]; then
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --output "${archive}" \
              "https://bitcoincore.org/bin/bitcoin-core-${CORE}/${archive}"
          else
            echo "restored ${archive} from the cache"
          fi
          # fail closed, before the archive is unpacked and long before
          # anything in it is executed
          printf '%s  %s\n' "${DIGEST}" "${archive}" | sha256sum --check --strict -
          # and the negative control, which is what says the check above is
          # load-bearing rather than decorative: the same comparison
          # against a digest that is not the file's has to fail. Every hex
          # digit rotated, so the tampered digest is a well-formed one that
          # no file is
          tampered="$(printf '%s' "${DIGEST}" | tr '0123456789abcdef' '123456789abcdef0')"
          if printf '%s  %s\n' "${tampered}" "${archive}" \
              | sha256sum --check --status --strict -; then
            echo "::error::sha256sum accepted a digest that is not the archive's"
            exit 1
          fi
          # the daemon is the only member extracted; the other archive
          # members are never unpacked or run. The archive itself is on
          # disk, curl having written it, and verified before this line.
          # tar fails the step if the member is not there, which is what a
          # release changing its layout looks like from here
          tar --extract --gzip --file "${archive}" "bitcoin-${CORE}/bin/bitcoind"
      # --no-default-groups: the script imports the module and starts a
      # node, so the project is the whole of what it needs installed --
      # there being no dependency to resolve. --locked, as everywhere
      # else, so a stale lock fails here rather than resolving something
      # nobody chose
      - name: Smoke the rpc client against the node
        if: matrix.protocol
        env:
          CORE: ${{ matrix.core }}
          PROTOCOL: ${{ matrix.protocol }}
        run: >
          uv run --locked --no-default-groups
          python .github/scripts/rpc_smoke.py
          --bitcoind "bitcoin-${CORE}/bin/bitcoind"
          --core-version "${CORE}"
          --protocol "${PROTOCOL}"
      - name: Start the node on its chain and check it answers
        if: matrix.chain
        env:
          CORE: ${{ matrix.core }}
          CHAIN: ${{ matrix.chain }}
        run: >
          uv run --locked --no-default-groups
          python .github/scripts/rpc_smoke.py
          --bitcoind "bitcoin-${CORE}/bin/bitcoind"
          --core-version "${CORE}"
          --chain "${CHAIN}"

  # the check main requires, and the only one from this workflow: the rule
  # lives outside the repository, so it must name an outcome rather than
  # six matrix cells whose names carry a Core version and a chain. The name
  # carries the workflow because a context is keyed by name alone -- see
  # test.yml's own gate, which is this pattern's other instance
  smoke-passed:
    name: "rpc-smoke: every job passed"
    needs: [rpc-smoke]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which branch protection counts as
    # satisfied. The gate has to run to be able to fail. And the draft
    # condition every job above carries, so a draft skips uniformly rather
    # than tripping the skip check below
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than testing
      # each job by name, so a cell added to the matrix above is covered
      # without touching this
      - name: Fail unless every job above succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a job this gate depends on did not succeed"
          exit 1
