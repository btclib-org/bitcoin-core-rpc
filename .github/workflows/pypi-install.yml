---
name: pypi-install

# the sentinel on what users actually install. Every other workflow here
# tests artifacts built in the same run, from the tree that triggered it:
# nothing tells us whether the wheel already on PyPI still installs and
# still works. What breaks it is not a change in this repository -- it is
# a new runner image, a new interpreter, a yanked dependency, PyPI serving
# a corrupted file -- so nothing here has to move for this to start
# failing, which is exactly why it runs on a schedule rather than on a
# pull request that changes the package.
#
# The check is deliberately version-independent: `call`'s transport
# parameter has taken an injected callable since before this package had a
# first release, so the same round trip release.yml's own wheel smoke test
# makes -- a request built, a canned reply fed back in, a Decimal read out
# -- keeps exercising the real contract after every future release without
# an edit. A bare import proves the module parses; it does not prove a
# response still turns into a `Decimal` rather than a traceback, which is
# the one thing this package promises that an import alone cannot check.
#
# One thing this is not a sentinel for: whether the *next* commit breaks
# something. That question belongs to test.yml, against the tree, before
# a release; this one is asked after, against the index, forever
on:
  # after a release, which is the one moment this workflow's answer can
  # change: RELEASING.md documented dispatching it by hand right here, and
  # a call does not forget. Called by release.yml rather than triggered by
  # workflow_run, which zizmor rates a dangerous trigger and rightly -- it
  # runs the default branch's copy with the token of a push nobody reviewed
  # -- where a call runs inside the release that gated it, in its graph and
  # in its log. The caller passes the tag, and only the caller does: the
  # weekly run and a dispatch have no particular version in mind, which is
  # the point of them
  workflow_call:
    inputs:
      version:
        description: >-
          the tag whose version the index must serve before the matrix
          installs anything, empty on a run with no release behind it
        required: false
        type: string
        default: ""
  schedule:
    # Wednesday, the hour after deps-latest.yml, and the pair is why it is
    # weekly: deps-latest.yml upgrades every dependency and runs the suite,
    # this asks what the index actually serves, and read together they
    # separate a break this tree caused from one that arrived. What it
    # watches is external rot -- a new pip, a new runner image, a yanked
    # file -- which a week samples as well as anything longer, and after
    # a release the trigger above answers immediately regardless.
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "12 5 * * 3"
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures, the
  # trigger links.yml already carries for itself. Unlike release.yml,
  # nothing here calls another workflow, so a pull request run shares no
  # concurrency group with test.yml's and cannot be cancelled by it
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/pypi-install.yml

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip) can read the token, so it must not be able to write to
# the repository
permissions:
  contents: read

# never cancel a sentinel, unlike every other workflow here: the run a
# release calls, the weekly one and a dispatch share this group, each is a
# sample worth keeping, and none supersedes the others. A concurrent run
# queues instead
concurrency:
  group: pypi-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-published:
    name: >-
      ${{ matrix.no-binary && 'Build' || 'Install' }}
      ${{ matrix.python-version }} from PyPI on ${{ matrix.os }}
    # a draft pull request is work in progress and spends no runner
    # here either: the same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the widest image list in the tree, and wide on purpose: what
        # this samples is not the module, which is platform-independent
        # -- no compiled extension, one universal wheel for every
        # interpreter -- but the install, and an install breaks from
        # outside, on one image's pip or one image's runner. So every
        # image os-ubuntu.yml, os-macos.yml and os-windows.yml run between them,
        # against the two ends of the supported range and the
        # free-threaded build
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
        python-version: ["3.10", "3.14", "3.14t"]
        exclude:
          # actions/setup-python has no CPython 3.10 build for Windows
          # arm64 -- "The version '3.10' with architecture 'arm64' was not
          # found for Windows Enterprise", measured on this matrix.
          # os-windows.yml's own windows-11-arm cells do not need this: they
          # provision Python through astral-sh/setup-uv, which fetches
          # python-build-standalone's distributions rather than reading
          # this action's version manifest, and that one goes back further
          - os: windows-11-arm
            python-version: "3.10"
        include:
          # the path a resolver takes if it is ever asked for the sdist
          # rather than the wheel PyPI also serves: this package has no
          # compiled step behind either, so the risk a wheel-only cell
          # cannot see is drift in `[tool.uv.build-backend]`, not a build
          # failure. One cell is enough, being the same sdist on every
          # platform
          - os: ubuntu-latest
            python-version: "3.13"
            no-binary: true
    steps:
      # the index does not serve a new file the instant the upload
      # returns, and this workflow installs whatever "latest" resolves to:
      # a run that starts too early tests the *previous* version and
      # reports a pass for it, which is worse than reporting nothing. So
      # the release path waits for the version its tag names, and fails if
      # it never arrives rather than measuring the wrong thing. Only there:
      # the input is empty on every other trigger
      - name: Wait for the index to serve the released version
        if: inputs.version != ''
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 20); do
            if curl -sf --max-time 10 -o /dev/null \
                "https://pypi.org/pypi/bitcoin-core-rpc/${version}/json"; then
              echo "the index serves ${version}"
              exit 0
            fi
            echo "attempt ${attempt}: ${version} is not served yet"
            sleep 15
          done
          echo "::error::${version} never appeared on the index"
          exit 1
      # no checkout on purpose: nothing from this repository takes part,
      # which is also what guarantees that the import below resolves to
      # what pip installed and not to a source tree
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # a shell conditional rather than a ${{ }} expression inside run, as
      # everywhere else in these workflows: matrix values are not
      # attacker-controlled, but the pattern is worth keeping uniform
      - name: Install the published package
        shell: bash
        env:
          NO_BINARY: ${{ matrix.no-binary || false }}
        run: |
          python -m pip install -U pip
          if [ "$NO_BINARY" = "true" ]; then
            python -m pip install --verbose --no-binary bitcoin-core-rpc bitcoin-core-rpc
          else
            python -m pip install --verbose --only-binary bitcoin-core-rpc bitcoin-core-rpc
          fi

      # the same round trip release.yml's own wheel smoke test makes,
      # against the real index instead of a build of this run. requires()
      # is asserted rather than printed, `dependencies = []` in
      # pyproject.toml being a contract a vendored copy also holds only if
      # nothing here ever adds one
      - name: Verify a JSON-RPC round trip, and the Decimal it produces
        shell: bash
        run: |
          python - <<'PY'
          from decimal import Decimal
          from importlib.metadata import requires, version
          import json

          import bitcoin_core_rpc as rpc

          name = "bitcoin-core-rpc"
          print("installed version:", version(name))
          assert not requires(name), requires(name)

          def transport(request, timeout):
              request_id = json.loads(request.data)["id"]
              body = {"jsonrpc": "2.0", "id": request_id, "result": 1.25}
              return 200, json.dumps(body).encode()

          client = rpc.BitcoinCoreRpcClient(
              "http://127.0.0.1:8332", user="u", password="p", transport=transport
          )
          result = client.call("getbalance")
          assert result == Decimal("1.25"), result
          print("ok")
          PY
