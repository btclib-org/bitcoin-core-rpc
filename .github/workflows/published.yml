---
name: published

# the sentinel on what users actually install. Every other workflow here
# tests artifacts built in the same run, from the tree that triggered it:
# nothing tells us whether the wheel already on PyPI still installs and
# still works. What breaks it is not a change in this repository -- it is
# a new runner image, a new interpreter, a yanked dependency, PyPI serving
# a corrupted file -- so nothing here has to move for this to start
# failing, which is exactly why it runs on a schedule rather than on a
# pull request that changes the package.
#
# The check is deliberately version-independent: `call`'s transport
# parameter has taken an injected callable since before this package had a
# first release, so the same round trip release.yml's own wheel smoke test
# makes -- a request built, a canned reply fed back in, a Decimal read out
# -- keeps exercising the real contract after every future release without
# an edit. A bare import proves the module parses; it does not prove a
# response still turns into a `Decimal` rather than a traceback, which is
# the one thing this package promises that an import alone cannot check.
#
# One thing this is not a sentinel for: whether the *next* commit breaks
# something. That question belongs to test.yml, against the tree, before
# a release; this one is asked after, against the index, forever
on:
  schedule:
    # Wednesday, a minute that is not the hour: everything scheduled on
    # the hour queues together, and a run that waits is a failure noticed
    # later. A day of its own, next to links.yml's Monday and
    # mutation.yml's Sunday. Only the default branch schedules workflows,
    # so on any other branch this is reachable through the dispatch below
    # alone
    - cron: "9 5 * * 3"
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures, the
  # trigger links.yml already carries for itself. Unlike release.yml,
  # nothing here calls another workflow, so a pull request run shares no
  # concurrency group with test.yml's and cannot be cancelled by it
  pull_request:
    paths:
      - .github/workflows/published.yml

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip) can read the token, so it must not be able to write to
# the repository
permissions:
  contents: read

# never cancel a sentinel, unlike every other workflow here: the manual
# run RELEASING.md dispatches right after a release and the weekly one
# share this group, each is a sample worth keeping, and neither
# supersedes the other. A concurrent run queues instead
concurrency:
  group: published-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-published:
    name: >-
      ${{ matrix.no-binary && 'Build' || 'Install' }}
      ${{ matrix.python-version }} from PyPI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # narrower than test.yml's, and for a different reason: nothing is
        # platform-specific here, this package having no compiled extension
        # and one universal wheel for every interpreter. What this samples
        # is the two ends of the supported range and the free-threaded
        # build, on the same operating systems test.yml already covers
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-26-intel,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
        python-version: ["3.10", "3.14", "3.14t"]
        exclude:
          # actions/setup-python has no CPython 3.10 build for Windows
          # arm64 -- "The version '3.10' with architecture 'arm64' was not
          # found for Windows Enterprise", measured on this matrix.
          # test.yml's own windows-11-arm cell does not need this: it
          # provisions Python through astral-sh/setup-uv, which fetches
          # python-build-standalone's distributions rather than reading
          # this action's version manifest, and that one goes back further
          - os: windows-11-arm
            python-version: "3.10"
        include:
          # the path a resolver takes if it is ever asked for the sdist
          # rather than the wheel PyPI also serves: this package has no
          # compiled step behind either, so the risk a wheel-only cell
          # cannot see is `MANIFEST.in` or `[tool.setuptools]` drift, not a
          # build failure. One cell is enough, being the same sdist on
          # every platform
          - os: ubuntu-latest
            python-version: "3.13"
            no-binary: true
    steps:
      # no checkout on purpose: nothing from this repository takes part,
      # which is also what guarantees that the import below resolves to
      # what pip installed and not to a source tree
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # a shell conditional rather than a ${{ }} expression inside run, as
      # everywhere else in these workflows: matrix values are not
      # attacker-controlled, but the pattern is worth keeping uniform
      - name: Install the published package
        shell: bash
        env:
          NO_BINARY: ${{ matrix.no-binary || false }}
        run: |
          python -m pip install -U pip
          if [ "$NO_BINARY" = "true" ]; then
            python -m pip install --verbose --no-binary bitcoin-core-rpc bitcoin-core-rpc
          else
            python -m pip install --verbose --only-binary bitcoin-core-rpc bitcoin-core-rpc
          fi

      # the same round trip release.yml's own wheel smoke test makes,
      # against the real index instead of a build of this run. requires()
      # is asserted rather than printed, `dependencies = []` in
      # pyproject.toml being a contract a vendored copy also holds only if
      # nothing here ever adds one
      - name: Verify a JSON-RPC round trip, and the Decimal it produces
        shell: bash
        run: |
          python - <<'PY'
          from decimal import Decimal
          from importlib.metadata import requires, version
          import json

          import bitcoin_core_rpc as rpc

          name = "bitcoin-core-rpc"
          print("installed version:", version(name))
          assert not requires(name), requires(name)

          def transport(request, timeout):
              request_id = json.loads(request.data)["id"]
              body = {"jsonrpc": "2.0", "id": request_id, "result": 1.25}
              return 200, json.dumps(body).encode()

          client = rpc.BitcoinCoreRpcClient(
              "http://127.0.0.1:8332", user="u", password="p", transport=transport
          )
          result = client.call("getbalance")
          assert result == Decimal("1.25"), result
          print("ok")
          PY
