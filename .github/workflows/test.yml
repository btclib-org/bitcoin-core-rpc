---
name: test

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups for every pull_request action except
    # closed on a merge -- see that trigger's own comment below, and the
    # concurrency block, for why closed is the exception and how the
    # group now avoids it. The pull_request run is the one worth
    # keeping, because it tests the merge commit and is the only run a
    # fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it. Tag pushes are covered by the release workflow
    branches: [main]
    # a documentation-only commit would otherwise run the whole matrix.
    # None of these files is imported by the module or read by a test --
    # README.md is the PyPI long description, not a doctest source, and
    # CONTRIBUTING.md is checked by markdownlint, which is the lint
    # workflow's business.
    # Only on push: the same list on pull_request would be wrong, because
    # "test: every job passed" is a required check on main, and a required
    # check that
    # produces no run at all blocks the merge instead of passing it
    paths-ignore:
      - "*.md"
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though every job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, cancelling
    # the run testing the actual merge commit one to two seconds after
    # every merge -- observed on this repository's own main. The
    # concurrency block below groups a pull_request run by the pull
    # request's own number instead, which cannot equal any push's
    # github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:
  # the escape hatch: the matrix on demand for a branch whose pull
  # request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must
# not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: the release workflow calls both
# this and lint.yml, and with that expression the two would share a group
# and cancel each other.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by, so a closed run cannot
# resolve to the same group as a push to main -- the pull_request
# trigger's own comment above has the evidence. A push carries no
# pull_request context, so github.ref is still what groups it, unchanged
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # what the matrix buys on a module with no compiled dependency and no
  # third-party import: the standard library it is built out of, which is
  # not the same library everywhere. `urllib.request` and the `ssl` and
  # `http.client` under it are the largest part of what this module does
  # and the part that moves most between releases; `Path.home()` resolves
  # through the registry on Windows and through the passwd database
  # elsewhere, and `%APPDATA%` is what `default_datadir` reads there
  # instead, so a Windows row is the one place either is asked for real
  # rather than patched; `decimal` is libmpdec on CPython and a Python
  # implementation on PyPy, and the exact parsing of an amount is a promise
  # this client makes.
  suite:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    # a draft pull request is work in progress: every push to one spends
    # the whole matrix on a tree its author is not asking anyone to
    # review yet. The gate below carries the same condition, so a draft
    # skips uniformly and the gate does not read that skip as a job that
    # should have run.
    # A closed pull request spends none either: the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding, and every job here carries the same skip for the reason
    # the draft one already does
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # three, and macos.yml and windows-arm.yml carry the other three,
        # each with its measurement in its own header. What a row costs a
        # pull request is a slot out of the twenty GitHub Free gives an
        # organization, shared with every other repository in it; what it
        # buys is the standard library under the one branch this module
        # takes per platform. The macOS and Windows rows of that branch are
        # asserted on every run by patching `sys.platform`, so what a real
        # runner adds is the `Path.home()` under the table and the library
        # around it -- once per platform family, which is what
        # windows-latest is still here for
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
        # 3.14t is the free-threaded interpreter, and it belongs here for
        # what this module promises: concurrent calls are supported while
        # the configuration is not mutated, and a build without the GIL is
        # the one that would report a shared counter or a cached credential
        # if either existed
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy3.11"
        # the one cell the coverage job below already is: same runner image,
        # same interpreter, the same suite, and the only difference is the
        # instrumentation. Running both asks one question twice and holds two
        # of the twenty concurrent jobs GitHub Free gives an organization,
        # which is what a pull request's wall clock is made of here. Nothing
        # else is excluded: that job is pinned to this pair, for the reason
        # its own comment gives, so this is the only overlap there can be
        exclude:
          - os: ubuntu-latest
            python: "3.14"
    # far above what a run of the suite needs: what it bounds is a hung
    # job holding a runner for six hours
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it and any step archiving
          # the workspace would carry it out of the job. No job in any of
          # these workflows performs an authenticated git operation -- the
          # release is created by gh, from GH_TOKEN in its environment --
          # so nothing needs it to stay
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # the cache holds the wheels uv.lock resolves, this matrix
          # fetching the same ones on every run of every commit
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest

  # coverage is measured once, not once per matrix job: the code base has
  # no version-conditional branch and no conditional skip, and its one
  # sys.platform branch -- the datadir table in `default_datadir` -- is
  # driven by patching `sys.platform`, so every job walks the very same
  # lines. Per-job measurement would buy only the instrumentation
  # overhead.
  # The number is a gate rather than a report: fail_under, in
  # tool.coverage.report, fails this job on a regression. It needs no
  # secret and no third party, and it applies to every run.
  # It is also the (3.14, ubuntu-latest) cell of the matrix above, which is
  # why that pair is excluded there: a suite that passes is what this job
  # reports before it reads a number, so the pair needs no job of its own
  coverage:
    name: Measure coverage, gated at 100%
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # 3.14, i.e. what .python-version pins and what a bare `uv run`
          # gives a maintainer locally: the number this job gates on is a
          # ratio of statements, and the statement count moves between
          # interpreters, so a threshold checked on one version is not the
          # one another measures. Pinned rather than inherited from
          # .python-version even so, because the coupling belongs where the
          # gate runs: the fail_under comment in pyproject.toml names this
          # version, and the two have to move together
          python-version: "3.14"
      - name: Run pytest under coverage
        run: >
          uv run --locked --no-default-groups --group test
          pytest --cov-report term-missing:skip-covered
          --cov=bitcoin_core_rpc --cov=tests

  # the packaging metadata is checked on every pull request, not only on
  # the tag that ships it: a release is the one place where finding a
  # problem is too late, a version being consumed by the upload that
  # carries it, and then only yankable. The release workflow calls this
  # one, so it runs these checks too, and its build job builds only what
  # it publishes
  dist:
    name: Build the distribution and install it
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree, so what is checked below is what a user
      # installing from source would get. That the sdist is complete in the
      # first place is check-manifest's job, a pre-commit hook, gated by
      # the lint workflow
      - name: Build the distribution files
        run: uv build
      # the same validation PyPI applies on upload: broken metadata, or a
      # README that does not render, cannot be fixed by reuploading
      - name: Check the metadata and the long description
        run: uv run --locked --only-group build twine check --strict dist/*
      # what twine does not look at: where the files land once installed,
      # a test package shipped by accident, a stray top-level module. This
      # distribution *is* a top-level module, which is the case the tool
      # reports as W004 unless the wheel says so, so what this catches here
      # is a second one appearing beside it -- `tests` above all, which is
      # a package in this tree and has no business in the wheel
      - name: Check the wheel contents
        run: uv run --locked --only-group build check-wheel-contents dist/*.whl
      # and what twine cannot see either: metadata that is valid but poor,
      # a missing classifier or url, a version PyPI would sort in a way
      # nobody meant. The pyroma pre-commit hook rates the source tree, for
      # an answer before pushing; this rates the sdist, i.e. the metadata
      # that would actually be shipped. --min 10 is a ratchet, the score
      # being 10 today
      - name: Rate the packaging metadata
        run: uv run --locked --only-group build pyroma --min 10 dist/*.tar.gz
      # what none of the three above does: install the wheel, alone, from
      # an empty directory, and use it. There is no dependency to resolve,
      # which is itself the thing asserted -- `importlib.metadata.requires`
      # reads the `Requires-Dist` the wheel carries, and a dependency added
      # to pyproject.toml by accident is a dependency a vendored copy of
      # this file silently does not have.
      # The version is asserted rather than printed, because a wheel
      # shipping no metadata would print nothing and pass; and a call goes
      # through a transport of its own, because importing a module proves
      # only that it parses
      - name: Smoke-test the wheel, installed on its own
        run: |
          cd "$RUNNER_TEMP"
          uv venv
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/python -c "
          from decimal import Decimal
          from importlib.metadata import requires, version
          import json
          import bitcoin_core_rpc as rpc

          name = 'bitcoin-core-rpc'
          print(version(name))
          assert not requires(name), requires(name)
          replies = []
          def transport(request, timeout):
              request_id = json.loads(request.data)['id']
              replies.append(request_id)
              body = {'jsonrpc': '2.0', 'id': request_id, 'result': 1.25}
              return 200, json.dumps(body).encode()
          client = rpc.BitcoinCoreRpcClient.from_chain(
              'regtest', user='u', password='p', transport=transport
          )
          assert client.call('getbalance') == Decimal('1.25')
          assert len(replies) == 1
          "

  # the single check main's branch protection requires from this
  # workflow, and it exists because that rule names its checks as literal
  # strings, stored outside the repository. The matrix above produces one
  # per (runner label, interpreter) pair -- a count that moves whenever the
  # matrix does: naming those directly means every matrix edit has to be
  # mirrored in a setting no pull request can review, and a name that stops
  # being produced -- macos-latest moving on, 3.10 aging out in its turn --
  # becomes a required check that never reports, which blocks every merge
  # until someone remembers where the rule lives.
  # This job depends on the others instead, so the rule names one thing
  # that never changes and adding a job here is enough to gate on it
  test-passed:
    # the name and not the id is what branch protection matches, and it
    # carries the workflow on purpose: a context is keyed by name alone, so
    # two workflows with a job named "every job passed" would produce one
    # ambiguous check. `lint` and `docs` need no aggregate of their own
    # while they have one job each -- the job *is* the context there -- and
    # the day either grows a second one, this pattern and a change to the
    # rule are what that costs
    name: "test: every job passed"
    needs: [suite, coverage, dist]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which branch protection counts as
    # satisfied. The gate has to run to be able to fail
    # not always(): a cancellation of this run itself -- the concurrency
    # group superseding it with a newer push -- would still reach this
    # job and have it fail explicitly, turning a cancellation the newer
    # run already speaks for into a required check with no defect behind
    # it. !cancelled() lets this job be skipped in that case instead,
    # which satisfies the check same as any other skip, while a single
    # needed job cancelled on its own still fails below
    # and the draft condition every job above carries, so a draft
    # skips uniformly rather than tripping the skip check below -- the
    # closed one for the same reason, added at the trigger above
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than testing
      # each job by name, so a job added to needs above is covered
      # without touching this. "skipped" is a failure here too: nothing
      # in this workflow is conditional, so a skip means something
      # upstream did not run
      - name: Fail unless every job above succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a job this gate depends on did not succeed"
          exit 1
