---
name: test

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups for every pull_request action except
    # closed on a merge -- see that trigger's own comment below, and the
    # concurrency block, for why closed is the exception and how the
    # group now avoids it. The pull_request run is the one worth
    # keeping, because it tests the merge commit and is the only run a
    # fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it. Tag pushes are covered by the release workflow
    branches: [main]
    # a documentation-only commit would otherwise run every job below.
    # None of these files is imported by the module or read by a test --
    # README.md is the PyPI long description, not a doctest source, and
    # CONTRIBUTING.md is checked by markdownlint, which is the lint
    # workflow's business.
    # Only on push: the same list on pull_request would be wrong, because
    # "test: every job passed" is a required check on main, and a required
    # check that
    # produces no run at all blocks the merge instead of passing it. The
    # changes job below is the pull_request-side answer to the same
    # question -- it runs, so the required check still reports, but skips
    # the jobs below it rather than the whole workflow when nothing in
    # the diff is something they read
    paths-ignore:
      - "*.md"
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though every job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, cancelling
    # the run testing the actual merge commit one to two seconds after
    # every merge -- observed on this repository's own main. The
    # concurrency block below groups a pull_request run by the pull
    # request's own number instead, which cannot equal any push's
    # github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
      version-suffix:
        description: >
          Appended to the version in pyproject.toml before the `dist`
          job builds anything, by the dev-version composite action
          (issue #1166: this is what lets that job's own build be the
          one a rehearsal publishes, rather than a second build checked
          separately). A release passes nothing and ships the version
          the tree declares; the rehearsal passes a .dev suffix, which
          is how it reaches TestPyPI with a version that index has not
          already consumed.
        type: string
        default: ""
      disable-dist-cache:
        description: >
          Whether the `dist` job's own `Setup uv` step fetches its
          dependencies afresh instead of from cache. Only release.yml's
          call sets this: a cache entry written by one run is read by
          another through GitHub's branch/PR cache scoping, so the job
          whose output actually reaches an index -- a tag's upload or a
          rehearsal's TestPyPI one, both routed through this same call --
          is the one build that must not risk a poisoned cache reaching
          the wheel it ships. An ordinary pull request or push to main
          builds a copy this job throws away, so caching it is harmless,
          and a flat `enable-cache: false` here would only cache-penalize
          every one of them for a property only release.yml's call needs.
        type: boolean
        default: false
  # the escape hatch: the gate on demand for a branch whose pull
  # request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must
# not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: the release workflow calls both
# this and lint.yml, and with that expression the two would share a group
# and cancel each other.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by, so a closed run cannot
# resolve to the same group as a push to main -- the pull_request
# trigger's own comment above has the evidence. A push carries no
# pull_request context, so github.ref is still what groups it.
# The suffix is a second, independent problem with github.ref: inside a
# called workflow that context is the caller's ref, so a rehearsal -- a
# workflow_dispatch of release.yml on a branch -- computes
# test-refs/heads/<branch>, the very group a push to that branch or a
# direct dispatch of this workflow computes. One then kills the other:
# either the rehearsal dies mid-build, or it cancels the run of the push.
# A tag run is unaffected, refs/tags/v* being a ref nothing else uses.
# release.yml passes a suffix of its own, which keeps the release path
# out of the branch groups while still letting a second rehearsal of the
# same branch supersede the first
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the cheapest job in the workflow, and the one that decides whether the
  # rest of it runs at all: a pull request that edits only prose changes
  # nothing the jobs below read, and was spending the whole gate to
  # prove it. coverage and dist each take this as a `needs` and
  # read its output; test-passed takes it too, so a failure here fails
  # the gate rather than being read as everything downstream correctly
  # declining nothing to do.
  #
  # Three things this must not get wrong:
  #
  # - it runs on every trigger, and answers `true` on all but one. A
  #   `changes` job that skipped itself off the pull_request path would
  #   leave every dependent reading an empty output, which is not 'true',
  #   and the whole workflow would skip on main and on a release
  # - README.md is not prose for this purpose. It is the long description
  #   the dist job's twine and pyroma steps check, so an edit to it is a
  #   change that job can fail on
  # - a workflow is *not* on the allowlist, deliberately: which workflows
  #   these jobs read is this file and what it calls, plus release.yml,
  #   and naming the rest would be a judgement call stale the first time
  #   one of them changes what it does. Leaving every workflow edit to run
  #   everything is the cheap direction to be wrong in
  #
  # Mirrors btclib-secp256k1's own `changes` job (#189), and issue #145's
  # heads-up about the permission it needs on the caller's side once it
  # landed here: release.yml's `test:` job grants it explicitly
  changes:
    name: Decide whether the jobs below have anything to check
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the file list of a pull request, which contents: read does not carry
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Ask which files the pull request touches
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # a push to main, a release call and a dispatch build everything:
          # only a pull request has a base to be a diff against
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT is not a pull request: everything runs"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate \
            --jq '.[].filename' > files.txt
          echo "files changed:"
          cat files.txt
          # every root prose file but README.md, .github's own markdown,
          # the mutation configuration (read by mutation.yml, not this
          # workflow) and the detect-secrets baseline (read by the
          # pre-commit hook lint.yml gates) -- nothing these jobs read.
          # An empty list is not a documentation change, it is a question
          # this could not answer, so the count is checked before the
          # pattern
          prose='^(AUTHORS|CHANGELOG|CLAUDE|CODE_OF_CONDUCT|COMPARISON|CONTRIBUTING|RELEASE_NOTES|RELEASING|REPOSITORY|REVIEWING|SECURITY)\.md$|^\.github/[^/]*\.md$|^\.github/mutation/[^/]*\.toml$|^\.secrets\..*baseline$'
          if [ ! -s files.txt ] || grep -qvE "$prose" files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "something the jobs below read changed: everything runs"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "prose only: the jobs below have nothing to check"
          fi

  coverage:
    name: Measure coverage, gated at 100%
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it and any step archiving
          # the workspace would carry it out of the job. No job in any of
          # these workflows performs an authenticated git operation -- the
          # release is created by gh, from GH_TOKEN in its environment --
          # so nothing needs it to stay.
          # This is the checkout every other workflow here cites: the one
          # on the gate, which runs on every pull request
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the cache holds the wheels uv.lock resolves, which every run
          # of every commit otherwise fetches again
          enable-cache: true
          # 3.14, i.e. what .python-version pins and what a bare `uv run`
          # gives a maintainer locally: the number this job gates on is a
          # ratio of statements, and the statement count moves between
          # interpreters, so a threshold checked on one version is not the
          # one another measures. Pinned rather than inherited from
          # .python-version even so, because the coupling belongs where the
          # gate runs: the fail_under comment in pyproject.toml names this
          # version, and the two have to move together
          python-version: "3.14"
      # --cov itself is not repeated here: addopts already carries it, and
      # what it measures is [tool.coverage.run]'s source. Naming
      # bitcoin_core_rpc and tests again here would be a second copy of
      # that list, and the copy a contributor cannot run, this file not
      # being what anyone types locally
      - name: Run pytest under coverage
        run: >
          uv run --locked --no-default-groups --group test
          pytest --cov-report term-missing:skip-covered

  # the packaging metadata is checked on every pull request, not only on
  # the tag that ships it: a release is the one place where finding a
  # problem is too late, a version being consumed by the upload that
  # carries it, and then only yankable.
  # issue #1166: this job used to build a copy that was checked and then
  # thrown away, while release.yml's own `build` job built a second,
  # separate copy -- with no SOURCE_DATE_EPOCH and no sdist normalization
  # -- and ran the same three checks on that copy again (issue #155),
  # because passing here said nothing about files this job never saw.
  # This job now does what that job used to: pin the timestamp, apply a
  # rehearsal's version suffix, build once, and upload what it built
  # before installing anything. release.yml no longer has a `build` job
  # at all; its publish jobs download this job's `dist` artifact and its
  # `attest` job signs the digests this job's upload already fixed. What
  # used to be two builds checked twice is one build checked once and
  # shipped unchanged -- btclib-secp256k1 has had this shape from the
  # start, for the same reason
  dist:
    name: Build the distribution files, check them, install one
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed'
      && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # caching off only when release.yml calls this workflow: this dist
      # job is then the one whose output is published -- a tag's upload
      # or a rehearsal's TestPyPI one -- and the reasoning is
      # version-check's own: a cache entry written by one run is read by
      # another through GitHub's branch/PR cache scoping, so the build
      # that actually ships is the one that must fetch its dependencies
      # afresh rather than risk a poisoned cache reaching the wheel an
      # index receives. An ordinary pull request's or push's build is
      # thrown away, so caching it is harmless; `disable-dist-cache`
      # defaults to false for exactly that reason
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: ${{ !inputs.disable-dist-cache }}
      # what the sdist normalizer below reads. uv_build itself ignores it
      # and stamps a fixed timestamp into both archives, so nothing in
      # this job is unreproducible without it; what the export and the
      # script together buy is that the answer is this repository's rather
      # than the backend's, which is the argument the script's docstring
      # carries and `attest` below is the reason for. The commit date, not
      # the tag's: `git log -1` on a shallow clone reads the tip, which is
      # the commit the tag points at, and a lightweight tag has no date of
      # its own to prefer
      - name: Pin the build timestamp to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # empty on every trigger but a release rehearsal: `inputs` is unset
      # outside a workflow_call, so a direct run of this workflow -- the
      # run a pull request or a push to main gets -- skips this and
      # ships the version the tree declares, same as a real release does.
      # TestPyPI refuses a version it has already seen, which is what the
      # suffix is for; release.yml's `version-check` job computes it once
      # and passes it down, so every job this workflow runs during one
      # dispatch agrees on it
      - name: Make the version unique for TestPyPI (rehearsal only)
        if: inputs.version-suffix != ''
        uses: ./.github/actions/dev-version
        with:
          suffix: ${{ inputs.version-suffix }}
      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree, so what is checked below is what a user
      # installing from source would get, and what a rehearsal ships is
      # built from the tree the step above just re-locked. That the sdist
      # is complete in the first place is check-sdist's job, a pre-commit
      # hook, gated by the lint workflow
      - name: Build the distribution files
        run: uv build
      # the member metadata of the sdist, rewritten to the epoch above so
      # that a rebuild of this commit answers with these bytes whatever
      # backend it runs. It rewrites metadata and no content, and it
      # rewrites rather than checks: every member's mtime goes from the 0
      # uv_build wrote to that epoch, so this step is what decides the
      # digest `attest` signs and dropping it would publish other bytes.
      # The measurement in its docstring is a different claim -- that the
      # archive is already deterministic without it. --no-project, so this
      # runs on the interpreter uv already fetched and installs nothing
      # into the tree it is about to publish. RELEASING.md has the command
      # that rebuilds a released tag and compares it against what PyPI
      # serves
      - name: Make the sdist's determinism this tree's
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/normalize_sdist.py dist/
          sha256sum dist/*
      # before anything is installed, and that ordering is the point: a
      # step below runs third-party code -- twine, check-wheel-contents
      # and pyroma come from a group uv installs, and a `.pth` file in a
      # dependency executes at interpreter startup, before the first
      # import -- while dist/ is a writable directory on the same
      # runner. Uploading first freezes what release.yml's publish jobs
      # will download, so the worst a compromised dependency can do here
      # is fail this job, which stops them from ever seeing what it built
      - name: Upload the distribution files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      # the same validation PyPI applies on upload: broken metadata, or a
      # README that does not render, cannot be fixed by reuploading.
      # After the upload above rather than before it, for the reason
      # given there
      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*
      # what twine does not look at: where the files land once installed,
      # a test package shipped by accident, a stray top-level module. This
      # distribution *is* a top-level module, which is the case the tool
      # reports as W004 unless the wheel says so, so what this catches here
      # is a second one appearing beside it -- `tests` above all, which is
      # a package in this tree and has no business in the wheel
      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl
      # and what twine cannot see either: metadata that is valid but poor,
      # a missing classifier or url, a version PyPI would sort in a way
      # nobody meant. The pyroma pre-commit hook rates the source tree, for
      # an answer before pushing; this rates the sdist, i.e. the metadata
      # that would actually be shipped. --min 10 is a ratchet, the score
      # being 10 today
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
      # what none of the three above does: install the wheel, alone, from
      # an empty directory, and use it. There is no dependency to resolve,
      # which is itself the thing asserted -- `importlib.metadata.requires`
      # reads the `Requires-Dist` the wheel carries, and a dependency added
      # to pyproject.toml by accident is a dependency a vendored copy of
      # this file silently does not have.
      # The version is asserted rather than printed, because a wheel
      # shipping no metadata would print nothing and pass; and a call goes
      # through a transport of its own, because importing a module proves
      # only that it parses.
      # After the upload too, for the reason its own comment gives:
      # installing a dependency executes its code, and a compromised one
      # must not reach a `dist/` that still has to be handed on
      - name: Smoke-test the wheel, installed on its own
        run: |
          cd "$RUNNER_TEMP"
          uv venv
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/python -c "
          from decimal import Decimal
          from importlib.metadata import requires, version
          import json
          import bitcoin_core_rpc as rpc

          name = 'bitcoin-core-rpc'
          print(version(name))
          assert not requires(name), requires(name)
          replies = []
          def transport(request, timeout):
              request_id = json.loads(request.data)['id']
              replies.append(request_id)
              body = {'jsonrpc': '2.0', 'id': request_id, 'result': 1.25}
              return 200, json.dumps(body).encode()
          client = rpc.BitcoinCoreRpcClient.from_chain(
              'regtest', user='u', password='p', transport=transport
          )
          assert client.call('getbalance') == Decimal('1.25')
          assert len(replies) == 1
          "

  # the single check main's branch protection requires from this
  # workflow, and it exists because that rule names its checks as literal
  # strings, stored outside the repository. The jobs above are three
  # names this file is free to change, and a matrix here would be worse
  # again, its cell names carrying values the matrix decides: naming
  # either directly means every such edit has to be mirrored in a setting
  # no pull request can review, and a name that stops being produced
  # becomes a required check that never reports, which blocks every merge
  # until someone remembers where the rule lives.
  # This job depends on the others instead, so the rule names one thing
  # that never changes and adding a job here is enough to gate on it
  test-passed:
    # the name and not the id is what branch protection matches, and it
    # carries the workflow on purpose: a context is keyed by name alone, so
    # two workflows with a job named "every job passed" would produce one
    # ambiguous check. `lint` and `docs` need no aggregate of their own
    # while they have one job each -- the job *is* the context there -- and
    # the day either grows a second one, this pattern and a change to the
    # rule are what that costs
    name: "test: every job passed"
    needs: [changes, coverage, dist]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which branch protection counts as
    # satisfied. The gate has to run to be able to fail
    # not always(): a cancellation of this run itself -- the concurrency
    # group superseding it with a newer push -- would still reach this
    # job and have it fail explicitly, turning a cancellation the newer
    # run already speaks for into a required check with no defect behind
    # it. !cancelled() lets this job be skipped in that case instead,
    # which satisfies the check same as any other skip, while a single
    # needed job cancelled on its own still fails below
    # and the draft condition every job above carries, so a draft
    # skips uniformly rather than tripping the skip check below -- the
    # closed one for the same reason, added at the trigger above
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than testing
      # each job by name, so a job added to needs above is covered
      # without touching this. "skipped" is no longer a failure here on
      # its own, now that coverage and dist are conditional on
      # purpose -- a prose-only pull request skips both by design,
      # and reading that as a defect would fail the gate the changes job
      # exists to let pass cheaply. changes is named in needs directly
      # though, so its own failure still shows up as "failure" in the
      # results and still fails this job -- only an *unexplained* skip
      # (changes answering nothing, either of the two not running while
      # changes said code=true) reads as the failure it is, and that
      # still shows up as "failure" propagated from changes or from
      # whichever job did not run for a reason of its own
      - name: Fail unless every job above succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
