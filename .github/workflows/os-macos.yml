---
name: os-macos

# the macOS half of the platform sweep, and os-ubuntu.yml's header is the
# argument for all three: why the gate runs one image, what a sentinel
# then owes, and what a matrix buys on a module built out of the standard
# library.
#
# macOS is where the wait that ended the old arrangement came from. These
# cells finish quickly and then queue for a runner far longer than the
# ubuntu and windows cells beside them, so a gate carrying them spent a
# review's wall clock on the scarcest runner family in the fleet rather
# than on the work. What settles it is not a cost of this repository's
# either way: it is the ceiling on concurrent jobs REPOSITORY.md's
# "Plan-gated settings" measures, beside the command that re-derives it,
# and this workflow is that ceiling applied to the macOS rows.
#
# What these cells buy is narrower than the matrix suggests, and the reason
# is in the client: the one platform-conditional branch in it is the datadir
# table in `default_datadir`, which the suite drives by patching
# `sys.platform` -- so the macOS row of that table is already asserted on
# every run, here and everywhere else. What is left for these cells is the
# `Path.home()` under it and the rest of the standard library the module is
# built out of -- `pathlib`, `decimal`, `urllib` -- on the one platform
# family the gate no longer samples.
#
# A workflow of its own rather than a row in deps-latest.yml, and that is the
# whole design: this one holds the dependencies at the lock and moves the
# platform, deps-latest.yml moves the platform and the dependencies both. A red
# macOS column in deps-latest.yml with this workflow green is an upgrade; red in
# both is macOS. One variable each, and the pair reads as a difference.
#
# It gates no commit and no merge -- a macOS regression sits on main for at
# most a week -- but release.yml calls it, so one cannot be published

on:
  schedule:
    # Saturday, with os-windows.yml an hour later: the two platforms the
    # merge gate does not wait for, on the day the grid gives to
    # platforms. Red in both is the tree; red in one is that platform,
    # which is the whole of what running them apart buys.
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "12 4 * * 6"
  # lets release.yml gate a publication on this platform too, which is what
  # keeps a weekly sentinel from being the only thing that ever asks
  workflow_call:
  # the escape hatch: the platform on demand, for a branch that touches
  # anything a path or a home directory reaches
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs: the subject here is the commit, which a newer one
# supersedes. Named literally rather than with github.workflow, which in a
# called workflow is the caller's name -- release.yml calls this one
# alongside test.yml, and with that expression the two would share a group
# and cancel each other
concurrency:
  group: os-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-macos:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # every cell to the end: which interpreter fails on which image is
      # the whole answer, and stopping at the first one hides the rest
      fail-fast: false
      matrix:
        # the two images test.yml no longer carries. Both, and not the
        # newest alone: one is Apple silicon and the other Intel, and what
        # differs between them is the architecture the interpreter targets
        os:
          - macos-26-intel
          - macos-latest
        # the same list os-ubuntu.yml carries, and its comment is the
        # argument for all three: this workflow moves the platform and
        # nothing else, so a difference between them is the platform's
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy3.11"
    # far above what a run of the suite needs, and it bounds a hung job
    # rather than a slow one: the queueing this workflow exists to move
    # happens before a job starts and is not counted here
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # --no-cov for the reason os-ubuntu.yml gives beside its own
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest --no-cov
