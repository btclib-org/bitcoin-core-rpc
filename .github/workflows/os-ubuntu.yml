---
name: os-ubuntu

# every ubuntu cell, once a week and run whole: both architectures
# against every interpreter, the cell the merge gate already runs
# included. That cell is ubuntu-latest on the interpreter
# .python-version pins, which is the `coverage` job of test.yml, and it
# repeats here so a red column reads as a column rather than as a
# question about which cells were left out.
#
# What the gate does not ask is the point of that split rather than a cost
# it hides. A regression on 3.10, on arm or on PyPy is not refused before
# a merge; it sits on main until this runs, at most six days. What the
# split buys is every pull request: the ceiling on concurrent jobs is
# shared across every repository in the organization -- REPOSITORY.md's
# "Plan-gated settings" is where the figure and the command that
# re-derives it live -- and a matrix on each commit is what a reviewer
# waits behind.
#
# Both images, and not the newest alone: what differs between them is the
# architecture the interpreter targets, and `ubuntu-24.04-arm` is the
# only place this package is asked about aarch64 at all.
#
# What a matrix buys at all, on a module with no compiled dependency and
# no third-party import, is the standard library it is built out of,
# which is not the same library everywhere. `urllib.request` and the
# `ssl` and `http.client` under it are the largest part of what this
# module does and the part that moves most between releases; `Path.home()`
# resolves through the passwd database here and through the registry on
# Windows, where `%APPDATA%` is what `default_datadir` reads instead, so
# os-windows.yml is the one place either is asked for real rather than
# patched; `decimal` is libmpdec on CPython and a Python implementation
# on PyPy, and the exact parsing of an amount is a promise this client
# makes. os-macos.yml and os-windows.yml are that argument on their own
# platforms, and each says what its own cells add to it.
#
# It gates no commit and no merge -- a regression sits on main for at most
# a week -- but release.yml calls it, so one cannot be published over a
# platform this never answered for

on:
  schedule:
    # Friday, hour 04: a platform sentinel is two architectures times
    # every interpreter, and three of them in one morning is the queue
    # this design exists to avoid. os-macos.yml has Thursday and
    # os-windows.yml the hour after this one.
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "12 4 * * 5"
  # lets release.yml gate a publication on this platform too, which is what
  # keeps a weekly sentinel from being the only thing that ever asks
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: the matrix on demand, for a branch that touches
  # anything an interpreter version or an architecture reaches
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs: the subject here is the commit, which a newer one
# supersedes. Named literally rather than with github.workflow, which in a
# called workflow is the caller's name -- release.yml calls this one
# alongside test.yml, and with that expression the two would share a group
# and cancel each other. The suffix is the second half of the same
# problem, github.ref inside a called workflow being the caller's
# ref: see lint.yml
concurrency:
  group: os-ubuntu-${{ github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  suite-ubuntu:
    uses: btclib-org/.github/.github/workflows/reusable-os-suite.yml@main
    with:
      runners: '["ubuntu-latest", "ubuntu-24.04-arm"]'
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "pypy3.11"]'
