---
name: os-windows

# the third platform the merge gate does not wait for. What a sweep owes
# and what a matrix buys a module built out of the standard library are
# os-ubuntu.yml's header, which os-macos.yml reads the same way.
#
# What keeps these rows off the gate is not a cost of their own: the gate
# runs one ubuntu cell on one interpreter, and every other image of every
# platform is a sentinel for the same reason -- the ceiling on concurrent
# jobs REPOSITORY.md's "Plan-gated settings" measures, beside the command
# that re-derives it. Which of the two images below costs more
# runner-minutes decides nothing here, both of them running weekly either
# way.
#
# **Both images**, where the gate now carries neither. The one
# platform-conditional branch in the client is the datadir table in
# `default_datadir`, whose rows the suite drives by patching `sys.platform`
# -- every row but the running one, so `%APPDATA%` and the `Path.home()`
# under it are asked for real only on a Windows runner. That is what the
# first image is for, and one row of it would answer completely: the
# question does not vary with the architecture the interpreter targets.
#
# The second image is here for what varies anyway. Nothing in this package
# is compiled, so which architecture the interpreter targets -- native
# arm64 for the versions the runner image caches, emulated x86-64 for the
# ones uv downloads -- is a property of the standard library under the
# module rather than of the module. Worth a week rather than a review's
# patience, which is the whole of why this file exists instead of a row on
# the gate.
#
# It gates no commit and no merge -- a regression here sits on main for at
# most a week -- but release.yml calls it, so one cannot be published

on:
  schedule:
    # Friday, the hour after os-ubuntu.yml: see os-macos.yml for why the
    # platforms run apart.
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "12 5 * * 5"
  # lets release.yml gate a publication on this image too, which is what
  # keeps a weekly sentinel from being the only thing that ever asks
  workflow_call:
  # the escape hatch: the image on demand, for a branch that touches a path,
  # a home directory or anything the datadir table reaches
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs: the subject here is the commit, which a newer one
# supersedes. Named literally rather than with github.workflow, which in a
# called workflow is the caller's name -- release.yml calls this one
# alongside test.yml, and with that expression the two would share a group
# and cancel each other
concurrency:
  group: os-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-windows:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # every cell to the end: which interpreter fails is the whole answer,
      # and stopping at the first one hides the rest
      fail-fast: false
      matrix:
        # both images: what differs between them is the architecture the
        # interpreter targets, and neither is on the merge gate, which is
        # one ubuntu cell -- every other image of every platform belongs
        # to a sentinel
        os:
          - windows-latest
          - windows-11-arm
        # the same list os-ubuntu.yml carries, and its comment is the
        # argument for all three: this workflow moves the image and
        # nothing else, so a difference between them is the image's
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy3.11"
    # far above what a run of the suite needs, and it bounds a hung job
    # rather than a slow one: the queueing this workflow exists to move
    # happens before a job starts and is not counted here
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # --no-cov for the reason os-ubuntu.yml gives beside its own
      #
      # windows-11-arm's default shell is PowerShell rather than bash:
      # "$GITHUB_ENV" and the rest of the POSIX spelling are literals
      # there, not variables, so a step with no shell: goes green having
      # done nothing. This one command has no POSIX-only syntax and
      # would run identically under either shell today --
      # btclib-org/btclib#1141 shipped in exactly this shape in btclib's
      # own pypi-install.yml, the defect latent until the next edit adds a
      # conditional, a substitution or a loop (issue btclib-org/btclib#1148)
      - name: Run pytest
        shell: bash
        run: uv run --locked --no-default-groups --group test pytest --no-cov
