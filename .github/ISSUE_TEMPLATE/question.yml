---
name: Question
description: Ask how the client does something, or why it does it that way
labels: [question]

body:
  - type: markdown
    attributes:
      value: >
        Discussions are not enabled here, so a question is an issue: this
        form is what keeps one from having to be filed as a bug. The
        [documentation](https://bitcoin-core-rpc.readthedocs.io/),
        the module docstring and the
        [README](https://github.com/btclib-org/bitcoin-core-rpc/blob/main/README.md)
        come first, and for a real-time answer there is the Slack channel
        linked from CONTRIBUTING.md.

  - type: textarea
    id: question
    attributes:
      label: The question
      description: >
        What you are trying to do, and what you have already read or
        tried. Code, if there is any: what a call returns and what you
        expected it to return is a sharper question than a description of
        either.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version, if it matters
      description: >
        `python -c "from importlib.metadata import version;
        print(version('bitcoin-core-rpc'))"`
      placeholder: "2026.8"
