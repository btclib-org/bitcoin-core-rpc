---
# every ecosystem this repo has but one, deliberately: the pre-commit
# hook revs are left out. Dependabot has a pre-commit ecosystem, and the
# maintainer decided to keep pre-commit.ci for them instead
# (btclib-org/.github#1391): its weekly autoupdate, configured in the ci:
# block of .pre-commit-config.yaml, already rewrites rev: for every repo:
# but local and meta, so a second bot on the same pin would only compete
# with it. typos is a repo: local hook, which autoupdate skips on purpose
# (see the comment beside it), so the version pinned in its
# additional_dependencies moves by nobody until a hand edit does.
#
# every pull request here runs the merge gate -- the suite on one image
# and the interpreter .python-version pins, the live-node smoke test, the
# hooks and the documentation build -- so each ecosystem groups its
# updates into a single pull request rather than paying for that once
# each. os-macos.yml is not in the gate and is not pre-validation either:
# it holds the lock, so an upgrade never reaches it. None declares a
# target-branch: without one dependabot opens against the default branch,
# which is the only branch a change lands on.
#
# Weekly: the latest workflow upgrades everything uv resolves and runs
# the suite, the lint gate and the packaging checks against it, on a
# schedule, off the critical path, so each pull request is a diff whose
# result is already known, and a smaller one is easier to read and to
# revert. Monthly would be defensible only if nothing exercised the
# drift beforehand -- a month of it arriving in one diff is harder on
# both counts. The github-actions ecosystem gets the same interval for
# symmetry rather than for evidence: nothing pre-validates an action bump,
# but actions move rarely, and a week where none did produces no pull
# request at all.
#
# The seven day cooldown is what the interval is really
# trading against: a compromised release is usually yanked within days.
# Weekly plus cooldown still means nothing but btclib-org/.github's tags,
# excluded in the github-actions block, is offered before it has been
# public a week, wherever the release can be dated: the docker block says
# where it cannot. The offer then comes at most a week after that,
# rather than at most a month. No ecosystem tracks anything
# security-critical, so nothing here wants to be faster than that
version: 2
updates:
  # every action is pinned to a commit SHA, which nothing but this
  # moves: without it a pin is frozen forever, and a fix (or a security
  # advisory) upstream would never reach this repository
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # thursday, where the latest workflow runs wednesday: the sentinel
      # has just reported when the pull requests are opened. It buys the
      # actions ecosystem nothing, which the sentinel does not cover, but
      # two schedules a day apart are one thing to remember instead of two.
      # The same pair of days as every other repository of the organization
      # that runs a weekly deps-latest sentinel: one weekday-pair to
      # remember across them, rather than one each
      day: thursday
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
      # the exclude section 11 of btclib-org/.github's README.md gives for
      # that repository's own tags, which the calls in .github/workflows pin
      exclude: ["btclib-org/.github/*"]

  # uv.lock is committed and the workflows install from it with --locked, bar
  # the jobs that re-lock on purpose or install a published or built package,
  # while the dependency groups declare a floor and no ceiling: this project has
  # no runtime dependency, so the drift of what the lock pins above those floors
  # is all tooling -- ruff, mypy, pytest, sphinx -- and this moves it, bar the
  # one exception section 1 of btclib-org/.github's README names. The uv-lock
  # pre-commit hook only re-locks what pyproject.toml changed, it does not
  # upgrade, and the latest workflow tests an upgrade it deliberately never
  # commits
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: thursday
    groups:
      dev-tooling:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # .clusterfuzzlite/Dockerfile pins the image fuzz.yml builds in by
  # digest, which nothing but this moves: without it the pin is frozen at
  # the image of the day it was written. The cooldown is inert here:
  # dependabot-core dates a docker tag only on Docker Hub
  # (registry_tag_release_date, docker/lib/dependabot/docker/
  # update_checker.rb) and this image is on gcr.io. It is kept so that one
  # rule holds for every ecosystem, and it takes effect with no edit here
  # where the registry or dependabot-core changes
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: thursday
    groups:
      base-image:
        patterns: ["*"]
    cooldown:
      default-days: 7
