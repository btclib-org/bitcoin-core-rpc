# The whole of this project, mutated: a package of modules, whose
# boundaries are a protocol's rather than a format's.

[cosmic-ray]
module-path = "src/bitcoin_core_rpc"

# What a session finds is the workflow's own output: it prints the counts
# and uploads the surviving mutants with their diffs. What belongs here
# instead is the judgement -- which survivors are not a test to write,
# and why.
#
# `RPCErrorCode`'s members are values transcribed from Core's own header,
# so replacing a member's number, or the sign in front of it, survives
# unless a reply recorded under `tests/_data` carries that code. A test
# pinning every member to its number is that transcription written a
# second time, and it agrees with a mistranscription as readily as with
# Core.
#
# Bitwise replacements whose constant operands have disjoint bits
# (`+ 1024` and `+ 1` becoming `|` and `^`) compute what `+` computes.
# Identity comparisons stand in for equality between booleans, and
# `remaining > 0` for `remaining != 0` on a bounded read that cannot go
# negative. An ordering stands in for `==` or `!=` against the literal
# `"signet"`, true while every chain a test passes sorts to one side of
# it. The adjacent comparison stands in at both length boundaries of the
# signet challenge: nothing a test builds is exactly the length the first
# refuses above, and the longest challenge reaching the second is the one
# the two-byte form begins at. The sign in the wallet-path check's
# `[-2:]` widens a slice the check reads for membership. Arithmetic on
# `_READ_CHUNK` and on the read deadline moves a constant no test pins to
# its own value.
#
# A bare keyword-only `*,` marker becomes the positional-only `/,`, which
# Cosmic Ray's parso-based operator reads as division: it excludes the
# `*` of `*args`, which parso parents to the named parameter, but not a
# marker that names none. What it leaves accepts every call the
# keyword-only form accepts.

# The client tests judge JSON-RPC construction and validation, credentials,
# cookies and per-call bounds. The chain tests judge the port, datadir and
# network vocabulary tables, the magic bytes and the signet derivation, and
# `cookie_auth`'s own reading of a cookie file. The transport tests judge
# the default urllib implementation and the custom-transport seam. The
# census tests are the contract that distinguishes a package from an
# ordinary module: every one of the four importing nothing outside the
# standard library and each other, in the order errors < chains <
# transport < client, and `chains.py` and `errors.py` each leaving
# `urllib.request`, `ssl` and `socket` out of a fresh interpreter.
#
# -n0 avoids paying xdist startup once per mutant; -p no:randomly keeps the
# first killing test and therefore the runtime reproducible. --no-cov is
# deliberate, and no longer the default it once was: --cov is now in
# addopts, and left unopposed here it would instrument every one of the
# per-mutant subprocess runs for nothing. Worse than the overhead: a
# mutant that removes a statement makes the ratchet fail for a reason that
# has nothing to do with whether the suite noticed the mutation, and every
# such run would then be recorded as a kill.
test-command = """python -m pytest -x -q -n0 -p no:randomly --no-cov \
  tests/chains_test.py tests/transport_test.py tests/client_test.py \
  tests/census_test.py"""

# The per-mutant ceiling is wide: a timeout is reported as KILLED by Cosmic
# Ray, so a tight bound turns runner load into a false kill, and this scope
# includes response-reading loops whose bounds are among the expressions being
# mutated.
timeout = 300

excluded-modules = []

# Every `|` in an annotation is stored rather than evaluated, every module
# importing `annotations` from __future__. Cosmic Ray gives each one eleven
# binary-operator replacements, which is a large block of mutants no
# execution can distinguish. Keep them out of the actionable report; the
# workflow applies this filter after init, as documented in mutation.yml.
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]

[cosmic-ray.distributor]
name = "local"
