[build-system]
# glob patterns in the [tool.uv.build-backend] table below, beside the
# rest of the configuration, in place of the separate include and exclude
# language of a MANIFEST.in. That a pure-Python project uses this backend
# is btclib-org/.github#118, and btclib is where it was done first, this
# pin included.
#
# What the floor has to clear is 0.12.0, where the sdist's own
# pyproject.toml became a normalized copy of this file with the verbatim
# one kept beside it as pyproject.toml.orig. Below that the sdist holds
# one answer where it now holds two, which is a different archive rather
# than an older one. To re-derive, with the specifier below replaced by
# ==0.11.31 and then by ==0.12.0:
#
#     uv build --sdist -o d && tar tzf d/*.tar.gz | grep orig
#
# answers with nothing and then with pyproject.toml.orig.
#
# It sits at 0.12.5 and not at 0.12.0 for two reasons that are neither of
# them a constraint, so this is the number to lower first if a resolver
# ever wants it lower: 0.12.5 is the rev .pre-commit-config.yaml pins for
# uv-pre-commit, which keeps the backend that builds the archive no older
# than the uv whose lock format that hook writes; and it is btclib's
# floor, which is what has the two repositories answering this question
# with one number.
#
# The ceiling is the next minor, which is where uv's versioning policy
# puts a breaking change, this backend releasing with uv and versioned by
# it
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "bitcoin-core-rpc"
# the one place the version is declared: docs/source/conf.py parses this
# file rather than the installed metadata, which would need the package
# installed to build the documentation. There is no `__version__` in any
# module of the package either: the release tag is the version, and a
# constant inside the package is a second one that drifts against it
#
# calendar versioning, `YYYY.M.D`: what ages in a client of a node is which
# Core versions its recorded replies were recorded against, and a date says
# that where a compatibility number does not. There is no dependency here
# whose bump such a number would have to describe either, so what a release
# breaks is announced in RELEASE_NOTES.md rather than encoded in a digit
#
# no leading zero in the month: PEP 440 normalizes `2026.08` to `2026.8`,
# and release.yml compares the tag to this string literally, so a padded
# one would be a tag no release matches
#
# which string is which -- what this declares between releases, and what a
# release day adds to it -- is RELEASING.md's "Which version string is
# which", and release.yml's version-check job is what enforces it
version = "2026.9"
description = "A standalone JSON-RPC client against Bitcoin Core"
readme = "README.md"
# PEP 639: an SPDX expression, which becomes the `License-Expression`
# metadata field, and the files it is carried by. The deprecated TOML-table
# form wrote a free-text `License:` field instead, and there is no license
# classifier below for the same reason -- one machine-readable statement
# rather than three spellings of it.
#
# AUTHORS.md is named beside LICENSE rather than dropped, and the list is
# read rather than defaulted: both files are under `dist-info/licenses/` in
# the built wheel, and the MIT notice this repository carries names "The
# btclib developers" -- AUTHORS.md being where the members of that
# collective are listed.
#
# Naming LICENSE here is also what puts it in the sdist, extensionless and
# reached by no pattern of [tool.uv.build-backend] source-include below
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
# 3.10 rather than 3.9, and the usual reason -- a split lock file -- is not
# this project's, which resolves no runtime dependency at all. What decides
# it is the type checker: 3.10 is the oldest mypy can be aimed at ("Python
# 3.9 is not supported (must be 3.10 or higher)"), so a floor below it
# would be a floor nothing static ever checks, on a package whose whole
# surface is annotations a caller type checks against. 3.9 is also
# end-of-life since 2025-10
requires-python = ">=3.10"
# none, and that is the product rather than an omission: `errors.py`,
# `chains.py`, `transport.py` and `client.py` between them import `json`,
# `base64`, `decimal`, `pathlib`, `secrets` and `urllib.request`, all of
# them standard library and nothing else -- `tests/census_test.py` is what
# checks each of the four against this, so the empty list is a contract
dependencies = []
# the GitHub repository topics, in the same order, and the order is by
# relevance rather than alphabetical: PyPI shows keywords as the metadata
# gives them, and GitHub sorts its own, so there the order decides only
# which topic goes when the twenty it allows are full -- this list is well
# short of that. Lowercase throughout, a GitHub topic being lowercase or
# not a topic, so that one spelling serves both lists.
#
# What is not here: `python`, which names no feature and is what the
# `Programming Language ::` classifiers below already say; `type-hints`,
# which `Typing :: Typed` says the same way, machine-readably; and a chain
# name, `from_chain` carrying Core's defaults for all five and no keyword
# naming one of them being better than naming none
keywords = [
    "bitcoin-core",
    "bitcoind",
    "bitcoin",
    "bitcoin-rpc",
    "json-rpc",
    "rpc-client",
    "rpc",
    "zero-dependency",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    # true, and it takes `src/bitcoin_core_rpc/py.typed` to be true: PEP 561's
    # marker is a file *inside a package directory*, so this claim and the
    # single-directory layout below are one decision. See
    # [tool.uv.build-backend]
    "Typing :: Typed",
]

# the seven links section 3 of btclib-org/.github names, keyed as btclib
# and btclib-secp256k1 key them: the index reports the key as written --
# v2026.8.20 is on it as "GitHub" and "Pull Requests" -- so the spelling
# is what a reader sees, and one spelling across the three published
# packages is what lets a check read the set back
[project.urls]
homepage = "https://bitcoin-core-rpc.readthedocs.io/"
documentation = "https://bitcoin-core-rpc.readthedocs.io/"
download = "https://github.com/btclib-org/bitcoin-core-rpc/releases"
# RELEASE_NOTES.md and not CHANGELOG.md: this url is what an index puts
# behind "Changelog", and what a user following it wants is the release
# notes, not the record behind them. CHANGELOG.md is linked from the
# first lines of that file
changelog = "https://github.com/btclib-org/bitcoin-core-rpc/blob/main/RELEASE_NOTES.md"
repository = "https://github.com/btclib-org/bitcoin-core-rpc"
issues = "https://github.com/btclib-org/bitcoin-core-rpc/issues"
pull_requests = "https://github.com/btclib-org/bitcoin-core-rpc/pulls"

[dependency-groups]
# what it takes to develop, build and test this package. hypothesis is
# absent, unlike in a codec library where the malformed input nobody wrote
# down is the point. Most of what this module refuses is a shape -- a
# mapping keyed by an int, a body that is not utf-8, a status -- and the
# shapes are enumerable, which is what the parametrized cases below
# `tests/` are.
#
# `_read_bounded` is the half that reasoning does not cover, and it was
# measured rather than assumed: its arithmetic is over indices, which is
# the space a generator searches and a case list does not. What the search
# would buy here is nothing, for two reasons in the code. The accumulator
# is one bytearray and the body is decoded once, after the loop, so a
# chunk boundary falling inside a multibyte character is not a state this
# module can reach. And a body is cut in two places, both of them reached
# only under a non-200: `_read_bounded`'s `truncate=True`, and the
# `MAX_ERROR_BODY_SIZE` slice taken where a caller's own transport
# returned a non-200 without raising, which `_read_bounded` never sees.
# Under a non-200 `_reply_object` answers every parse failure -- a split
# character included -- with the status, which is what the untruncated
# body answers with too. Grepping `truncate` alone finds one of the two,
# which is why both are named here. What is left is two indices,
# `max_body_size` and one past it, and `tests/transport_test.py` asserts
# both, in each direction and against a disagreeing `Content-Length`
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
    # `override` for the test doubles: typing has it from 3.12 and the
    # interpreter floor is 3.10. The package itself cannot take it either
    # way -- census_test.py reads the imports of every module and refuses
    # any outside the standard library
    "typing-extensions",
]
# a floor here and on nothing else in this group: the suppressions in this
# tree are written `ruff: ignore`, and 0.16 is the first release that reads
# them. An older ruff does not fail on the syntax -- it fails on the
# findings those comments suppress, which is the confusing way to learn it
lint = ["mypy", "pre-commit", "ruff>=0.16"]
# mutation testing, which asks the question coverage cannot: a line the
# suite executes is not a line the suite checks. Its own group and not part
# of test, because every cell of the matrix installs that one and none of
# them runs this -- the scheduled mutation workflow is the only consumer,
# and it asks for --group test as well, cosmic-ray shelling out to pytest
mutation = ["cosmic-ray"]
# the distribution files are built and published by uv itself: what this
# group holds is what inspects them, before an upload consumes the version.
# Named check, not build, so that --only-group build means the same thing
# in btclib-secp256k1, which genuinely needs a group for building wheels
check = ["check-sdist", "check-wheel-contents", "pyroma", "twine"]
docs = ["furo", "myst-parser", "sphinx"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "check" },
    { include-group = "docs" },
    { include-group = "mutation" },
]

[tool.uv]
# the oldest uv that may read uv.lock, at the ceiling rather than safely
# below it -- section 1 of the organization standard argues why, and
# section 15 carries the command that re-derives the ceiling
required-version = ">=0.12.5"

[tool.uv.build-backend]
# `module-name` is not written beside this: it defaults to `project.name`
# normalized, which is this name already, and a second declaration is a
# second thing to keep in agreement.
#
# What that name points at is a package directory, which is a shape a
# module has no way to take and `py.typed` needs regardless of how many
# files sit under it. This distribution is annotated throughout and type
# checked in strict mode, and PEP 561 gives it no way to say so as a
# top-level module -- the marker has to sit inside a package directory.
# Measured against a built wheel of each layout, with a consumer running
# `mypy --strict` and no configuration of its own:
#
#   bitcoin_core_rpc.py                     every name is `Any`, plus
#                                           "missing library stubs or
#                                           py.typed marker"
#   bitcoin_core_rpc.py + py.typed beside   the same; mypy looks for the
#                                           marker under `<module>/`
#   bitcoin_core_rpc.pyi beside it          the same
#   bitcoin_core_rpc/ + py.typed            checks, and catches a wrong
#                                           argument type
#
# So the alternatives are a `bitcoin_core_rpc-stubs` distribution, which is
# a hand-written second copy of the whole interface and drifts the first
# time either moves, or leaving every typed consumer to configure
# `follow_untyped_imports` for this one module -- which btclib measured at
# 21 lines of override, and which the consumers who do not notice pay in
# silence rather than in errors.
#
# There is no package-data entry beside this: the backend copies what is
# under `module-name` whole, `py.typed` and any other non-`.py` file
# included, so nothing has to name that marker a second time.
#
# what the sdist carries beyond what the backend puts there by itself --
# pyproject.toml, the module above, and the files `project.readme` and
# `project.license-files` name. Patterns are anchored, so `*.md` is the
# root's own markdown and reaches neither docs/'s nor tests/'s: `/**` is
# what recurses.
#
# The lint gate has to be runnable from an unpacked sdist, which is what
# puts .pre-commit-config.yaml (`*.yaml`) in, and .taplo.toml (`*.toml`),
# .markdownlint.jsonc (`*.jsonc`) and .secrets.baseline, which hooks read,
# with it. `*.yaml` rather than the three names, .readthedocs.yaml and
# .yamllint.yaml being the other two and there being no fourth at the root
# for the glob to take by accident -- the workflows are under .github,
# which an sdist does not carry.
#
# COPYRIGHT is not here, and not in `license-files` above either: it is
# the organization's notice, a repository file and not a distributed one,
# and a consumer of the package has the holder in LICENSE already
# (btclib-org/.github#135). Extensionless, so no pattern above reaches it
# by accident, and [tool.check-sdist] below is where the hook is told it
# stays out on purpose
source-include = [
    "*.jsonc",
    "*.md",
    "*.toml",
    "*.yaml",
    ".python-version",
    ".secrets.baseline",
    "uv.lock",
    "docs/**",
    "tests/**",
]
# exclusions win over the inclusions above, and are unanchored unless a
# pattern starts with "/": a bare name matches at any depth, and
# everything below a match goes with it.
#
# check-sdist reads this list for the uv backend, so a tracked file a
# pattern here takes out is not reported as one the sdist is missing, and
# does not have to be named again in [tool.check-sdist] below
source-exclude = [
    # where sphinx-build writes, CONTRIBUTING.md's docs command naming
    # docs/build/html: `docs/**` above reaches it, so an sdist built after
    # that command carries the whole rendered site without this line.
    # Anchored, nothing else here being called build. __pycache__, *.pyc
    # and *.pyo are the backend's own default excludes and are not
    # repeated
    "/docs/build",
    # the three test modules whose subject is not in the archive. `.github`
    # is not shipped -- it is on check-sdist's own default ignore list --
    # and each of these reads it: the first two load a script out of
    # `.github/scripts` by path, `.github/scripts` being no package, and
    # the third reads the interpreter matrices out of `.github/workflows`.
    # Shipped, they are a `FileNotFoundError` and a failed assertion rather
    # than a test, so a downstream packager building from the sdist and
    # running the suite -- which is what a distribution build does -- reads
    # a red run that says nothing about this package. Anchored, so that
    # nothing else of that name anywhere goes with them
    "/tests/rpc_smoke_test.py",
    "/tests/normalize_sdist_test.py",
    "/tests/interpreters_test.py",
    # a cache a linter or a type checker writes beside the file it has
    # just read, and not something anyone puts there on purpose: the VS
    # Code mypy extension .vscode/extensions.json recommends writes one
    # per directory it type-checks, so one can appear under tests/ or
    # docs/, which `**` above reaches whole. btclib shipped a nested one
    # that way (btclib-org/btclib#985) and carries these three patterns
    # for it. Unanchored, a cache being wherever the tool that wrote it
    # was pointed
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    # the same kind of leftover, and the one this list is checked against
    # on every run: the check-sdist hook below passes --inject-junk, which
    # plants tests/package/anything.egg-info beside the sources for the
    # length of it
    "*.egg-info",
    # coverage.py's own data file, written beside the tree it measured
    # rather than under a cache directory: `cd tests && uv run pytest .`
    # leaves `tests/.coverage` behind, gitignored and unanchored the same
    # way as the three cache entries above
    ".coverage",
    ".coverage.*",
    "coverage.xml",
]

[tool.check-wheel-contents]
# what the module declaration above is for: a wheel that ships the
# directory it points at, and nothing that check-wheel-contents' own
# defaults would flag anyway (an unrelated top-level file, an empty
# library) needs no configuration to catch. What defaults do not catch is
# a file the tree has and the wheel does not -- `py.typed` dropped by a
# pattern that stopped reaching it, say -- because with no `package` given
# check-wheel-contents reads the wheel's own RECORD and asks nothing
# about the source tree the wheel was supposed to carry. `--package
# src/bitcoin_core_rpc` is what asks that question: it diffs the wheel's
# `bitcoin_core_rpc/` against this checkout's, file for file, in both
# directions (W101 missing, W102 extra). Measured against a wheel built
# with `py.typed` stripped out and `RECORD` edited to match -- a build
# that installs and imports cleanly -- unconfigured check-wheel-contents
# reports it clean and this configuration reports "W101: Wheel library
# is missing files in package tree: bitcoin_core_rpc/py.typed".
#
# That is the whole of what this repository needs: `check-sdist`
# below already gates the sdist against this same tree (a pre-commit
# hook, gated by the lint workflow), so together the two amount to
# `git tree == sdist == wheel`, verified in one hop each rather than
# through a third script comparing the sdist to the wheel, which is a
# comparison a single-module, dependency-free package with no data
# directory has nothing to add to. See
# btclib-org/btclib#1160 for that comparison across this organization's
# three publishing repositories.
package = ["src/bitcoin_core_rpc"]

[tool.check-sdist]
# tracked files the sdist is meant not to carry. What
# [tool.uv.build-backend] source-exclude names is not repeated here:
# check-sdist reads that list for the uv backend, so this holds only what
# no include pattern adds in the first place -- the workspaces of an
# editor and of an agent, the two files git itself reads, and COPYRIGHT,
# which [tool.uv.build-backend] above says why the sdist does not carry.
# Patterns are gitignore's, so a directory covers what is under it at any
# depth.
#
# .github is on check-sdist's own default ignore list, which is why the
# workflows and the scripts they call need no entry here
git-only = [
    ".claude/",
    ".gitattributes",
    ".gitignore",
    ".vscode/",
    "COPYRIGHT",
]

[tool.pytest.ini_options]
# where the tests are, so a bare "pytest" from the root collects them and
# nothing else, whatever else the tree grows
testpaths = ["tests"]
# -ra summarizes everything that was not a plain pass. Across a matrix of
# interpreters and platforms a skip, an xfail or a warning is otherwise
# invisible: it is not a failure, so nobody opens the log to find it.
# --strict-config makes a typo in this very table an error rather than a
# warning that scrolls past a hundred lines of dots, and --strict-markers
# does the same for a marker nobody registered, which is how a misspelled
# skipif silently stops skipping.
#
# --cov is here so that the fail_under ratchet below is what a bare
# `uv run pytest` measures, rather than something only the `coverage` job
# in test.yml reaches: a gate met after a change is pushed is met too
# late. Moving it cost nothing measurable -- the suite takes the same
# time either way from 3.12 on, coverage.py using sys.monitoring there.
#
# Its position is load-bearing: --cov takes an *optional* value, so as
# the last token here it would be handed whatever the command line goes
# on to say -- `pytest tests/transport_test.py` becomes
# `--cov=tests/transport_test.py`, the whole suite runs regardless, and
# it reports against fail_under having measured a directory `omit`
# excludes. Anywhere but last is safe, so it sits right after -ra rather
# than at a place this comment would have to move again.
#
# Naming no source here -- source lives in [tool.coverage.run] -- so
# there is one list of what is measured, not a second copy only a
# maintainer can run, this table not being what test.yml's coverage job
# types.
#
# Moving --cov into addopts means `uv run pytest tests/transport_test.py`
# would otherwise fail on the tree's coverage rather than its own:
# tests/conftest.py's pytest_configure hook is what keeps a selective run
# reported and not gated.
#
# pytest-randomly is in the test group and needs no flag here: installed,
# it shuffles the order and prints the seed, and `-p no:randomly` puts the
# file order back when a failure has to be reproduced against it. What it
# guards is the one thing a green suite cannot tell you about itself --
# whether a test passes because of what ran before it. Not hypothetical on
# this module: `DEFAULT_DATADIR` is computed at import and several tests
# patch `Path.home`, so a test reading the constant after another has moved
# the home is exactly the ordering a fixed order would hide
#
# no `-n auto`, and its absence is measured rather than an omission: on this
# suite a worker pool costs more than it saves, because nothing here waits
# on the network and the whole of it finishes before ten workers have
# started. Nine interleaved runs each, medians, all of them green:
#
#     serial 0.50s against 0.90s parallel, and under coverage 0.65s
#     against 1.23s -- 1.8x and 1.9x the wrong way
#
# and in CI the same, ubuntu 0.68s against 0.85s with the coverage job 0.90s
# against 1.30s. Windows looked like a win at one run per configuration
# across a spread wider than the difference, which is not a claim. The
# command that re-derives it is `pytest --durations=0`, and the criterion
# this family applies is in checksig's docs/test-parallelism.md: the pool
# pays where the suite is long enough to amortise starting it, which there
# means node-starting tests at a second each and here means nothing.
# pytest-xdist stays in the test group: the mutation session passes `-n0`,
# and without the plugin pytest rejects the flag rather than ignoring it
addopts = "-ra --cov --durations=8 --strict-config --strict-markers"
# a test that was expected to fail and passed is a fixed bug still marked
# as broken: strict turns it red instead of reporting xpass
xfail_strict = true
# a deprecation warning is the early form of a break, emitted years before
# the removal that will fail the suite: on a 3.10 to 3.14 spread, plus
# pypy, there is time to act on it only if it is not silent. It is not
# theoretical for a module built on `urllib.request`, whose opener and
# handler api this one reaches into.
# The list carries no ignore, and no test silences a warning wholesale
filterwarnings = ["error"]

[tool.codespell]
# .secrets.baseline and uv.lock are hashes, and the recorded reply bodies
# under tests/_data are what a node sends, byte for byte: a spell checker
# correcting a word inside Core's own error message would void the pin that
# tests/_data/README.md states. By extension rather than by directory, so
# that tests/_data/README.md -- which records where each of those files
# came from -- is still spell checked, being prose about the data and not
# the data
skip = "*/_data/*.json,.secrets.baseline,uv.lock"
# a misspelling written on purpose goes in backticks, and that is a
# convention of this repository rather than a preference: prose that
# documents a spell checker has to name what it catches. codespell has no
# per-file configuration, so it holds everywhere it reads; what the rule
# hides from it is what is written inside backticks, i.e. identifiers,
# which are typos' half of the work and not this hook's -- [tool.typos]
# below configures that half, and this table the other
ignore-regex = '`[^`]*`'

# the second spell checker, and the pair is deliberate: the two are blind
# in different places, so neither subsumes the other. codespell matches
# whole words against a curated list of misspellings, and its word regex
# keeps the hyphen inside the token: `hex-strin` is one word, in no
# dictionary, and therefore silent, while typos splits hyphens, snake_case
# and camelCase itself. One thing typos does not read is this file:
# pyproject.toml is skipped even under --isolated, its own configuration
# not being something a spell checker can sensibly check. Everything below
# is therefore codespell's to keep honest
[tool.typos.files]
# the same files [tool.codespell] skips above, for the reasons given there,
# and the list has to be written again rather than shared because the glob
# syntax differs: "*/_data/*.json" matches at any depth for codespell and
# one directory deep for typos.
#
# This table is silent without --force-exclude in the hook's args:
# pre-commit passes filenames, and typos honours its own exclude list only
# under that flag. So the two are one setting written in two files, and
# dropping the flag does not narrow the exclusion, it removes it. The
# hook's other flag, --write-changes, is what makes that matter: it is
# what would rewrite a recorded reply body rather than report it
extend-exclude = [
    "**/_data/*.json",
    ".secrets.baseline",
    "uv.lock",
]

[tool.typos.default]
# hashes, transaction hex and base64 credentials written inline in the test
# sources, which splitting into words turns into a spell checker's worst
# input. The hook runs with --write-changes, so with the rule off it
# rewrites the sources it reads. Ignored by shape rather than by file,
# because those literals sit next to prose that has to stay checked: an
# unbroken run of 26 characters or more is a literal and not a word, 26
# being the length of the shortest possible base58 address; the trailing =
# covers base64 padding, and no English word comes close
extend-ignore-re = ['[0-9A-Za-z+/]{26,}={0,2}']

[tool.typos.type.verbatim]
# the backtick convention of [tool.codespell] above, honoured on the files
# that quote a spelling on purpose rather than on all of them: outside
# these a backticked word is an identifier, and identifiers are what this
# hook is here for
extend-glob = ["CHANGELOG.md", "RELEASE_NOTES.md", ".pre-commit-config.yaml"]
extend-ignore-re = ['`[^`]*`']

[tool.coverage.run]
# named rather than left to --cov alone: unnamed, --cov measures every
# file the run imports, which reaches a script imported by path -- the
# failure mode is a local checkout gated stricter than the CI it exists
# to reproduce, because a script's main() runs only in a subprocess
# nothing here starts in-process. bitcoin_core_rpc is the package this
# distribution ships; tests is included too, because a test nothing runs
# is dead code with the authority of a test.
source = ["bitcoin_core_rpc", "tests"]
omit = ["*/site-packages/*"]
# statement coverage calls a half-tested `if` fully covered: the line ran,
# one of its two ways out never did. What that hides here is this module's
# own shape -- it is a thin client whose bodies are guard clauses, an
# early return for the credential already supplied, for the cookie file
# already read, for the response that is not an error -- so the branch
# nothing takes is exactly the refusal nobody exercised
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# a local threshold rather than a coveralls.io upload: no secret, no third
# party service, and enforced on every run instead of only on pull requests
# targeting main.
# 100 is not the same rule with the bar raised: coverage special-cases it,
# so `round(total, precision) < fail_under` does not apply and nothing
# short of an exact 100.00% passes -- 99.999% is a red build, where 99.99
# passed everything above 99.985%. The statements it allows to go uncovered
# are therefore zero, and that is the whole of why.
# The price is that a line no ordinary run reaches no longer disappears
# into a rounding step. It is covered by patching what stands in the way --
# which is what the transport tests already do to `_OPENER` -- or it
# carries a `pragma: no cover` with the reason beside it. Neither of those
# is a build left red.
# Measured on one interpreter, 3.14, and on one operating system, and that
# is enough at 100: there is no sys.version_info branch in this tree, and
# the one sys.platform branch -- the datadir table in `default_datadir` --
# is driven by patching `sys.platform`, so a run on any of them walks all
# three of its rows
fail_under = 100.0

[tool.mypy]
strict = true
show_column_numbers = true
# the organization's list, section 6 of btclib-org/.github, the same in
# every repository that runs mypy (btclib-org/.github#165). A code that
# finds nothing here stays: it is a ratchet for the next line it would
# catch, not a cleanup of this one
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# set the same way across the organization, and unlike the list above it
# is not a ratchet with nothing to catch: the survey that added it here
# found a runtime isinstance guard on a value whose static type already
# promised more than an untrusted source can keep. Each site it flags
# gets its own narrow `# type: ignore[unreachable]`, naming the code,
# rather than a blanket exemption that would silence the check
# everywhere the sites are legitimate
warn_unreachable = true
# the oldest interpreter this package supports, and also the oldest mypy
# can be aimed at. Keep the key: without it mypy targets whatever runs it,
# i.e. the 3.14 of .python-version, and a typing construct missing from the
# floor is then invisible. An annotation is not evaluated under "from
# __future__ import annotations", but a type *alias* is an ordinary
# assignment, so `HttpTransport` is a line no annotation rule covers and
# only a checker aimed at the floor reads correctly. Ruff needs no
# equivalent, inferring py310 from requires-python
python_version = "3.10"
exclude = [
    "build",
]

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# selecting a rule by name below rather than by code is itself a preview
# feature, and on its own `preview = true` would also turn on every rule
# ruff is still designing. explicit-preview-rules takes that back off: a
# preview rule then runs only where it is named exactly, and every entry
# of `select` below is a family, which no preview rule can be reached
# through -- so the gate stays the stable rule set it was, and what
# preview buys here is an `ignore` that reads by name instead of by a
# code its own comment has to translate
preview = true
explicit-preview-rules = true
# Every rule family ruff ships, present ones and a release's future ones
# alike, rather than a hand-picked list: a list is a thing that rots, since
# nothing forces a second edit here the day ruff ships a family nobody has
# looked at yet. `ALL` takes a new family in on the pull request that bumps
# ruff's own pinned rev instead, which is the day somebody is already
# looking at what changed. Section 5 of the organization standard states
# the rule, and `ignore` below is where every declined rule's reason
# lives -- a rule the formatter conflicts with, cited from ruff's own
# docs/formatter.md and not argued here since that list is the vendor's; a
# rule this tree declines on its own merits, argued beside it; or a finding
# that is real and is not in `ignore` at all, fixed at its site or answered
# with a `# noqa` that RUF100 retires the day it stops being needed
select = ["ALL"]
# a rule and not a family, and unreached by PL above: PLW1514 is a
# preview rule, so a family in `select` never reaches it -- a preview
# rule runs only where `extend-select` names it exactly. It asks that
# `open`, `read_text` and `write_text` name an encoding rather than take
# the locale's: UTF-8 wherever this suite is usually read, cp1252 on
# Windows, which os-windows.yml answers weekly and before a release and
# nothing else asks about in between. Zero findings when it was
# selected, which makes it a ratchet and not a cleanup; the
# decoded-subprocess-encoding pre-commit hook refuses the same defect
# one layer out, at a subprocess call rather than at open()
extend-select = ["unspecified-encoding"]
# named rather than coded, here and in per-file-ignores below: an entry
# that suppresses a single rule can say which, so the reason sits in the
# comment and the rule sits in the entry, with no code left to look up
# between them. Where the entry declines a whole family for a construct
# this tree does not contain, the family has no name of its own to give it
# and the bare prefix is the only spelling that says "every member"
ignore = [
    # ruff's own docs/formatter.md, under "Conflicting lint rules", read at
    # the ruff revision .pre-commit-config.yaml pins: each of these is
    # undone by the formatter's own rewriting, so selecting it is a lint
    # failure the next `ruff format` produces again. The list is the
    # vendor's and does not change with this tree.
    # `incorrect-blank-line-before-class` (D203) needs no entry: the pep257
    # convention below already disables it in favour of D211, the other
    # half of the pair ruff calls incompatible, and does so without the
    # warning ruff reserves for a pair nothing has settled.
    # `multi-line-implicit-string-concatenation` (ISC002) needs none
    # either, the vendor's own condition being "if used without ISC001",
    # and ISC001 stays selected here
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    # docstrings: every public module, class, method and function must
    # carry one -- D100/D104 and the D101/D102/D103 left out of this list
    # enforce exactly that. The docstring rules ignored here are the ones
    # pep257 does not ask for, for every dunder and every constructor
    # still to be written and not only the ones already in the tree:
    # __init__ is documented by its class, and a magic method by the data
    # model it implements. The convention above leaves both rules
    # enabled, so naming neither here would ask every such site for a
    # docstring of its own
    "undocumented-magic-method", # D105
    "undocumented-public-init",  # D107
    # code length is enforced by the formatter, which reflows to its 88
    # columns everything it is allowed to rewrite. What is left for E501 to
    # find is what no width the formatter controls can break: a url in the
    # module's own docstring, a `# type: ignore` or `# ruff: ignore` pragma
    # that pushes an otherwise-short line past the limit, and whatever a
    # future recorded exchange or raw transaction adds in the same shape.
    # The prose the formatter never touches is measured instead by
    # max-doc-length below
    "line-too-long", # E501
    # every site is a public entry point -- the client's constructor, its
    # `from_chain` alternative, `http_request` itself -- where each
    # parameter is independently optional and keyword-only, not a function
    # assembled from unrelated pieces that argument-clumping would fix.
    # `uv run ruff check --select PLR0913 --no-cache .` lists them, and the
    # same shape recurs in any entry point still to be added
    "too-many-arguments", # PLR0913
    # comparing against an HTTP status (200, 401, 503) or a JSON-RPC
    # version marker is not a magic value: it is the number the HTTP or
    # JSON-RPC specification assigns, not one this code chose and could
    # have named instead. `uv run ruff check --select PLR2004 --no-cache .`
    # lists the sites, all of that shape and spread across the module and
    # the tests that exercise it
    "magic-value-comparison", # PLR2004
    # the message is built where the exception is raised because that is
    # the only place holding what went wrong -- the status, the scheme,
    # the size refused -- and a shared exception class could not say that
    # without every raise site passing it back in anyway. `uv run ruff
    # check --select TRY003 --no-cache .` lists the sites, spread the same
    # way
    "raise-vanilla-args", # TRY003
    # flake8-errmsg asks the same message to be built in a named variable
    # before a raise names it, so the entry above already gives the reason
    # this tree keeps the opposite shape. `dot-format-in-exception` finds
    # nothing today, this module having no `.format()` call left to catch,
    # and the same argument declines it rather than leaving a hole one
    # could reopen unnoticed
    "raw-string-in-exception",
    "f-string-in-exception",
    "dot-format-in-exception",
    # flake8-unused-arguments cannot tell a parameter nobody reads from a
    # signature that is not this code's to choose. Both shapes are here:
    # `redirect_request` overrides `HTTPRedirectHandler`'s method and
    # matches urllib's seven positional parameters while using none of
    # them, and every recorded transport in `tests/` implements the
    # `transport(request, timeout)` contract `call` invokes, which is what
    # makes one substitutable for another. The member codes this tree does
    # not hit today read the same call sites through a classmethod, a
    # staticmethod or a lambda instead
    "unused-function-argument",
    "unused-method-argument",
    "unused-class-method-argument",
    "unused-static-method-argument",
    "unused-lambda-argument",
    # flake8-annotations' any-type alone, and it is the module's subject
    # rather than a gap in its annotations: an rpc result is whatever the
    # node's JSON gives back, `RpcError.data` is whatever the method put
    # there, and a caller narrows what it asked for. Faking a narrower
    # type here would be a cast nothing can check. The rest of the family
    # stays selected, mypy in strict mode already refusing an unannotated
    # definition
    "any-type",
    # flake8-boolean-trap: a caller reading `f(x, True)` cannot say what
    # the flag means without opening the signature. Every site is a test
    # double or the smoke script's own switch, where the call and the
    # definition are a screen apart and the argument is the case being
    # driven; the shipped module's own flags are keyword-only already,
    # which is the rule this one approximates
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "boolean-positional-value-in-call",
    # flake8-type-checking asks an import used only in an annotation to
    # move behind `if TYPE_CHECKING:` so it costs nothing at runtime.
    # Measured with the family selected: every finding it has today is in
    # `tests/` or `.github/scripts` (`pytest`, `argparse.Namespace`,
    # `collections.abc.Callable`, none of it read by anyone but this
    # tree), where the import guarded is a name pytest or the smoke script
    # already pays for elsewhere in the same process, and the guard would
    # buy nothing a reader could see without opening the module twice.
    # `src/bitcoin_core_rpc/` trips none of it: where the guard does buy
    # something -- `__init__.py`'s `client.py` and `transport.py` names,
    # kept out of `sys.modules` until `__getattr__` is asked for one of
    # them -- it is already written that way by hand, which is a choice
    # this rule has no way to tell from the ones above where the same
    # shape would cost a reader for nothing. `runtime-cast-value` is the
    # same trade at a `cast()`, and there is none in the tree to find
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    "runtime-cast-value",
    # flake8-self: a caller outside the module reaching into a private
    # attribute is what this rule is for, and it cannot tell that caller
    # from a test asserting an implementation detail on purpose -- the
    # bounded read's own offset and chunk size, which is where this
    # module's arithmetic lives and what `tests/transport_test.py` is
    # about
    "private-member-access",
    # zero-finding for a construct this tree does not contain, so
    # selecting it reads as an enforced invariant while enforcing nothing.
    # `git grep -E 'import logging|datetime|await |^#!|sys\.version'` over
    # the `.py` files answers with nothing, and the module imports nothing
    # outside the standard library at all, which is the rest of it: DTZ
    # without a naive datetime, G and LOG without logging, ASYNC without
    # await, NPY without NumPy, PD without pandas, EXE without a shebang
    # to check an executable bit against (the decision
    # .pre-commit-config.yaml already states for
    # check-shebang-scripts-are-executable), AIR without Airflow, DJ
    # without Django, FAST without FastAPI, INT without gettext, ICN
    # without an import this tree aliases at all, and YTT without a
    # `sys.version` comparison
    "DTZ",
    "G",
    "LOG",
    "ASYNC",
    "NPY",
    "PD",
    "EXE",
    "AIR",
    "DJ",
    "FAST",
    "INT",
    "ICN",
    "YTT",
    # flake8-todos disciplines the format of a marker FIX refuses
    # outright: the seven names below are the whole family, and each asks
    # a question about a TODO, FIXME, XXX or HACK comment that a tree FIX
    # holds clean cannot contain. The first also steers a refused FIXME
    # toward TODO, which FIX002 refuses just as hard, and TD is not even a
    # superset of FIX -- HACK draws no TD diagnostic at all
    "invalid-todo-tag",
    "missing-todo-author",
    "missing-todo-link",
    "missing-todo-colon",
    "missing-todo-description",
    "invalid-todo-capitalization",
    "missing-space-after-todo-colon",
]

[tool.ruff.lint.per-file-ignores]
# the smoke script's output is the whole of what it produces: it runs a
# bitcoind and prints, one line each, the claim every check confirmed, so
# the log of a green run is the list of what a live node was actually
# asked. T20 is selected for the module, which writes to no stream of its
# own; a script whose caller is a workflow step is the case it is not about
".github/scripts/rpc_smoke.py" = ["T201"]
# flake8-no-pep420: each is a standalone entry point a workflow step
# invokes with `python .github/scripts/<name>.py`, never an import -- the
# directory holds no __init__.py because it is not a package, and adding
# one to satisfy this rule would make it look like one
".github/scripts/*.py" = ["INP001"]
# sphinx imports this one by its own convention, reading docs/source/ as a
# configuration directory rather than as a package; same reason
"docs/source/conf.py" = ["INP001"]
# the D rules are not here: a public test function, fixture or method
# states what it verifies -- the property, the vector, the failure mode --
# under the same docstring gate as the module's public interface. D102/D103
# stop at that boundary, so a private or nested helper is held to the
# convention every private helper in the module already is: undocumented
# unless the name alone does not say what it does
"tests/**" = [
    "S101",   # assert
    "B017",   # assert-raises-exception
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-with-multiple-statements
    "PT018",  # pytest-composite-assertion
    "RUF043", # pytest-raises-ambiguous-pattern
]

[tool.ruff.lint.mccabe]
# ruff's default, and a function over it carries a `ruff: ignore` whose
# reason is the comment above the def -- ruff reads the code, the prose
# after it is for the reader. Not a global bound at the tree's worst, which
# keeps the worst from growing but lets any new function reach it
# unremarked. No exemption is permanent: RUF100 (unused-noqa, selected
# above) fails a suppression the moment a refactor brings its function
# under the line
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# 80 columns on the prose, where the code keeps the formatter's 88. Not a
# compromise between two numbers: ruff-format reflows code and never a
# comment or a docstring, so 88 is what it can enforce and this is the rest
# -- the half of a file that carries the reasoning, held to the width every
# markdown file here is already held to by MD013.
# W505 is in the "W" set selected above and is inert without this line,
# ruff having no default doc length; setting it is the whole of the switch.
# A comment that ends in a URL is exempt, which is the amnesty MD013 gives
# an unbreakable link
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
# the convention is also what settles the pairs ruff calls incompatible, so
# `ignore` above names neither half of one: beside a declared convention
# such an entry changes no diagnostic and silences no warning, and the
# warning ruff prints over such a pair appears only where nothing has
# settled it. Section 5 of btclib-org/.github (btclib-org/.github#178)
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT transcribed, as section 5 of btclib-org/.github asks of every
# tree: each line with its regex metacharacters escaped, the lines joined
# by \n, the whole anchored with ^. tests/copyright_test.py of that
# repository derives this string from COPYRIGHT and refuses one that is
# not it byte for byte, which is the check ruff cannot make -- CPY reads
# the regex and never the file.
# The pointer form and not the MIT permission notice in full, which the
# headers here carried until btclib-org/.github#119 decided otherwise for
# every repository of the organization, this one included: a header
# naming the license in full duplicates what LICENSE and AUTHORS.md
# already say, in every file that carries one, and a self-contained
# notice in one tree is a second spelling of the same fact everywhere
# else. One notice, the pointer form, is what the section settles on.
# Anchored with ^: unanchored, a search over the first 4096 bytes is not
# a check that the notice opens the file, so an import placed above it
# would still pass. No source file here opens with a shebang, so nothing
# legitimate sits between byte zero and the notice for the anchor to
# exclude
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

# what ruff's D rules do not reach: they ask that a docstring exists, and
# this asks that the parameters and the return it names are the ones the
# signature declares. Run as a hook over bitcoin_core_rpc only, and
# .pre-commit-config.yaml says why the scope stops there
[tool.pydoclint]
# napoleon renders it, which is what docs/source/conf.py enables, so the
# sections named here are ones sphinx already understands
style = "google"
# the types are in the signature, and mypy is strict: repeating them in
# the docstring is a second place to be wrong
arg-type-hints-in-docstring = false
check-return-types = false
# left at its default, and that is a deviation from btclib-secp256k1,
# which turns it off: there almost every docstring already carries an
# Args and a Returns list, so `false` holds a short one -- `wipe`,
# taking and returning nothing -- to the same question as a long one
# rather than skipping it for its length. Here every docstring of the
# module is prose that names each parameter in sentences -- `call` on
# `params`, `request_timeout` and `max_body_size`, `http_request` on
# `max_body_size` and `timeout` -- so turning it off asks for an Args
# section restating what the paragraph above it already says, in a file
# meant to be read as one. What stays checked is the case the sections
# exist for: a docstring that does list arguments and lists them wrong,
# which is what a signature change leaves behind
skip-checking-short-docstrings = true
# off, and for this module's own reason. It compares the Raises section
# with the `raise` statements of the body, and the client raises mostly
# through what it calls -- `http_request` for a transport that did not
# answer, `_reply_object` and `_rpc_error` for a reply that is an error
# -- so `HttpError` and `RpcError`, which is what a caller of `call`
# catches, appear in no `raise` of its body. Kept on, it would ask each
# docstring to document its body instead of its contract
skip-checking-raises = true
