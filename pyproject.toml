[build-system]
# 77 is the floor for the PEP 639 metadata below, and for both halves of
# it at once: the SPDX string form of `project.license` and
# `project.license-files` arrived in setuptools 77.0.0, which is the
# version the deprecation warning for the old table form names. An
# isolated build resolving anything older fails on the syntax rather than
# ignoring it, which is what the bound is for
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-core-rpc"
# the one place the version is declared: docs/source/conf.py parses this
# file rather than the installed metadata, which would need the package
# installed to build the documentation. There is no `__version__` in the
# module either, and that is the same decision the module's docstring
# states for a vendored copy -- the release tag is the version, and a
# number inside a file that gets copied is a second one that drifts
#
# calendar versioning, `YYYY.M.D`: what ages in a client of a node is which
# Core versions its recorded replies were recorded against, and a date says
# that where a compatibility number does not. There is no dependency here
# whose bump such a number would have to describe either, so what a release
# breaks is announced in RELEASE_NOTES.md rather than encoded in a digit
#
# no leading zero in the month: PEP 440 normalizes `2026.08` to `2026.8`,
# and release.yml compares the tag to this string literally, so a padded
# one would be a tag no release matches
#
# which string is which -- what this declares between releases, and what a
# release day adds to it -- is RELEASING.md's "Which version string is
# which", and release.yml's version-check job is what enforces it
version = "2026.9"
description = "A standalone JSON-RPC client against Bitcoin Core"
readme = "README.md"
# PEP 639: an SPDX expression, which becomes the `License-Expression`
# metadata field, and the files it is carried by. The TOML-table form
# setuptools deprecates wrote a free-text `License:` field instead, and
# there is no license classifier below for the same reason -- one
# machine-readable statement rather than three spellings of it.
#
# AUTHORS.md is named beside LICENSE rather than dropped: setuptools'
# default globs match both, so both are in `dist-info/licenses/` today, and
# the MIT notice this repository carries names "Ferdinando M. Ametrano and
# btclib contributors" -- AUTHORS.md being where that list is kept
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
# 3.10 rather than 3.9, and the usual reason -- a split lock file -- is not
# this project's, which resolves no runtime dependency at all. What decides
# it is the type checker: 3.10 is the oldest mypy can be aimed at ("Python
# 3.9 is not supported (must be 3.10 or higher)"), so a floor below it
# would be a floor nothing static ever checks, on a package whose whole
# surface is annotations a caller type checks against. 3.9 is also
# end-of-life since 2025-10
requires-python = ">=3.10"
# none, and that is the product rather than an omission: the module imports
# `json`, `base64`, `decimal`, `pathlib`, `secrets` and `urllib.request`,
# all of them standard library, which is what lets it be installed as a
# package or copied as one file. A dependency added here is a dependency a
# vendored copy silently does not have, so the empty list is a contract
dependencies = []
# the GitHub repository topics, in the same order, and the order is by
# relevance rather than alphabetical: PyPI shows keywords as the metadata
# gives them, and GitHub sorts its own, so there the order decides only
# which topic goes when the twenty it allows are full -- which nine is well
# short of. Lowercase throughout, a GitHub topic being lowercase or not a
# topic, so that one spelling serves both lists.
#
# What is not here: `python`, which names no feature and is what the
# `Programming Language ::` classifiers below already say; `type-hints`,
# which `Typing :: Typed` says the same way, machine-readably; and a chain
# name, `from_chain` carrying Core's defaults for all five and no keyword
# naming one of them being better than naming none
keywords = [
    "bitcoin-core",
    "bitcoind",
    "bitcoin",
    "bitcoin-rpc",
    "json-rpc",
    "rpc-client",
    "rpc",
    "zero-dependency",
    "vendorable",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    # true, and it takes `bitcoin_core_rpc/py.typed` to be true: PEP 561's
    # marker is a file *inside a package directory*, so this claim and the
    # single-directory layout below are one decision. See [tool.setuptools]
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://btclib.org"
Download = "https://github.com/btclib-org/bitcoin-core-rpc/releases"
Documentation = "https://bitcoin-core-rpc.readthedocs.io/"
GitHub = "https://github.com/btclib-org/bitcoin-core-rpc"
Issues = "https://github.com/btclib-org/bitcoin-core-rpc/issues"
"Pull Requests" = "https://github.com/btclib-org/bitcoin-core-rpc/pulls"

[dependency-groups]
# what it takes to develop, build and test this package. hypothesis is
# absent, unlike in a codec library where the malformed input nobody wrote
# down is the point: what this module refuses is a shape -- a mapping keyed
# by an int, a body that is not utf-8, a status -- and the shapes are
# enumerable, which is what the parametrized cases below `tests/` are
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
]
# a floor here and on nothing else in this group: the suppressions in this
# tree are written `ruff: ignore`, and 0.16 is the first release that reads
# them. An older ruff does not fail on the syntax -- it fails on the
# findings those comments suppress, which is the confusing way to learn it
lint = ["mypy", "pre-commit", "ruff>=0.16"]
# mutation testing, which asks the question coverage cannot: a line the
# suite executes is not a line the suite checks. Its own group and not part
# of test, because every cell of the matrix installs that one and none of
# them runs this -- the scheduled mutation workflow is the only consumer,
# and it asks for --group test as well, cosmic-ray shelling out to pytest
mutation = ["cosmic-ray"]
# the distribution files are built and published by uv itself: what this
# group holds is what inspects them, before an upload consumes the version.
# Named check, not build, so that --only-group build means the same thing
# in btclib-secp256k1, which genuinely needs a group for building wheels
check = ["check-manifest", "check-wheel-contents", "pyroma", "twine"]
docs = ["myst-parser", "sphinx", "sphinx_rtd_theme"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "check" },
    { include-group = "docs" },
    { include-group = "mutation" },
]

[tool.uv]
# the oldest uv allowed to touch uv.lock. Not the uv-lock hook's rev in
# .pre-commit-config.yaml -- that number moves on pre-commit.ci's own
# schedule and was never this one -- but a ceiling nobody here sets:
# whatever uv dependabot-core bundles for its uv-ecosystem updater
# (uv/Dockerfile's `FROM ghcr.io/astral-sh/uv:...`, upstream in
# dependabot/dependabot-core). That updater runs `uv lock` with exactly
# the uv it ships and refuses rather than upgrading itself when this key
# asks for more, so a floor past its pin silently stops every lock
# update Dependabot attempts, security ones included, and only a human
# bumping that Dockerfile moves the ceiling back out -- btclib's issue
# #485 is this same failure caught there first. Declared here the floor
# still holds for every uv command, not Dependabot's alone, so an older
# uv on a developer's machine says so instead of rewriting the lock in a
# format the runners then fail to read -- uv is pre-1.0 and changes that
# format. It also reaches CI without a second pin: setup-uv, given no
# version input, reads this key -- and since a bare minimum specifier
# makes setup-uv install the latest uv regardless, lowering the floor
# does not lower what the runners run: they are never behind it, and
# there is nothing here to go stale
required-version = ">=0.11.31"

[tool.setuptools]
# a package directory holding one file, which is a shape chosen for exactly
# one reason: `py.typed`. This distribution is annotated throughout and
# type checked in strict mode, and PEP 561 gives it no way to say so as a
# top-level module -- the marker has to sit inside a package directory, and
# a module has none. Measured against a built wheel of each layout, with a
# consumer running `mypy --strict` and no configuration of its own:
#
#   bitcoin_core_rpc.py                     every name is `Any`, plus
#                                           "missing library stubs or
#                                           py.typed marker"
#   bitcoin_core_rpc.py + py.typed beside   the same; mypy looks for the
#                                           marker under `<module>/`
#   bitcoin_core_rpc.pyi beside it          the same
#   bitcoin_core_rpc/ + py.typed            checks, and catches a wrong
#                                           argument type
#
# So the alternatives are a `bitcoin_core_rpc-stubs` distribution, which is
# a hand-written second copy of the whole interface and drifts the first
# time either moves, or leaving every typed consumer to configure
# `follow_untyped_imports` for this one module -- which btclib measured at
# 21 lines of override, and which the consumers who do not notice pay in
# silence rather than in errors.
#
# What it costs is the file name: `__init__.py` in this tree, where the
# vendoring instruction is now "copy it out *and rename it*". That is one
# sentence in the module docstring, and `tests/standalone_test.py` already
# copies to `bitcoin_core_rpc.py` rather than to the source's own name, so
# the property that file exists to check is unchanged
packages = ["bitcoin_core_rpc"]

[tool.setuptools.package-data]
# `py.typed` is not a `.py`, so nothing ships it without being told
bitcoin_core_rpc = ["py.typed"]

[tool.check-wheel-contents]
# what the packages block and package-data entry above are for: a wheel
# that ships the tree those two describe, and nothing that check-wheel-
# contents' own defaults would flag anyway (an unrelated top-level file,
# an empty library) needs no configuration to catch. What defaults do
# not catch is a file the tree has and the wheel does not -- `py.typed`
# dropped by a package-data typo, say -- because with no `package` given
# check-wheel-contents reads the wheel's own RECORD and asks nothing
# about the source tree the wheel was supposed to carry. `--package
# bitcoin_core_rpc` is what asks that question: it diffs the wheel's
# `bitcoin_core_rpc/` against this checkout's, file for file, in both
# directions (W101 missing, W102 extra). Measured against a wheel built
# with `py.typed` stripped out and `RECORD` edited to match -- a build
# that installs and imports cleanly -- unconfigured check-wheel-contents
# reports it clean and this configuration reports "W101: Wheel library
# is missing files in package tree: bitcoin_core_rpc/py.typed".
#
# That is the whole of what this repository needs: `check-manifest`
# above already gates the sdist against this same tree (a pre-commit
# hook, gated by the lint workflow), so together the two amount to
# `git tree == sdist == wheel`, verified in one hop each rather than
# through a third script comparing the sdist to the wheel, which is a
# comparison a single-module, dependency-free package with no data
# directory has nothing to add to. See
# btclib-org/btclib#1160 for that comparison across this organization's
# three publishing repositories.
package = ["bitcoin_core_rpc"]

[tool.check-manifest]
# what a distribution has no business holding: a link checker's exclusions
# and an editor's workspace, neither of which is the subject of an sdist.
# `.github` is ignored by check-manifest already; these are the tracked files
# that would otherwise be reported as missing from it
ignore = [
    ".lycheeignore",
    ".vscode/*",
    # Claude Code's own workspace config, same argument as .vscode/* above.
    # A tree rather than a flat directory -- the settings sit beside a
    # commands/ directory -- so the pattern is one level deeper than
    # .vscode/*'s
    ".claude/**",
]

[tool.pytest.ini_options]
# where the tests are, so a bare "pytest" from the root collects them and
# nothing else, whatever else the tree grows
testpaths = ["tests"]
# -ra summarizes everything that was not a plain pass. Across a matrix of
# interpreters and platforms a skip, an xfail or a warning is otherwise
# invisible: it is not a failure, so nobody opens the log to find it.
# --strict-config makes a typo in this very table an error rather than a
# warning that scrolls past a hundred lines of dots, and --strict-markers
# does the same for a marker nobody registered, which is how a misspelled
# skipif silently stops skipping.
#
# --cov is here so that the fail_under ratchet below is what a bare
# `uv run pytest` measures, rather than something only the `coverage` job
# in test.yml reaches: a gate met after a change is pushed is met too
# late. Moving it cost nothing measurable -- the suite takes the same
# time either way from 3.12 on, coverage.py using sys.monitoring there.
#
# Its position is load-bearing: --cov takes an *optional* value, so as
# the last token here it would be handed whatever the command line goes
# on to say -- `pytest tests/transport_test.py` becomes
# `--cov=tests/transport_test.py`, the whole suite runs regardless, and
# it reports against fail_under having measured a directory `omit`
# excludes. Anywhere but last is safe, so it sits right after -ra rather
# than at a place this comment would have to move again.
#
# Naming no source here -- source lives in [tool.coverage.run] -- so
# there is one list of what is measured, not a second copy only a
# maintainer can run, this table not being what test.yml's coverage job
# types.
#
# Moving --cov into addopts means `uv run pytest tests/transport_test.py`
# would otherwise fail on the tree's coverage rather than its own:
# tests/conftest.py's pytest_configure hook is what keeps a selective run
# reported and not gated.
#
# pytest-randomly is in the test group and needs no flag here: installed,
# it shuffles the order and prints the seed, and `-p no:randomly` puts the
# file order back when a failure has to be reproduced against it. What it
# guards is the one thing a green suite cannot tell you about itself --
# whether a test passes because of what ran before it. Not hypothetical on
# this module: `DEFAULT_DATADIR` is computed at import and several tests
# patch `Path.home`, so a test reading the constant after another has moved
# the home is exactly the ordering a fixed order would hide
#
# no `-n auto`, and its absence is measured rather than an omission: on this
# suite a worker pool costs more than it saves, because the suite opens no
# socket and the whole of it finishes before ten workers have started. Nine
# interleaved runs each, medians, all of them green:
#
#     serial 0.50s against 0.90s parallel, and under coverage 0.65s
#     against 1.23s -- 1.8x and 1.9x the wrong way
#
# and in CI the same, ubuntu 0.68s against 0.85s with the coverage job 0.90s
# against 1.30s. Windows looked like a win at one run per configuration
# across a spread wider than the difference, which is not a claim. The
# command that re-derives it is `pytest --durations=0`, and the criterion
# this family applies is in checksig's docs/test-parallelism.md: the pool
# pays where the suite is long enough to amortise starting it, which there
# means node-starting tests at a second each and here means nothing.
# pytest-xdist stays in the test group: the mutation session passes `-n0`,
# and without the plugin pytest rejects the flag rather than ignoring it
addopts = "-ra --cov --durations=8 --strict-config --strict-markers"
# a test that was expected to fail and passed is a fixed bug still marked
# as broken: strict turns it red instead of reporting xpass
xfail_strict = true
# a deprecation warning is the early form of a break, emitted years before
# the removal that will fail the suite: on a 3.10 to 3.14 spread, plus
# pypy, there is time to act on it only if it is not silent. It is not
# theoretical for a module built on `urllib.request`, whose opener and
# handler api this one reaches into.
# The list carries no ignore, and no test silences a warning wholesale
filterwarnings = ["error"]

[tool.codespell]
# .secrets.baseline and uv.lock are hashes, and the recorded reply bodies
# under tests/_data are what a node sends, byte for byte: a spell checker
# correcting a word inside Core's own error message would void the pin that
# tests/_data/README.md states. By extension rather than by directory, so
# that tests/_data/README.md -- which records where each of those files
# came from -- is still spell checked, being prose about the data and not
# the data
skip = "*/_data/*.json,.secrets.baseline,uv.lock"
# a misspelling written on purpose goes in backticks, and that is a
# convention of this repository rather than a preference: prose that
# documents a spell checker has to name what it catches. codespell has no
# per-file configuration, so it holds everywhere it reads; what the rule
# hides from it is what is written inside backticks, i.e. identifiers,
# which are typos' half of the work and not this hook's -- the two hook
# names say as much
ignore-regex = '`[^`]*`'

# the second spell checker, and the pair is deliberate: the two are blind
# in different places, so neither subsumes the other. codespell matches
# whole words against a curated list of misspellings, and its word regex
# keeps the hyphen inside the token: `hex-strin` is one word, in no
# dictionary, and therefore silent, while typos splits hyphens, snake_case
# and camelCase itself. One thing typos does not read is this file:
# pyproject.toml is skipped even under --isolated, its own configuration
# not being something a spell checker can sensibly check. Everything below
# is therefore codespell's to keep honest
[tool.typos.files]
# the same files [tool.codespell] skips above, for the reasons given there,
# and the list has to be written again rather than shared because the glob
# syntax differs: "*/_data/*.json" matches at any depth for codespell and
# one directory deep for typos
extend-exclude = [
    "**/_data/*.json",
    ".secrets.baseline",
    "uv.lock",
]

[tool.typos.default]
# hashes, transaction hex and base64 credentials written inline in the test
# sources, which splitting into words turns into a spell checker's worst
# input. The hook runs with --write-changes, so with the rule off it
# rewrites the sources it reads. Ignored by shape rather than by file,
# because those literals sit next to prose that has to stay checked: an
# unbroken run of 26 characters or more is a literal and not a word, 26
# being the length of the shortest possible base58 address; the trailing =
# covers base64 padding, and no English word comes close
extend-ignore-re = ['[0-9A-Za-z+/]{26,}={0,2}']

[tool.typos.type.verbatim]
# the backtick convention of [tool.codespell] above, honoured on the files
# that quote a spelling on purpose rather than on all of them: outside
# these a backticked word is an identifier, and identifiers are what this
# hook is here for
extend-glob = ["CHANGELOG.md", "RELEASE_NOTES.md", ".pre-commit-config.yaml"]
extend-ignore-re = ['`[^`]*`']

[tool.coverage.run]
# named rather than left to --cov alone: unnamed, --cov measures every
# file the run imports, which reaches a script imported by path -- the
# failure mode is a local checkout gated stricter than the CI it exists
# to reproduce, because a script's main() runs only in a subprocess
# nothing here starts in-process. bitcoin_core_rpc is the package this
# distribution ships; tests is included too, because a test nothing runs
# is dead code with the authority of a test.
source = ["bitcoin_core_rpc", "tests"]
omit = ["*/site-packages/*"]
# statement coverage calls a half-tested `if` fully covered: the line ran,
# one of its two ways out never did. What that hides here is this module's
# own shape -- it is a thin client whose bodies are guard clauses, an
# early return for the credential already supplied, for the cookie file
# already read, for the response that is not an error -- so the branch
# nothing takes is exactly the refusal nobody exercised
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# a local threshold rather than a coveralls.io upload: no secret, no third
# party service, and enforced on every run instead of only on pull requests
# targeting main.
# 100 is not the same rule with the bar raised: coverage special-cases it,
# so `round(total, precision) < fail_under` does not apply and nothing
# short of an exact 100.00% passes -- 99.999% is a red build, where 99.99
# passed everything above 99.985%. The statements it allows to go uncovered
# are therefore zero, and that is the whole of why.
# The price is that a line no ordinary run reaches no longer disappears
# into a rounding step. It is covered by patching what stands in the way --
# which is what the transport tests already do to `_OPENER` -- or it
# carries a `pragma: no cover` with the reason beside it. Neither of those
# is a build left red.
# Measured on one interpreter, 3.14, and on one operating system, and that
# is enough at 100: there is no sys.version_info branch in this tree, and
# the one sys.platform branch -- the datadir table in `default_datadir` --
# is driven by patching `sys.platform`, so a run on any of them walks all
# three of its rows
fail_under = 100.0

[tool.mypy]
strict = true
show_column_numbers = true
show_error_codes = true
# the optional error codes strict does not turn on, surveyed one by one
# over the module and the tests: each of them finds nothing today, so each
# is a ratchet and none is a cleanup. Two carry their own weight beyond
# that -- ignore-without-code makes every "type: ignore" name the rule it
# silences, so a blanket one cannot creep in, and deprecated reports a
# stdlib API on its way out, which on a 3.10 to 3.14 spread is the same
# early warning filterwarnings = ["error"] buys at runtime
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
]
# the three siblings set it too, and unlike the list above it is not a
# ratchet with nothing to catch: the survey that added it here found a
# runtime isinstance guard on a value whose static type already promised
# more than an untrusted source can keep. Each site it flags gets its own
# narrow `# type: ignore[unreachable]`, naming the code, rather than a
# blanket exemption that would silence the check everywhere the sites are
# legitimate
warn_unreachable = true
# the oldest interpreter this package supports, and also the oldest mypy
# can be aimed at. Keep the key: without it mypy targets whatever runs it,
# i.e. the 3.14 of .python-version, and a typing construct missing from the
# floor is then invisible. An annotation is not evaluated under "from
# __future__ import annotations", but a type *alias* is an ordinary
# assignment, so `HttpTransport` is a line no annotation rule covers and
# only a checker aimed at the floor reads correctly. Ruff needs no
# equivalent, inferring py310 from requires-python
python_version = "3.10"
exclude = [
    "build",
]

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# selecting a rule by name below rather than by code is itself a preview
# feature, and on its own `preview = true` would also turn on every rule
# ruff is still designing. explicit-preview-rules takes that back off: a
# preview rule then runs only where it is named exactly, and every entry
# of `select` below is a family, which no preview rule can be reached
# through -- so the gate stays the stable rule set it was, and what
# preview buys here is an `ignore` that reads by name instead of by a
# code its own comment has to translate
preview = true
explicit-preview-rules = true
# the same selection btclib-org holds its Python to. What the survey behind
# it rejected, with the reason rather than a count: N (uppercase math
# symbols are a convention elsewhere in the org), COM (COM812, which ruff's
# own documentation recommends against alongside the formatter), EM, FBT,
# EXE (all EXE001, the shebang-not-executable finding that
# .pre-commit-config.yaml records the same decision about), TC, PTH, ARG,
# ANN, SLF (tests reaching into private members on purpose), PERF
select = [
    "A",   # flake8-builtins: a name that shadows a builtin
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C90", # mccabe, at ruff's default with suppressed exceptions
    # flake8-copyright, replacing the copyright-notice pre-commit hook:
    # a rule living inside ruff's own file-selection logic checks
    # whatever files it is given the same way regardless of who is
    # asking, unlike the retired hook, which checked only staged files
    # unless given --enforce-all
    "CPY",
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "ERA",  # eradicate: code that was commented out instead of deleted
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print: a library writes to no stream of its own
    "TID",  # flake8-tidy-imports: absolute, so the layering is readable
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # docstrings: every public module, class, method and function must
    # carry one -- D100/D104 and the D101/D102/D103 left out of this list
    # enforce exactly that. The two still ignored are the ones pep257 does
    # not ask for, for every dunder and every constructor still to be
    # written and not only the ones already in the tree: __init__ is
    # documented by its class, and a magic method by the data model it
    # implements
    "undocumented-magic-method", # D105
    "undocumented-public-init",  # D107
    # pydocstyle's own alternatives, and neither is a finite exception:
    # selecting D211 or D212 instead trades one violation for the other on
    # every class and every multi-line summary the tree has or will have
    "incorrect-blank-line-before-class", # D203, conflicts with D211
    "multi-line-summary-second-line",    # D213, conflicts with D212
    # code length is enforced by the formatter, which reflows to its 88
    # columns everything it is allowed to rewrite. What is left for E501 to
    # find is what no width the formatter controls can break: a url in the
    # module's own docstring, a `# type: ignore` or `# ruff: ignore` pragma
    # that pushes an otherwise-short line past the limit, and whatever a
    # future recorded exchange or raw transaction adds in the same shape.
    # The prose the formatter never touches is measured instead by
    # max-doc-length below
    "line-too-long", # E501
    # every site is a public entry point -- the client's constructor, its
    # `from_chain` alternative, `http_request` itself -- where each
    # parameter is independently optional and keyword-only, not a function
    # assembled from unrelated pieces that argument-clumping would fix.
    # `uv run ruff check --select PLR0913 --no-cache .` lists them, and the
    # same shape recurs in any entry point still to be added
    "too-many-arguments", # PLR0913
    # comparing against an HTTP status (200, 401, 503) or a JSON-RPC
    # version marker is not a magic value: it is the number the HTTP or
    # JSON-RPC specification assigns, not one this code chose and could
    # have named instead. `uv run ruff check --select PLR2004 --no-cache .`
    # lists the sites, all of that shape and spread across the module and
    # the tests that exercise it
    "magic-value-comparison", # PLR2004
    # the message is built where the exception is raised because that is
    # the only place holding what went wrong -- the status, the scheme,
    # the size refused -- and a shared exception class could not say that
    # without every raise site passing it back in anyway. `uv run ruff
    # check --select TRY003 --no-cache .` lists the sites, spread the same
    # way
    "raise-vanilla-args", # TRY003
]

[tool.ruff.lint.per-file-ignores]
# the smoke script's output is the whole of what it produces: it runs a
# bitcoind and prints, one line each, the claim every check confirmed, so
# the log of a green run is the list of what a live node was actually
# asked. T20 is selected for the module, which writes to no stream of its
# own; a script whose caller is a workflow step is the case it is not about
".github/scripts/rpc_smoke.py" = ["T201"]
# the D rules are not here: a public test function, fixture or method
# states what it verifies -- the property, the vector, the failure mode --
# under the same docstring gate as the module's public interface. D102/D103
# stop at that boundary, so a private or nested helper is held to the
# convention every private helper in the module already is: undocumented
# unless the name alone does not say what it does
"tests/**" = [
    "S101",   # assert
    "B017",   # assert-raises-exception
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-with-multiple-statements
    "PT018",  # pytest-composite-assertion
    "RUF043", # pytest-raises-ambiguous-pattern
]

[tool.ruff.lint.mccabe]
# ruff's default, and a function over it carries a `ruff: ignore` whose
# reason is the comment above the def -- ruff reads the code, the prose
# after it is for the reader. Not a global bound at the tree's worst, which
# keeps the worst from growing but lets any new function reach it
# unremarked. No exemption is permanent: RUF100 (unused-noqa, selected
# above) fails a suppression the moment a refactor brings its function
# under the line
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# 80 columns on the prose, where the code keeps the formatter's 88. Not a
# compromise between two numbers: ruff-format reflows code and never a
# comment or a docstring, so 88 is what it can enforce and this is the rest
# -- the half of a file that carries the reasoning, held to the width every
# markdown file here is already held to by MD013.
# W505 is in the "W" set selected above and is inert without this line,
# ruff having no default doc length; setting it is the whole of the switch.
# A comment that ends in a URL is exempt, which is the amnesty MD013 gives
# an unbreakable link
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT holds the MIT permission notice in full rather than a pointer
# to LICENSE, and that is bitcoin_core_rpc.py's doing: the module is meant
# to be copied out of the distribution, and a copy has no LICENSE beside
# it, so a pointer would name a file its reader does not have. Every
# source file carries the same notice rather than the module alone,
# because the alternative is an exclude here and a second notice to keep
# in step with this one -- one file, one rule, and the module's header is
# then not a special case that an edit can quietly diverge from.
# No year in it, MIT asking for none: a copy nobody has touched would
# otherwise look out of date every January, and bringing one up to date is
# a diff against the tag it was taken from rather than a year to bump.
# LICENSE carries the range, being the file a distribution ships and
# nobody vendors.
# No "SPDX-License-Identifier: MIT" line above it, and not by oversight:
# nothing reads one. The identifier a distribution is read by is
# pyproject.toml's `license`, which PEP 639 puts in the metadata, GitHub
# answers the same question from LICENSE, and no rule here scans a
# source file for the tag. What would read one is a license scanner in
# the tree a vendored copy lands in, and what it finds there is the
# notice itself.
# notice-rgx is that same text, escaped line by line rather than
# searched as raw bytes: CPY001 checks the first 4096 bytes of a file
# against the pattern, which for a notice this size is the same
# question the retired hook's substring search asked, and a reworded or
# trimmed copy would not match either way.
# Anchored with ^: unanchored, a search over those 4096 bytes is not a
# check that the notice opens the file, so an import placed above it
# would still pass. No source file here opens with a shebang, so
# nothing legitimate sits between byte zero and the notice for the
# anchor to exclude
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n#\\n# Permission is hereby granted, free of charge, to any person obtaining a copy\\n# of this software and associated documentation files \\(the \"Software\"\\), to deal\\n# in the Software without restriction, including without limitation the rights\\n# to use, copy, modify, merge, publish, distribute, sublicense, and/or sell\\n# copies of the Software, and to permit persons to whom the Software is\\n# furnished to do so, subject to the following conditions:\\n#\\n# The above copyright notice and this permission notice shall be included in all\\n# copies or substantial portions of the Software\\.\\n#\\n# THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\\n# IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\\n# FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT\\. IN NO EVENT SHALL THE\\n# AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\\n# LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\\n# OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\\n# SOFTWARE\\."

# what ruff's D rules do not reach: they ask that a docstring exists, and
# this asks that the parameters and the return it names are the ones the
# signature declares. Run as a hook over bitcoin_core_rpc only, and
# .pre-commit-config.yaml says why the scope stops there
[tool.pydoclint]
# napoleon renders it, which is what docs/source/conf.py enables, so the
# sections named here are ones sphinx already understands
style = "google"
# the types are in the signature, and mypy is strict: repeating them in
# the docstring is a second place to be wrong
arg-type-hints-in-docstring = false
check-return-types = false
# left at its default, and that is a deviation from btclib-secp256k1,
# which turns it off. There a docstring is a summary line and the option
# is what stops one from passing unread; here every docstring of the
# module is prose that names each parameter in sentences -- `call` on
# `params`, `request_timeout` and `max_body_size`, `http_request` on
# `max_body_size` and `timeout` -- so turning it off asks for an Args
# section restating what the paragraph above it already says, in a file
# meant to be read as one. What stays checked is the case the sections
# exist for: a docstring that does list arguments and lists them wrong,
# which is what a signature change leaves behind
skip-checking-short-docstrings = true
# off, and for this module's own reason. It compares the Raises section
# with the `raise` statements of the body, and the client raises mostly
# through what it calls -- `http_request` for a transport that did not
# answer, `_reply_object` and `_rpc_error` for a reply that is an error
# -- so `HttpError` and `RpcError`, which is what a caller of `call`
# catches, appear in no `raise` of its body. Kept on, it would ask each
# docstring to document its body instead of its contract
skip-checking-raises = true
