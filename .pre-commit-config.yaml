---
# Skip execution of one or more hooks using the SKIP environment variable:
# $ SKIP=mypy git commit -m "foo"
# $ SKIP=mypy,ruff-check pre-commit run --all-files
#
# If want to disable all hooks while committing, use the --no-verify/-n option:
# $ git commit -n -m "foo"

# these hooks are the lint gate: the lint workflow runs this very file, so
# what CI enforces is exactly what a commit enforces, with no second list
# of tools and versions to keep in step. What pre-commit.ci provides on
# top of that, and what it is kept for, is the periodic pull request
# bumping the revisions pinned below
ci:
  # a bot committing to a branch is at odds with the rest of this setup,
  # where no workflow token can write and every action is pinned to a
  # commit SHA: a failing hook is fixed by its author
  autofix_prs: false
  # no autoupdate_branch, as dependabot declares no target-branch: the
  # default is the default branch, which is the only branch a change
  # lands on
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly
  # the hooks pre-commit.ci cannot run: they shell out to uv, which is not
  # installed there, and the lint workflow covers them
  skip: [mypy]

repos:
  # this file checking itself, and the only two hooks here with no
  # environment to install. A `files` or `exclude` pattern that stops
  # matching anything is a hook that has quietly stopped running: the rule
  # is still written down and no longer enforced, which is the one defect
  # a green run cannot report on itself
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # this file checking itself further, on the two moves `autoupdate` makes
  # that it must not take. A rev naming only a major version follows every
  # future release of that major, which is the one thing a rev is here to
  # prevent -- and a prerelease is not a release.
  #
  # Not hypothetical, and not once: pre-commit.ci's weekly pull request has
  # offered both twice, typos onto `v1` -- its repository keeps a floating
  # major tag beside the versioned one, and autoupdate prefers the shorter
  # name -- and pyroma onto 5.1b1, 5.1 having no released tag at all. Both
  # were caught by hand, once before merging and once after; this hook is
  # what stops the third time from depending on somebody reading a two-line
  # diff carefully. The bot's pull request goes red instead, which is what a
  # rule enforced has over a rule written down.
  #
  # pre-commit says the first half itself -- "appears to be a mutable
  # reference (moving tag / branch) ... not supported" -- on stderr, as a
  # warning, on a run that then exits zero: which is the whole difference
  # this hook makes, and the reason it is worth its lines.
  #
  # A commit SHA stays acceptable, should a hook ever want one: the pattern
  # requires the prerelease marker and its digits to end the value, which
  # forty hex characters do not. Verified against every rev in this file,
  # none of which it matches, and against `v1` and 5.1b1, both of which it
  # names by line
  - repo: local
    hooks:
      - id: pinned-rev
        name: every pre-commit rev names a released version
        language: pygrep
        entry: '^ *rev: "?v?([0-9]+|[0-9][0-9.]*(a|b|rc|dev)[0-9]+)"?$'
        files: ^\.pre-commit-config\.yaml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # no derogation for markdown's two-space line break: nothing here
        # spells one. README.md's badge block groups its rows with blank
        # lines, which is what btclib and btclib-secp256k1 do and what
        # keeps the block's own comment true of what renders, so a
        # trailing space anywhere in this tree is an accident
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # not the default --fix=auto, which normalizes a file to its own
        # most frequent ending: a file entirely in CRLF is consistent by
        # that measure, so it stays, and the LF lines added to it are
        # converted the wrong way. This repository is LF throughout
        args: [--fix=lf]
      - id: check-case-conflict
      # no check-executables-have-shebangs, by check-hooks-apply's own
      # verdict: it selects on types [executable], nothing tracked here
      # carries that bit, and a hook that matches no file is not a guard
      # on the future but a line that reads as a rule while enforcing
      # nothing. That is the whole reason the meta hooks are in this
      # file, and overruling one of them would be an odd way to keep them
      #
      # its converse is on, and is the reason no source file here opens
      # with "#!/usr/bin/env python3": a shebang is read by the kernel only
      # when the file is exec'd directly, which needs the executable bit
      # the hook above finds on nothing, and the one script in the tree is
      # invoked as "python .github/scripts/rpc_smoke.py". So the line
      # announced an interpreter nothing consulted, and it cost this guard.
      # Unlike the hook above, this one selects on types [text] and so
      # matches every file whether or not any carries a shebang: what it
      # enforces is the pair, and the day a file needs one it also needs
      # chmod +x
      - id: check-shebang-scripts-are-executable
      # no byte order mark anywhere today, and the same kind of guard as
      # check-executables-have-shebangs: what it costs is one line, what
      # it buys is that an editor on another platform cannot quietly add
      # three bytes in front of a Python file
      - id: fix-byte-order-marker
      # this one *adds* "# -*- coding: utf-8 -*-" to every Python file.
      # UTF-8 has been the default source encoding since Python 3 and the
      # floor here is 3.10, so it is a dead line per file
      # - id: fix-encoding-pragma
      - id: check-yaml
      - id: check-json
        # `.vscode` is jsonc and not json: VSCode reads a comment in its own
        # settings.json and extensions.json, and what those two files carry
        # besides the settings is the reason for each of them. A json parser
        # rejects the file at the first one, so the exclude is what keeps the
        # reasons in the file they explain. It is not a gap: prettier below
        # is given that directory and fails on what it cannot parse, which
        # is the question this hook asks
        exclude: ^\.vscode/
      # hand-written json, which is `.claude/` here -- `git ls-files
      # '*.json'` is the measure, and the hook's own defaults, two-space
      # indent and sorted keys, are how that file is already written.
      # --autofix because every other fixing hook here corrects rather
      # than reports.
      # Two directories excluded, for two different reasons.
      # .vscode, for the reason check-json above is given the same
      # exclude: those files are jsonc, this hook parses json, and
      # prettier below is what formats them instead -- at its own indent,
      # which is not this hook's and does not have to be, no other tool
      # reading them.
      # tests/_data, because those bodies are what bitcoind writes --
      # `JSONRPCReplyObj` builds them compact and `WriteReply` appends the
      # newline, which is why they are one line each -- and a reformat
      # would void the claim tests/_data/README.md makes about them,
      # silently, this hook correcting rather than reporting. Excluded by
      # directory rather than by name so that the next reply recorded
      # there is safe before anyone remembers this line; check-json above
      # still asks the question worth asking of them, which is whether
      # they parse
      - id: pretty-format-json
        name: pretty-format-json (in place fixes)
        args: [--autofix]
        exclude: ^(\.vscode/|tests/_data/)
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: debug-statements
      - id: check-docstring-first
        # every module-level constant of the client carries a PEP 258
        # attribute docstring -- the string literal *after* the assignment,
        # which is what sphinx reads and what puts the nine names that had
        # only a `#` comment on the built api page. This hook counts any
        # such literal as a second module docstring, having been written
        # for the mistake of a docstring placed below the imports; the
        # client source is the one file where the two are indistinguishable
        # to it, and `test_every_public_name_carries_a_docstring` is what
        # checks the arrangement it can no longer see
        exclude: ^src/bitcoin_core_rpc/__init__\.py$
      # the hook's default, *_test.py, with neither args nor exclude.
      # What it is for is the one failure mode a test suite cannot report
      # on itself -- a file named so that pytest never collects it is not
      # a red test, it is no test, and the count in the report is the only
      # thing that moves.
      # test_*.py, i.e. --pytest-test-first, would guard the same thing,
      # pytest's default `python_files` collecting both; *_test.py is the
      # convention the test modules here follow, and needs no args. No
      # exclude, and the hook's own exemptions, conftest.py and
      # __init__.py, are what keep it that way: the shared transport lives
      # in tests/__init__.py, and naming that module something_test.py
      # would be this hook's failure mode written by hand -- a name that
      # says "test" to every reader, on the one module with none
      - id: name-tests-test
      - id: check-toml
      # only files being *added* are measured, the hook intersecting its
      # arguments with git's added set. The default 500 KB is left alone:
      # it is the threshold at which a blob deserves a sentence in
      # tests/_data/README.md saying where it came from
      - id: check-added-large-files
      # there are none, and a submodule is the one dependency that would
      # not be in uv.lock, not be pinned by dependabot, and not be
      # visible in an sdist
      - id: forbid-submodules
  # the credentials of other systems, which is the half of secret scanning
  # GitHub's free plan does not cover: partner and provider tokens are
  # scanned server-side, the generic patterns (PEM keys, connection
  # strings, authentication headers) belong to Secret Protection, and the
  # API accepts that setting with a 200 and leaves it disabled.
  # detect-private-key above covers the PEM case, and the lint workflow
  # runs these hooks on every pull request, a fork's included, so this is
  # not only a local gate.
  # It earns its place twice over on a tree whose subject is rpc
  # credentials: a cookie line, a `Basic` header and a `password=` argument
  # are what the tests are full of, and every one of them is a shape the
  # scanner is right to stop on.
  # Not gitleaks: all of its hook ids invoke it with --staged, so under
  # "pre-commit run --all-files", which is what CI runs, it scans an
  # empty staged set and passes
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials of other systems)
        # the findings are recorded in .secrets.baseline as already
        # reviewed rather than excluded from the scan: an exclusion makes a
        # file blind for good, and the difference is not theoretical -- a
        # real credential added to a file that is excluded is not seen
        # while it is excluded, and is seen now.
        # CONTRIBUTING.md has the command that regenerates the baseline
        args: [--baseline, .secrets.baseline]
  # a typo in a comment is cosmetic; the same typo in the README is the
  # shop window, that file being the PyPI long description, and in an
  # exception message it is an interface -- the tests pin several of these
  # messages verbatim, so nothing could correct one without noticing the
  # test too.
  # Configured in pyproject.toml ([tool.codespell]) rather than in args
  # here: the skip list needs a paragraph of justification, and a hook
  # invocation is the wrong place for one
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (prose and comments, in place fixes)
        # the "clear" dictionary alone, where codespell's default is
        # "clear,rare": the other four builtins make a hook whose findings
        # are mostly wrong, and such a hook gets an ignore list long enough
        # to hide a real typo. "rare" reports "lets" (as in "lets the
        # release workflow gate publication") and "falsy"; "usage" is not a
        # spell checker at all, flagging "master"
        args: [--builtin, clear, --write-changes]
  # the second spell checker, and not a replacement for the one above:
  # codespell matches whole words and keeps the hyphen inside the token, so
  # `hex-strin` is invisible to it with every builtin dictionary enabled,
  # while typos splits hyphens, snake_case and camelCase. pyproject.toml
  # ([tool.typos]) has the whole of the reasoning and the configuration, as
  # for codespell
  # crate-ci/typos re-tags a moving `v1` alias onto the same commit
  # as each release, and `git describe --tags` breaks the tie between
  # two tags on one commit by creation date, which names the alias.
  # `autoupdate` proposes that alias on every run and `pinned-rev` above
  # refuses it on every run, so the pin stays stuck rather than moving.
  # `autoupdate` walks every `repo:` entry except `local` and `meta`, so
  # a local hook is the one shape it cannot reach; `additional_dependencies`
  # below carries the version pin in its place, and `language`, `entry`,
  # `args` and `types` are upstream's own typos hook definition, copied
  # in rather than fetched
  - repo: local
    hooks:
      - id: typos
        name: typos
        language: python
        additional_dependencies: [typos==1.49.0]
        entry: typos
        args: [--write-changes, --force-exclude]
        types: [text]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # --fix: corrects in place, like every other fixing hook here
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  # how a link destination is spelled, which markdownlint has no rule for
  # and the documentation build depends on. docs.yml greps the built html
  # for `href="#./`: that is what myst renders in place of a link the
  # RootFileLinks transform in docs/source/conf.py cannot resolve -- an
  # anchor to an id no page has, which -W reports today and would stop
  # reporting the day suppress_warnings took myst.xref_missing back. A
  # grep can key on one spelling, so the destinations are spelled one way
  # and this hook is what keeps them that way, in the commit that writes
  # the link rather than in the artifact built from it.
  #
  # The rule is the prefix and not the extension, and the table in
  # btclib-org/btclib#1175 is what decides that: "DOES_NOT_EXIST.txt",
  # "sub/DOES_NOT_EXIST.md", "DOES_NOT_EXIST" and "../DOES_NOT_EXIST.md"
  # each reach myst's fallback, and each is missed by the union of both
  # greps a repository ran. An ".md"-scoped rule leaves all four
  # writable.
  #
  # README.md's licence badge was cited here as the live case for that,
  # and the citation was wrong in a way worth leaving on the record
  # rather than quietly swapping: "[![alt](src)](./LICENSE)" is a badge,
  # its destination sits behind a nested image, and the first version of
  # this pattern could not reach it at all -- link text was "[^]]*",
  # which stops at the "]" that closes the alt text, so the scan checked
  # the image src and never the badge's own href. The cited evidence was
  # the one destination the rule did not cover. It does now: the link
  # text below is "(?:[^]]|\]\([^)]*\))*", a character that is not "]"
  # or a whole "](...)" group, so the scan steps over the image and
  # reaches the destination behind it -- and, by backtracking, still
  # checks the image src on the way. Measured: a badge href renders
  # exactly what a plain href renders, "#./NOPE.md" written with the
  # prefix and "#NOPE.md", "#NOPE.txt", "#sub/NOPE.md", "#NOPE",
  # "#../NOPE.md" without it, so every row of the table above can be
  # written as a badge destination and only the first is caught
  # downstream. README.md and CONTRIBUTING.md carry badge links of that
  # shape, none of them violating the rule; `pre-commit run
  # local-link-prefix --all-files` is what re-derives that, here and in
  # the siblings.
  #
  # Measured here as well, by building this repository's documentation
  # with an unresolvable link written each way: "./page.md",
  # "./page.md#anchor", "./page.txt", "./sub/page.md" and an
  # extensionless "./page" each render "#./" and the destination, so the
  # one grep sees every one; the same destinations without the "./"
  # render the destination alone, which no single pattern reaches
  # without also matching the autodoc anchors these pages carry, such as
  # href="#bitcoin_core_rpc.BitcoinCoreRpcClient.call".
  #
  # "../" is the row with nothing downstream behind it at all, which is
  # why it is refused here rather than allowed as an ordinary relative
  # path: conf.py's transform declines a target that normalizes above
  # the repository root -- nothing above the root is a document this
  # build can answer for -- so that shape reaches myst's fallback by
  # design rather than by a gap in the transform, and renders
  # href="#../page.md", which the grep in docs.yml does not match and
  # should not be widened to. This hook is the only place it can be
  # caught.
  #
  # pygrep, and the same hook in every repository of this organization
  # (btclib-org/.github#20): there is no shared hook repository to put
  # it in, and `pinned-rev` above is that arrangement already. The
  # pattern asks for a whole `[text](destination)`, so grep output of the
  # form `FILE.md:21:](x.md)` carries no "[" and is not matched. The
  # lookbehind refuses a "[" preceded by a backtick, which is what lets
  # prose quote the refused shape in a code span -- and refuses one
  # preceded by "!" or "[" as well, so that a *quoted* badge is escaped
  # whole: without those two the scan would re-enter at the image inside
  # it and report the src. The leading "!?" is what keeps a standalone
  # image's own src checked despite that.
  #
  # A reference definition is a link too, and the second branch is for
  # it: "[label]: page.md" renders the same fallback as the inline form
  # -- measured on the built html -- and carries no "(", so the first
  # branch cannot see it. That branch is anchored at the start of the
  # line, which is what keeps it off a *use* site: "[label][ref]: the"
  # is prose in a sibling repository's changelog, and an unanchored
  # pattern reported it. At most three leading spaces, four making the
  # line an indented code block rather than a definition.
  #
  # What pygrep cannot see is a fenced block, being line based -- an
  # example of the refused shape inside one fails this hook, and the
  # code span is the way round it
  - repo: local
    hooks:
      - id: local-link-prefix
        name: a local markdown link destination begins with ./
        language: pygrep
        # one line, and no literal space in it -- "\x20" is the space the
        # reference branch allows -- so yamllint reads the value as a
        # single unbreakable word and its 100-column rule exempts it. A
        # block scalar rather than a quoted one for the same reason a
        # folded scalar was rejected: folding joins lines with a space,
        # which would land inside the regex
        entry: |-
          (?<![`!\[])(?:!?\[(?:[^]]|\]\([^)]*\))*\]\(|^\x20{0,3}\[[^]]+\]:\s*)(?!\./|#|[A-Za-z][A-Za-z0-9+.-]*:)[^)\s]
        types: [markdown]
      # a line that ends inside a word, at that word's own hyphen.
      # Section 4 of the organization standard is the rule: what such a
      # line renders as, why nothing else here catches it, what this
      # pattern cannot see, and what the measurement was before it was
      # proposed
      - id: no-hyphen-at-end-of-line
        name: a word is not wrapped at its own hyphen
        language: pygrep
        entry: "[A-Za-z0-9]-$"
        types: [markdown]
  # what ruff-format is for Python, on the structured files ruff does not
  # read: yaml, and the jsonc that carries a comment. Before yamllint below,
  # so the linter judges the formatted file and not the one that was typed.
  #
  # Not the archived pre-commit/mirrors-prettier, which stopped at prettier
  # 2. The default configuration and no .prettierrc: what this tree already
  # writes is what prettier writes, the exception being an inline sequence
  # long enough to be exploded, and a block sequence -- which prettier
  # leaves alone -- is the spelling that keeps one entry per line whatever
  # the width.
  #
  # `files` is an allow list and not an exclude, because prettier reads more
  # than it should be given here. markdown is markdownlint's, whose config
  # settles the styles prettier would also have an opinion about;
  # tests/_data holds bodies bitcoind wrote, one line each, which the README
  # beside them makes a claim about; .secrets.baseline is detect-secrets'
  # own output. Every other structured file in the tree is in scope,
  # .markdownlint.jsonc included, and that is also what parses them --
  # check-json above cannot read a comment, and prettier fails on a file it
  # cannot parse
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier (yaml and jsonc, in place fixes)
        files: ^(.*\.ya?ml|\.vscode/.*\.json|\.markdownlint\.jsonc)$
  # the same for toml, which is pyproject.toml and nothing else here:
  # uv.lock is toml to identify and therefore matched by the hook's own
  # types, and it is uv's file to write. .taplo.toml holds the formatting
  # choices and the reasoning for them, as .yamllint.yaml and [tool.typos]
  # do. taplo-lint is not enabled beside this: it validates against a schema
  # catalogue it fetches, and pyroma and check-sdist below already read
  # this file, and build from it, offline
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: taplo (toml, in place fixes)
        exclude: ^uv\.lock$
  # the shape of a yaml file, which nothing else here reads: the hook
  # above holds markdown to 80 columns and ruff holds Python comments and
  # docstrings to the same, and the workflows were the one place prose
  # could grow without a limit. Width is the half of this a sibling gate
  # could in principle have covered; a key written twice, a block
  # indented under nothing, a value that is octal by accident are read by
  # nothing else at all.
  # Configured in .yamllint.yaml rather than in args here, as codespell
  # and typos are configured in pyproject.toml: every place that file
  # departs from the default set carries the reason it does, and a hook
  # argument has no room for a paragraph. That file is the organization's
  # copy, byte for byte, which is why the reasoning is not restated here
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (the default rule set, less two)
  # the width of a toml comment, which was the last prose here held to
  # nothing: markdown has MD013, a Python comment has W505, a yaml line
  # has yamllint above, and [tool.ruff.lint.pycodestyle] in pyproject.toml
  # names 80 columns as the width of every comment in this tree while
  # nothing read toml for it. A local pygrep rule because nothing off the
  # shelf does it: taplo above formats values and leaves comments alone,
  # by design, a formatter that reflowed prose being a formatter that
  # rewrites it.
  # `.{80}\S*[ \t]` reports a line only when whitespace is left past
  # column 80, which is MD013's amnesty and ruff's: a comment ending in a
  # link that cannot be broken is not a defect. Without the amnesty this
  # would be stricter on toml prose than the rules it mirrors are on the
  # same sentences in a .py or a .md.
  # The `#` after optional indent selects a comment and not a long value:
  # `addopts` in pyproject.toml is a single token no width can break, and
  # a value is not prose.
  # pygrep matches bytes, so a non-ascii character would count as its
  # utf-8 length. Every toml file here is ascii today, and the error is
  # in the safe direction anyway -- a line reported one column early is
  # rewrapped, never a line silently let through
  - repo: local
    hooks:
      - id: toml-comment-width
        name: toml comment width (80 columns, unbreakable links exempt)
        language: pygrep
        entry: '^(?=[ \t]*#).{80}\S*[ \t]'
        files: \.toml$
  # .github/dependabot.yml is validated by nothing else here: check-yaml
  # above asks whether it is yaml, and actionlint below reads workflows
  # and not this. A typo in a package-ecosystem or a directory is not an
  # error to GitHub -- it silently updates nothing, and the evidence is a
  # pull request that never arrives, so "it stopped running and said
  # nothing" is exactly the failure to guard against.
  # check-github-workflows is not added beside it: actionlint already
  # reads every workflow and goes further than the schema does, into
  # expressions, contexts and runner labels.
  # .readthedocs.yaml is the same argument again: yaml that check-yaml
  # reads as yaml and nothing reads as a build definition, on a service
  # whose failure mode is a docs build that stops happening
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-readthedocs
  # the workflows are yaml with expressions in it, and nothing else
  # validates them: an unknown key, a typo in a context reference, an
  # action input that does not exist, a job depending on a job that is not
  # there are all things a run discovers by failing.
  # The Python packaging of actionlint rather than the upstream hook, whose
  # only non-docker id is language: golang, i.e. a go toolchain on every
  # machine that commits and on pre-commit.ci
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    # not below actionlint 1.7.12: its list of runner labels is compiled
    # in, and 1.7.9 does not know macos-26-intel, which the test matrix
    # runs on
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        name: actionlint (github workflows)
        # actionlint delegates the body of a run: step to shellcheck, and
        # of a "shell: python" step to pyflakes, if it finds them on the
        # PATH: without them it validates the yaml around a shell script
        # and not the script. Declared here rather than installed by hand,
        # so that every machine and pre-commit.ci check what CI checks --
        # the runner image happens to carry shellcheck, so leaving it to
        # chance would mean CI checking more than a commit does.
        # Pinned, because nothing bumps an additional dependency:
        # pre-commit.ci moves rev, dependabot has no pre-commit ecosystem.
        # That is the point rather than the cost -- a shellcheck release
        # adding a check would otherwise turn a pull request red for
        # having changed nothing
        additional_dependencies:
          - shellcheck-py==0.11.0.1
          - pyflakes==3.4.0
  # actionlint asks whether a workflow is correct, zizmor whether it is
  # safe: a token persisted where a later step can read it, a cache
  # restored into the job that builds what gets published, an expression
  # interpolated into a shell script, a trigger that runs a fork's code
  # with write access. The default persona is the gate; --persona=auditor
  # adds advice and is worth running by hand rather than on every commit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # offline is what it does by default, said out loud: it warns about
        # the implicit choice on every run, and the choice is the right one.
        # Two audits can query GitHub for the actions a workflow pins --
        # impostor-commit and known-vulnerable-actions -- which would make
        # the hook want a token and report differently on a machine that
        # has none. Those two therefore stay unrun, here and in CI.
        # --no-progress is repeated rather than added: args replaces what
        # the hook declares, and that flag is the whole of what it declares,
        # so passing --offline alone would drop it
        args: [--offline, --no-progress]
  # ruff replaces autoflake, bandit, black, copyright_notice_precommit,
  # docformatter, flake8, isort, pydocstringformatter, pydocstyle, pylint,
  # pyupgrade, and yesqa
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        name: ruff check (in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff format (in place fixes)
  # what ruff's D rules do not reach: they ask that a docstring exists, and
  # this asks that the arguments and the return it documents are the ones
  # the signature declares -- the half that goes wrong in silence when a
  # signature changes and the prose above it does not. The configuration is
  # in pyproject.toml, next to the ruff one, and says which of its checks
  # are off here and why.
  #
  # Scoped to bitcoin_core_rpc, which is where the contract has to be
  # written down: the module is meant to be copied out of a distribution,
  # so what a consumer reads is help() and an IDE tooltip on that one file,
  # with no README beside it. Neither of the two other trees is that -- a
  # test documents what it claims and not the fixtures it takes, and
  # .github/scripts is read from the source tree by whoever changes it
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint
        name: pydoclint (arguments and return values)
        args: [--config=pyproject.toml]
        files: ^src/bitcoin_core_rpc/.*\.py$
  # a child process decoded through `text=True` takes the locale's
  # encoding, by the same rule an `open` without one does -- what a
  # failure reports then depends on what Windows decoded the child's
  # stderr as, and the standalone test runs the copied module under a
  # second interpreter with its output captured. No linter here has an
  # opinion on the keyword: ruff's unspecified-encoding reads `open` and
  # the pathlib and tempfile spellings and stops there, and this tree
  # does not select it (issue #225).
  # `encoding=` is what the call wanted anyway: passing it puts subprocess
  # in text mode, so the fix is one keyword in place of another and never
  # a mode change.
  # A literal keyword rather than a call-shaped pattern, because pygrep is
  # line based and a call like that spans several lines. It costs nothing
  # to be that blunt: there is no reason to write `text=True` that
  # `encoding="utf-8"` does not answer
  - repo: local
    hooks:
      - id: decoded-subprocess-encoding
        name: a decoded subprocess names its encoding, not text=True
        language: pygrep
        entry: '\b(text|universal_newlines)=True'
        files: \.py$
  # Scoped to bitcoin_core_rpc, which is what actually travels when this
  # file is vendored: a comment here is read by someone who took only
  # this file and has never heard of btclib. The organization that
  # publishes the package is allowed -- "btclib-org" in a URL, "The
  # btclib developers" in the copyright line -- because a consumer does
  # care who publishes it; naming the downstream package that depends on
  # this one is not.
  - repo: local
    hooks:
      - id: no-downstream-name-in-package
        name: the shipped module does not name btclib, org spelling excepted
        language: pygrep
        args: ["-i"]
        entry: 'btclib(?!-secp256k1|_secp256k1|-org|\.org|-node|_node|-benchmarks| developers)'
        files: ^src/bitcoin_core_rpc/.*\.py$
  # not the mirrors-mypy hook: it injects --ignore-missing-imports, which
  # turns an unresolved (or misspelled) import into Any, the opposite of
  # strict, and it type checks in an isolated environment, where the
  # project itself is not installed -- so `import bitcoin_core_rpc` in a
  # test would be Any and every assertion about it would check out
  # vacuously. This is the very command the lint workflow runs, against
  # the project environment and the real pytest.
  # --locked, as everywhere else, and not --frozen, which takes uv.lock as
  # it finds it: a dependency added to pyproject.toml without a re-lock
  # leaves mypy type checking a stale environment and saying nothing about
  # it.
  # .github/scripts is in the scope because what lives there imports the
  # module and no test collects it: the smoke script needs a node, so a
  # workflow dispatch is the only thing that runs it, and strict mode is
  # the whole of what reads it in between
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the project environment)
        entry: >
          uv run --locked --no-default-groups --group lint --group test
          mypy src/bitcoin_core_rpc tests .github/scripts
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      # keep uv.lock in sync with pyproject.toml
      - id: uv-lock
  # what is tracked and not in the sdist, and what is in the sdist and not
  # tracked, both ways round, against the patterns of
  # [tool.uv.build-backend]. --no-isolation is in the hook's own entry, and
  # pre-commit.ci requires it -- an isolated build environment cannot be
  # created there (no ensurepip in the interpreter, read-only virtualenv app
  # data).
  # --installer=pip is what has the archive packed by the backend named
  # below. The default is uv|pip, which resolves to uv wherever the `uv`
  # package is importable or a uv is on PATH, and check-sdist then runs
  # `uv build` -- not PEP 517 for this backend: given a requires the running
  # uv satisfies, uv builds with the copy of uv_build bundled in itself,
  # whatever the environment holds, so a specifier here would decide
  # nothing. With --installer=pip check-sdist runs
  # `python -m build --no-isolation`, which does read the hook environment.
  # What that keeps is the environment inside [build-system]'s requires,
  # `build` refusing one that falls outside it with `ERROR Missing
  # dependencies`. It does not keep the two specifiers equal: a requires
  # widened past the line below leaves that line satisfying it and green,
  # the half btclib-org/.github#145 leaves open.
  # args: and additional_dependencies: each replace the manifest's list
  # rather than adding to it, so --inject-junk is repeated and the uv the
  # manifest installs is out of the environment, which the pip installer
  # does not need. --inject-junk plants the tool's own list of leavings
  # beside the sources for the length of the run; the one of them a pattern
  # here reaches is tests/package/anything.egg-info, which is what
  # source-exclude in [tool.uv.build-backend] answers.
  # Section 12 of btclib-org/.github is the rule (btclib-org/.github#197)
  - repo: https://github.com/henryiii/check-sdist
    rev: v1.6.0
    hooks:
      - id: check-sdist
        args: [--inject-junk, --installer=pip]
        additional_dependencies: ["uv_build>=0.12.5,<0.13"]
  # pyroma reads the metadata through `build` too, which takes its
  # non-isolated path where the environment satisfies requires and falls
  # back to an isolated build otherwise. The specifier is [build-system]'s
  # own, so the environment satisfies the declaration by construction and
  # the fallback -- a virtual environment pre-commit.ci cannot create -- is
  # never asked for
  - repo: https://github.com/regebro/pyroma
    rev: "5.0.1"
    hooks:
      - id: pyroma
        additional_dependencies: ["uv_build>=0.12.5,<0.13"]
